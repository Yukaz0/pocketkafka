name: Release

# Provenance rilis: artefak biner + SBOM di-attestasi GitHub (SLSA-style)
# sehingga asal-usul biner dapat diverifikasi pihak ketiga.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for spec in "linux/amd64 pocketkafka-linux-amd64" "linux/arm64 pocketkafka-linux-arm64"; do
            set -- $spec
            CGO_ENABLED=0 GOOS=linux GOARCH="${1#linux/}" \
              go build -trimpath -buildvcs=true \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/$2" ./cmd/server
            CGO_ENABLED=0 GOOS=linux GOARCH="${1#linux/}" \
              go build -trimpath -buildvcs=true \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/pkctl-${1#linux/}" ./cmd/kctl
            CGO_ENABLED=0 GOOS=linux GOARCH="${1#linux/}" \
              go build -trimpath -buildvcs=true \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/fleet-agent-linux-${1#linux/}" ./cmd/fleet-agent
            CGO_ENABLED=0 GOOS=linux GOARCH="${1#linux/}" \
              go build -trimpath -buildvcs=true \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/pocketkafka-mcp-linux-${1#linux/}" ./cmd/mcp-server
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/pocketkafka-windows-amd64.exe" ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/pkctl-windows-amd64.exe" ./cmd/kctl
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/fleet-agent-windows-amd64.exe" ./cmd/fleet-agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/pocketkafka-mcp-windows-amd64.exe" ./cmd/mcp-server
          ./dist/pocketkafka-linux-amd64 about
          ./dist/fleet-agent-linux-amd64 -version
      - name: Attest binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.3.0
        with:
          subject-path: 'dist/pocketkafka-*, dist/pkctl-*, dist/fleet-agent-*, dist/pocketkafka-mcp-*'

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/pocketkafka-sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Attest SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.3.0
        with:
          subject-path: 'dist/pocketkafka-sbom.cdx.json'

      - name: Checksum everything
        run: |
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/pocketkafka-linux-amd64
            dist/pocketkafka-linux-arm64
            dist/pkctl-amd64
            dist/pkctl-arm64
            dist/fleet-agent-linux-amd64
            dist/fleet-agent-linux-arm64
            dist/pocketkafka-mcp-linux-amd64
            dist/pocketkafka-mcp-linux-arm64
            dist/pocketkafka-windows-amd64.exe
            dist/pkctl-windows-amd64.exe
            dist/fleet-agent-windows-amd64.exe
            dist/pocketkafka-mcp-windows-amd64.exe
            dist/SHA256SUMS.txt
            dist/pocketkafka-sbom.cdx.json
