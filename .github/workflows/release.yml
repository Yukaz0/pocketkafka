name: Release

# Provenance rilis: artefak biner + SBOM di-attestasi GitHub (SLSA-style)
# sehingga asal-usul biner dapat diverifikasi pihak ketiga.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for spec in "linux/amd64 pocketkafka-linux-amd64" "linux/arm64 pocketkafka-linux-arm64"; do
            set -- $spec
            CGO_ENABLED=0 GOOS=linux GOARCH="${1#linux/}" \
              go build -trimpath -buildvcs=true \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/$2" ./cmd/server
            CGO_ENABLED=0 GOOS=linux GOARCH="${1#linux/}" \
              go build -trimpath -buildvcs=true \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/pkctl-${1#linux/}" ./cmd/kctl
            CGO_ENABLED=0 GOOS=linux GOARCH="${1#linux/}" \
              go build -trimpath -buildvcs=true \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/fleet-agent-linux-${1#linux/}" ./cmd/fleet-agent
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/pocketkafka-windows-amd64.exe" ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/pkctl-windows-amd64.exe" ./cmd/kctl
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/fleet-agent-windows-amd64.exe" ./cmd/fleet-agent
          ./dist/pocketkafka-linux-amd64 about
          ./dist/fleet-agent-linux-amd64 -version
      - name: Attest binaries
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v2.3.0
        with:
          subject-path: 'dist/pocketkafka-*, dist/pkctl-*, dist/fleet-agent-*'

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/pocketkafka-sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Attest SBOM
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v2.3.0
        with:
          subject-path: 'dist/pocketkafka-sbom.cdx.json'

      - name: Checksum everything
        run: |
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          files: |
            dist/pocketkafka-linux-amd64
            dist/pocketkafka-linux-arm64
            dist/pkctl-amd64
            dist/pkctl-arm64
            dist/fleet-agent-linux-amd64
            dist/fleet-agent-linux-arm64
            dist/pocketkafka-windows-amd64.exe
            dist/pkctl-windows-amd64.exe
            dist/fleet-agent-windows-amd64.exe
            dist/SHA256SUMS.txt
            dist/pocketkafka-sbom.cdx.json
