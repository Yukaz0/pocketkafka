name: Interop

# External-client interoperability. The native client check runs on every PR
# that touches the protocol, handler, server, or coordinator; the full Docker
# matrix (kcat/librdkafka, KafkaJS) runs on a schedule and on demand because it
# is slow and needs the Docker daemon.
on:
  pull_request:
    paths:
      - 'pkg/protocol/**'
      - 'internal/handler/**'
      - 'internal/server/**'
      - 'internal/coordinator/**'
      - 'test/interop/**'
      - '.github/workflows/interop.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege: this workflow only checks out and builds the repo.
permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Native client interop
        run: test/interop/run.sh

  external:
    # Only the nightly/dispatch runs exercise the Docker matrix.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Full external client matrix
        env:
          INTEROP_DOCKER: '1'
        run: test/interop/run.sh
