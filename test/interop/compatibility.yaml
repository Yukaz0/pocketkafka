# PocketKafka external-client compatibility manifest.
#
# This file is the auditable source of truth for which clients and protocol
# versions the broker claims to support. Every entry must have a corresponding
# executable check; do not add a client here before its checks pass.
#
# See .hermes/plans/2026-09-16_102813-pocketkafka-production-hardening.md
# (Milestone 5) for the rationale.

version: 1

# Operations every client in the matrix must complete.
operations:
  - metadata
  - create_topic
  - produce
  - fetch
  - join_group
  - sync_group
  - commit_offset
  - fetch_offset
  - reconnect
  - restart_resume

clients:
  - name: pocketkafka-native
    kind: go
    module: github.com/Yukaz0/pocketkafka/pkg/client
    status: supported
    notes: In-tree SDK; covered by internal/e2e tests.

  - name: sarama
    kind: go
    module: github.com/IBM/sarama
    status: planned
    notes: Requires an external interop job (test/interop).

  - name: franz-go
    kind: go
    module: github.com/twmb/franz-go
    status: planned

  - name: kcat
    kind: cli
    implementation: librdkafka
    status: planned
    notes: Modern librdkafka.

  - name: librdkafka-legacy
    kind: cli
    implementation: librdkafka
    broker_version_fallback: "0.9.0"
    status: supported
    notes: >
      Legacy fallback path. Covered by the ListOffsets v0 OldStyleOffsets fix
      and internal/e2e/list_offsets_legacy_test.go.

  - name: kafkajs
    kind: node
    module: kafkajs
    status: planned

# Protocol versions the broker advertises. Adjust together with
# pkg/protocol/types.go maxVersions.
api_versions:
  Produce: 3
  Fetch: 5
  ListOffsets: 5
  Metadata: 8
  OffsetCommit: 7
  OffsetFetch: 5
  FindCoordinator: 2
  JoinGroup: 5
  Heartbeat: 3
  LeaveGroup: 3
  SyncGroup: 3
  DescribeGroups: 3
  ListGroups: 3
  SaslHandshake: 1
  ApiVersions: 2
  CreateTopics: 4
  DeleteTopics: 3
  InitProducerID: 2
  SaslAuthenticate: 2
  DeleteGroups: 1
  # Transactional APIs (AddPartitionsToTxn=24, AddOffsetsToTxn=25, EndTxn=26)
  # are intentionally NOT advertised: the broker has no transaction state and
  # answers UNSUPPORTED_VERSION (fail closed).
