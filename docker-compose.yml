services:
  # 2. PostgreSQL Database
  postgres:
    # postgis image (Alpine PG16 + PostGIS) agar schema scada23* dari prod (167 kolom geometry) bisa diakses
    image: postgis/postgis:16-3.5-alpine
    container_name: local-postgres
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devdb
    ports:
      # Bound to loopback: a development database with a well-known password
      # must not be reachable from the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. All-in-One Custom Go Kafka Engine (pocketkafka)
  #    Single Binary Container:
  #    - Port 9092 & 29092: Kafka Wire Protocol (Menggantikan Redpanda/Kafka)
  #    - Port 8080: Embedded Web UI Dashboard (Control Center)
  #    - Port 8081: Embedded Schema Registry (Menggantikan cp-schema-registry)
  #    - Port 8082: HTTP REST Proxy
  #    Profiling (pprof) tidak diaktifkan di sini: lihat docker-compose.debug.yml.
  #    Konsumsi RAM: < 60MB (Ultra Lightweight)
  kafka-engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${PK_VERSION:-dev}
    image: pocketkafka:latest
    container_name: local-kafka
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always
    # Hardening container. read_only hanya aman karena semua berkas yang ditulis
    # broker berada di KAFKA_DATA_DIR (volume) / tmpfs; entrypoint masih boleh
    # su-exec ke uid 10001 sebab no-new-privileges melarang penambahan hak, bukan
    # pelepasan hak. Capability yang tersisa hanya yang dipakai entrypoint:
    # CHOWN/DAC_OVERRIDE/FOWNER untuk mengambil alih data dir milik root (sekali,
    # untuk volume lama) dan SETUID/SETGID untuk turun ke pengguna tanpa hak.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    ports:
      - "9092:9092"   # Kafka API (host / luar container)
      - "29092:29092" # Kafka API (internal docker network)
      - "8080:8080"   # Embedded Web UI Dashboard (Buka di browser)
      - "8081:8081"   # Embedded Schema Registry
      - "8082:8082"   # HTTP REST Proxy Gateway
      - "1883:1883"   # MQTT Bridge (IoT)
      - "18090:18090" # Fleet listener (agent langsung; UI pakai proxy 8080)
    environment:
      - KAFKA_WEB_AUTH_SECRET=${KAFKA_WEB_AUTH_SECRET:?set KAFKA_WEB_AUTH_SECRET (>=16 chars)}
      - KAFKA_FLEET_SECRET_KEY=${KAFKA_FLEET_SECRET_KEY:?set KAFKA_FLEET_SECRET_KEY (>=16 chars)}
      - KAFKA_DATA_DIR=/var/lib/pocketkafka/data
      - KAFKA_LOG_LEVEL=info
    command: ["--config", "/etc/pocketkafka/config.docker.yaml"]
    volumes:
      - kafka_data:/var/lib/pocketkafka/data
      - ./config/config.docker.yaml:/etc/pocketkafka/config.docker.yaml:ro
      - ./secrets/admin_password.txt:/run/secrets/admin_password:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/pocketkafka", "healthcheck", "--addr", "127.0.0.1:9092"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  kafka_data:
