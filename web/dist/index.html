<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketKafka</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#3659d0">
<link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/sf-mono" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#12141a; --bg-canvas:#0e1015; --surface:#1b1e24; --surface2:#22262e; --surface3:#2a2f39;
    --border:#2e3440; --border-soft:rgba(255,255,255,.06);
    --primary:#4c7dff; --primary-strong:#3d66d9; --primary-soft:rgba(76,125,255,.14); --primary-text:#8ab0ff; --accent:#4c7dff; --on-primary:#ffffff;
    --live:var(--success); --success:#3ecf8e; --warn:#e8b339; --danger:#f16a5c;
    --str:#7ee0a3; --num:#7cb8ff; --bool:#ecc86b; --key:#dfe5ee;
    --text:#e8ecf3; --muted:#98a2b3;
    --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','SF Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
    --font-mono:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Monaco,Consolas,monospace;
    --rail-w:56px; --radius:4px; --radius-sm:4px;
    --ring:0 0 0 1px var(--primary);
    --danger-soft:rgba(241,106,92,.12); --danger-line:rgba(241,106,92,.4); --danger-text:#f5a49b; --success-soft:rgba(62,207,142,.14); --success-line:rgba(62,207,142,.42); --warn-soft:rgba(232,179,57,.14); --warn-line:rgba(232,179,57,.42); --shade:rgba(8,10,14,.6); --overlay:rgba(8,10,14,.5);
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#f0f2f5; --bg-canvas:#e8eaef; --surface:#ffffff; --surface2:#eef0f3; --surface3:#e5e8ee;
    --border:#d7dbe2; --border-soft:rgba(15,18,25,.06);
    --primary:#2f6bff; --primary-strong:#2450c8; --primary-soft:rgba(47,107,255,.10); --primary-text:#2450c8; --accent:#2f6bff; --on-primary:#fff;
    --success:#188554; --warn:#805600; --danger:#b3261e;
    --live:var(--success);
    --danger-soft:#fce8e6; --danger-line:#b3261e; --danger-text:#8f1d18; --success-soft:#e2f3e9; --success-line:#188554; --warn-soft:#fff1ce; --warn-line:#805600; --shade:rgba(15,18,25,.12); --overlay:rgba(15,18,25,.48);
    --str:#188554; --num:#2450c8; --bool:#a8700a; --key:#2a3340;
    --text:#1a2029; --muted:#5c6674;
    --shadow:0 8px 24px rgba(15,20,40,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .appShell{flex:1;display:flex;min-height:0;min-width:0}
  .appNav{width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;transition:width .16s,flex-basis .16s}
  .appNavHead{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;overflow:hidden}
  .appNavHead i{width:8px;height:8px;flex:0 0 8px;background:var(--primary)}
  .appNavScroll{flex:1;overflow:auto;padding:10px 8px}
  .navGroup{margin:4px 0 14px}
  .navGroupLabel{padding:6px 8px;color:var(--muted);font:500 10px var(--font-mono);letter-spacing:.04em}
  .navGroupToggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 8px;border:0;background:none;color:var(--muted);font:500 10px var(--font-mono);letter-spacing:.04em;text-align:left;cursor:pointer}
  .navGroupToggle:hover{color:var(--text)}
  .navGroupToggle:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .navGroup.is-collapsed .navGroupChevron{transform:rotate(-45deg)}
  .navGroup.is-collapsed .navGroupLinks{display:block}
  .navGroup.is-collapsed .navGroupLinks .navLink:not(.active){display:none}
  .navLink{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 9px;border:1px solid transparent;border-radius:4px;background:none;color:var(--muted);text-align:left;font:500 12px var(--font-ui);cursor:pointer}
  .navLink svg{width:18px;height:18px;flex:0 0 18px}
  .navLink:hover{background:var(--surface2);color:var(--text)}
  .navLink.active{background:var(--primary-soft);border-color:var(--border);color:var(--primary-text)}
  .navLink:focus-visible,.navToggle:focus-visible,.themeToggle:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .navFooter{padding:10px 8px;border-top:1px solid var(--border);display:grid;gap:6px}
  .navToggle,.themeToggle{min-height:36px;padding:6px 9px;border:1px solid transparent;border-radius:4px;background:none;color:var(--muted);display:flex;align-items:center;gap:10px;text-align:left;font:500 12px var(--font-ui);cursor:pointer}
  .navToggle:hover,.themeToggle:hover{background:var(--surface2);color:var(--text)}
  .navToggle svg,.themeToggle svg{width:18px;height:18px;flex:0 0 18px}
  .appNav.collapsed{width:56px;flex-basis:56px}
  .appNav.collapsed .appNavHead{padding:0 23px}
  .appNav.collapsed .appNavHead span{display:none}
  .appNav.collapsed .navGroupLabel,.appNav.collapsed .navGroupToggle span:first-child,.appNav.collapsed .navText,.appNav.collapsed .navActionText{display:none}
  .appNav.collapsed .navGroupToggle{justify-content:center;padding:6px 0}
  .appNav.collapsed .navLink,.appNav.collapsed .navToggle,.appNav.collapsed .themeToggle{justify-content:center;padding:6px 0}
  .sideBackdrop{display:none}
  .ws{flex:1;display:flex;min-height:0;min-width:0}
  .content{flex:1;display:flex;flex-direction:column;min-width:0}
  .plist{width:230px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;flex-shrink:0}
  .plist .ph{padding:9px 12px;border-bottom:1px solid var(--border);font:600 10px var(--font-mono);letter-spacing:.04em;color:var(--muted)}
  .plist input{margin:10px;background:var(--bg-canvas);border:1px solid var(--border);color:var(--text);font:11.5px var(--font-mono);padding:6px 9px;width:calc(100% - 20px)}
  .plist input:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .plist[hidden]{display:none}
  .topicTools{display:none}
  .topicTools[hidden]{display:none}
  .themeIconLight{display:none}
  html[data-theme="light"] .themeIconDark{display:none}
  html[data-theme="light"] .themeIconLight{display:block}
  #view{flex:1;overflow:auto;min-width:0;padding:20px}
  #view>div{max-width:1440px;margin:0 auto}
  .pageHeading{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 16px}
  .pageHeading h2{font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
  .pageHeading p{margin-top:4px;color:var(--muted);font-size:12px;max-width:65ch}
  .overviewTop{display:grid;grid-template-columns:minmax(240px,.82fr) minmax(0,1.4fr);gap:12px}
  .overviewFacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-top:12px}
  .overviewFact{background:var(--surface);padding:11px 12px;min-width:0}
  .overviewFact dt{color:var(--muted);font:500 10px var(--font-mono);margin-bottom:5px}
  .overviewFact dd{font:600 18px/1.3 var(--font-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .overviewCharts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .overviewChartTitle{font-size:12px;font-weight:600}
  .overviewAttention{border-left:2px solid var(--warn);padding-left:10px;margin-top:9px}
  .overviewIssue{display:grid;grid-template-columns:minmax(90px,.45fr) minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--border-soft);align-items:start}
  .overviewIssue:first-child{border-top:0}
  .overviewLinks{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .pageHeading{justify-content:space-between}
  .pageHeadingActions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
  #view>div{min-width:0}
  .tableScroll{max-width:100%;min-width:0;overflow-x:auto;overscroll-behavior-x:contain}
  .appNav:not(.collapsed)~.ws{--drawer-left:224px}
  .appNav.collapsed~.ws{--drawer-left:56px}
  .card{min-width:0}
  .tableScroll table{min-width:760px}
  input,select,textarea,button{max-width:100%}
  @media(max-width:760px){.bwrap{flex-wrap:wrap}.sideIns{position:static;width:100%;max-height:none}}
  @media(max-width:1040px){.appNav{width:196px;flex-basis:196px}.appNav:not(.collapsed)~.ws{--drawer-left:196px}.overviewTop{grid-template-columns:1fr}.overviewCharts{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:760px){
    body{height:100dvh}
    .appNav{position:fixed;inset:0 auto 0 0;z-index:90;width:min(280px,84vw);transform:translateX(-100%);transition:transform .16s}
    .appNav.mobileOpen{transform:translateX(0)}
    .appNav.collapsed{position:relative;inset:auto;z-index:auto;width:56px;flex:0 0 56px;transform:none;transition:none}
    .appNav.collapsed .appNavHead{padding:0 23px}
    .appNav.collapsed .navGroupLabel,.appNav.collapsed .navGroupToggle span:first-child,.appNav.collapsed .navText,.appNav.collapsed .navActionText{display:none}
    .appNav.collapsed .navGroupToggle{justify-content:center;padding:6px 0}
    .appNav.collapsed .navLink,.appNav.collapsed .navToggle,.appNav.collapsed .themeToggle{justify-content:center;padding:6px 0}
    .appNav.collapsed.mobileOpen{position:fixed;inset:0 auto 0 0;z-index:90;width:min(280px,84vw);transform:translateX(0);transition:transform .16s}
    .appNav.collapsed.mobileOpen .appNavHead span{display:inline}
    .appNav.collapsed.mobileOpen .appNavHead{padding:0 14px}
    .appNav.collapsed.mobileOpen .navGroupLabel,.appNav.collapsed.mobileOpen .navGroupToggle span:first-child,.appNav.collapsed.mobileOpen .navText,.appNav.collapsed.mobileOpen .navActionText{display:block}
    .appNav.collapsed.mobileOpen .navGroupToggle{justify-content:space-between;padding:6px 8px}
    .appNav.collapsed.mobileOpen .navLink,.appNav.collapsed.mobileOpen .navToggle,.appNav.collapsed.mobileOpen .themeToggle{justify-content:flex-start;padding:6px 9px}
    .appNav.collapsed:not(.mobileOpen)~.ws .plist:not([hidden]){display:none;width:0;min-width:0;border:0}
    .appNav.collapsed:not(.mobileOpen)~.ws .plist:not([hidden]).mobileOpen{display:flex;width:min(280px,84vw);border-right:1px solid var(--border)}
    body .tb .chips{display:none}
    .appNav.collapsed:not(.mobileOpen)~.ws .topbar{padding:0 6px;gap:4px}
    .appNav.collapsed:not(.mobileOpen)~.ws #topActions{width:80px;max-width:80px;flex:0 0 80px}
    .appNav.collapsed:not(.mobileOpen)~.ws .crumb{display:none}
    .sideBackdrop.visible{display:block;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:89}
    .topicTools{display:flex}
    .plist{position:fixed;inset:0 auto 0 0;z-index:88;width:min(280px,84vw);transform:translateX(-100%);transition:transform .16s}
    .plist.mobileOpen{transform:translateX(0)}
    .wm{flex:0 1 auto;min-width:0}
    .tb{min-height:44px;height:auto}
    .tb .wm{padding:0 10px}
    .drw{left:0;right:0;width:100%;max-height:70dvh;z-index:95}
    #topActions{margin-left:auto;width:104px;min-width:0;max-width:104px;flex:0 0 104px;overflow:hidden}
    .topbar{padding:0 8px;gap:6px;overflow:hidden}
    .topbar .sp{min-width:0;flex:1}
    #title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #crumb{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #topActions .btn{padding:4px 7px;font-size:11px;white-space:nowrap}
    #view{padding:14px}
    .overviewFacts{grid-template-columns:repeat(2,minmax(0,1fr))}
    .overviewCharts{grid-template-columns:1fr}
    .alarmBanner{position:relative;flex-wrap:wrap}
  }
  @media(max-width:420px){.tb .wm{font-size:11px}#title{font-size:15px}.updatedAgo{display:none}.overviewFact dd{font-size:16px}.row{max-width:100%}}

  /* workbench chrome: titlebar / explorer / statusbar */
  .tb{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;padding-right:10px}
  .wm{display:flex;align-items:center;padding:0 16px;font-weight:600;font-size:13px;gap:8px;cursor:pointer;user-select:none}
  .wm:hover{color:var(--primary-text)}
  .wm img{width:20px;height:20px;flex:none;display:block;border-radius:5px}
  .tabs{display:flex;align-items:stretch;overflow-x:auto}
  .tab{display:flex;align-items:center;padding:0 13px;color:var(--muted);cursor:pointer;font-size:12.5px;border:none;background:none;font-family:var(--font-ui);white-space:nowrap}
  .tab:hover{color:var(--text);background:var(--surface2)}
  .tab.on{color:var(--text);background:var(--bg);box-shadow:inset 0 2px 0 var(--primary)}
  .chips{display:flex;align-items:center;gap:6px;font:10.5px var(--font-mono);color:var(--muted)}
  .chip2{border:1px solid var(--border);padding:2px 8px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.navLink:disabled{cursor:not-allowed;opacity:.48}
.navLink:disabled:hover{background:none;color:var(--muted)}
.clRowActions{display:flex;gap:6px;flex-wrap:wrap}
.clusterRowActions{display:flex;gap:10px;flex-wrap:nowrap;white-space:nowrap}
.brokerPicker{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px;color:var(--muted);white-space:nowrap}
.brokerPicker label{font:500 10px var(--font-mono);letter-spacing:.04em}
.brokerPicker select{width:180px;min-width:90px;padding:4px 7px;font-size:11px;background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.brokerPicker select:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
@media(max-width:520px){.brokerPicker{gap:4px;padding:0 5px}.brokerPicker select{width:112px;font-size:10px}}
@media(max-width:360px){.brokerPicker select{width:86px}}
  .chip2 i{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block}
  .ws{flex:1;display:flex;min-height:0}
  .content{flex:1;display:flex;flex-direction:column;min-width:0}
  .titem{padding:7px 12px;cursor:pointer;border-left:2px solid transparent}
  .titem:hover{background:var(--surface2)}
  .titem.on{background:var(--surface2);border-left-color:var(--primary)}
  .titem b{display:block;font:500 12px var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .titem span{display:block;font:10px var(--font-mono);color:var(--muted);margin-top:1px}
  .sbar{height:26px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 14px;font:10.5px var(--font-mono);color:var(--muted);flex-shrink:0;white-space:nowrap;overflow:hidden}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
  .slink{cursor:pointer}
  .slink:hover{color:var(--text)}
  .hero{display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:18px}
  .heroStats{display:flex;margin-left:auto}
  .hstat{padding:0 22px;border-left:1px solid var(--border)}
  .hstat:first-child{border-left:none;padding-left:0}
  .hstat .v{font:500 22px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
  .hstat .v small{font-size:11px;color:var(--muted);margin-left:2px}
  .hstat .k{font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:3px}
  .cbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font:10.5px var(--font-mono);padding:3px 10px;cursor:pointer;letter-spacing:.04em}
  .cbtn:hover{border-color:var(--primary);color:var(--primary-text)}
  .cbtn.ok{border-color:var(--live);color:var(--success)}
  /* topology svg */
  .topoSvg{width:100%;display:block}
  .topoSvg text{font-family:var(--font-mono);fill:var(--text);font-size:12px}
  .topoSvg text.sub{fill:var(--muted);font-size:9.5px}
  .topoSvg text.role{fill:var(--muted);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
  .nrect{fill:var(--surface2);stroke:var(--border);cursor:pointer}
  .nrect:hover{stroke:var(--primary)}
  .edge{stroke:var(--border);stroke-width:1.5;fill:none}
  .edge.hot{stroke:var(--primary);stroke-width:2}
  .errdot{fill:var(--danger)}
  /* node detail drawer */
  .drw{position:fixed;left:var(--drawer-left,224px);right:0;bottom:0;height:300px;background:var(--surface);border-top:1px solid var(--border);transform:translateY(100%);transition:transform .18s ease,z-index .01s;z-index:60;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .drw.open{transform:none}
  .drwHd{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-family:var(--font-mono)}
  .drwHd b{font-size:12px}
  .drwHd .x{margin-left:auto;cursor:pointer;color:var(--muted);border:none;background:none;font:14px var(--font-mono)}
  .drwHd .x:hover{color:var(--text)}
  .drwBody{flex:1;overflow:auto;padding:12px 18px}

  /* burger + drawer menu */
  .burger{display:none;width:36px;height:36px;border:1px solid var(--border);background:transparent;border-radius:4px;cursor:pointer;flex-direction:column;gap:4px;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s}
  .burger span{display:block;width:16px;height:2px;background:var(--text)}
  .burger:hover{background:var(--surface2)}
  /* Mobile only: at <=760px the sidebar is off-screen (translateX(-100%)),
     so this button is the only way to open the navigation. It is declared
     after the base rule on purpose: an equal-specificity override inside an
     earlier @media block loses the cascade to the later declaration. */
  @media(max-width:760px){.burger{display:flex}}

  .col{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
  .topbar h1{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:28px}
  .topbar .crumb{color:var(--muted);font-size:12px;font-family:var(--font-mono)}
  .topbar .sp{flex:1}
  #topActions{display:flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap}
  .btn{background:var(--primary);color:var(--on-primary);border:1px solid var(--primary);padding:7px 14px;border-radius:4px;font-weight:500;cursor:pointer;font-size:13px;font-family:var(--font-ui);transition:background .12s,border-color .12s}
  .btn:hover{background:var(--primary-strong);border-color:var(--primary-strong)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;box-shadow:none}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn.danger:hover{background:var(--surface2)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--surface2);border-color:var(--primary);color:var(--primary-text)}
  .btn.ghost:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost:disabled:hover{background:transparent;border-color:var(--border);color:var(--text)}
  .btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}

  main{flex:1;overflow:auto;padding:20px 24px;width:100%}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:18px;width:100%;margin-bottom:16px}
  .card h3{font-size:14px;font-weight:600}
  .grid{display:flex;flex-direction:column;gap:0}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  /* connection card */
  .conn{border:1px solid var(--border);transition:border-color .15s}
  .conn:hover{border-color:var(--primary)}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;margin-right:8px}
  .conn .tag{background:var(--primary-soft);color:var(--primary-text);border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;letter-spacing:.05em;margin-left:8px;font-family:var(--font-mono)}
  .conn .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12px}
  .conn .row:last-child{border-bottom:none}
  .conn .k{color:var(--muted)}
  .conn .actions{display:flex;gap:8px;margin-top:16px}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .toolbar .group{display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px}
  .toolbar .pill{background:transparent;border:none;color:var(--muted);padding:6px 11px;border-radius:3px;cursor:pointer;font-size:12px;transition:background .12s,color .12s}
  .toolbar .pill:hover{background:var(--surface2);color:var(--text)}
  .toolbar .pill.active{background:var(--primary-soft);color:var(--primary-text)}
  .pill.part{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:4px 10px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .12s;font-family:var(--font-mono)}
  .pill.part:hover{color:var(--text)}
  .pill.part.active{background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary)}
  select,input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:7px 11px;font-size:12px;transition:border-color .12s,box-shadow .12s;font-family:var(--font-ui)}
  select:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
  select option{background:var(--bg-canvas);color:var(--text)}
  input{width:100%}

  /* pulsing live dot */
  .live-dot{position:relative;display:inline-flex;width:9px;height:9px}
  .live-dot::before,.live-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live)}
  .live-dot::after{animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}

  /* row entry flash */
  @keyframes row-entry-flash{0%{background-color:rgba(62,207,142,.20);opacity:0}40%{background-color:rgba(62,207,142,.10);opacity:1}100%{background-color:transparent}}
  .animate-row-entry{animation:row-entry-flash 1s cubic-bezier(.16,1,.3,1) forwards}

  /* view fade-in */
  @keyframes view-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  #view>*{animation:view-in .18s ease-out}

  /* skeleton loading */
  .skel{display:inline-block;height:11px;border-radius:2px;background:var(--surface3);animation:skel-pulse 1.4s ease-in-out infinite;vertical-align:middle}
  @keyframes skel-pulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2)}
  td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;font-family:var(--font-mono);font-feature-settings:'tnum' on,'zero' on;font-variant-numeric:tabular-nums}

  tbody tr{transition:background .1s}
  tbody tr:hover td{background:var(--surface3)}
  .muted{color:var(--muted)}
  .rel{color:var(--muted);font-size:11px}
  .badge{display:inline-block;padding:2px 8px;border:1px solid transparent;border-radius:3px;font-size:10px;font-weight:700;font-family:var(--font-mono);letter-spacing:.03em}
  .b-green{background:var(--success-soft);color:var(--success)}
  .b-amber{background:var(--warn-soft);color:var(--warn)}
  .b-red{background:var(--danger-soft);color:var(--danger-text)}
  .b-purple{background:var(--primary-soft);color:var(--primary-text)}
  .chip{font-family:var(--font-mono);font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 7px;margin:0 2px}
  .rowclick{cursor:pointer}

  /* inspector */
  .inspector{background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-top:16px;padding:18px}
  /* master-detail: tabel kiri, detail json kanan */
  .bwrap{display:flex;gap:16px;align-items:flex-start}
  .bmain{flex:1;min-width:0}
  .sideIns{width:360px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px;position:sticky;top:8px;max-height:calc(100vh - 160px);overflow:auto}
  .inspector h3{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:12px;font-family:var(--font-mono)}
  pre{font-family:var(--font-mono);font-size:12px;font-feature-settings:'tnum' on,'zero' on;white-space:pre-wrap;word-break:break-word;background:var(--bg-canvas);border:1px solid var(--border);border-radius:4px;padding:12px;overflow:auto;line-height:1.6}
  .jkey{color:var(--key)}.jstr{color:var(--str)}.jnum{color:var(--num)}.jbool{color:var(--bool)}.jnull{color:var(--muted)}
  .jnode{padding-left:14px;border-left:1px solid var(--border-soft);margin-left:6px}
  .jrow{cursor:pointer;border-radius:2px;padding:1px 4px;transition:background .1s}
  .jrow:hover{background:var(--surface3)}
  .jarrow{display:inline-block;width:14px;color:var(--muted);font-family:var(--font-mono);font-size:10px}

  .kv{display:flex;gap:12px;margin-bottom:10px}.kv>div{flex:1}
  label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;font-weight:500}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:11px;font-family:var(--font-mono);font-size:12px;resize:vertical;transition:border-color .12s,box-shadow .12s}
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
  .msg{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--primary);color:var(--text);padding:12px 18px;border-radius:4px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;font-size:12px;transform:translateY(10px);z-index:50}
  .msg.show{opacity:1;transform:translateY(0)}
  .hdr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .hidden{display:none}
  a{color:var(--primary-text);text-decoration:none}
  a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  /* partition bars */
  .pbar{height:6px;border-radius:2px;background:var(--surface3);overflow:hidden;margin-top:4px}
  .pbar>span{display:block;height:100%;background:var(--primary);border-radius:2px}

  /* Fitur 3.2: filter builder */
  .filterPanel{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px;margin-bottom:16px}
  .filterRow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .filterRow select,.filterRow input{width:auto;flex:0 1 auto}
  .filterRow .fField{width:200px}
  .filterRow .fOp{width:120px}
  .filterRow .fVal{width:180px}
  .frmBtn{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:15px;line-height:1}
  .autocomplete{position:relative}
  .acList{position:absolute;top:100%;left:0;right:0;background:var(--surface3);border:1px solid var(--border);border-radius:4px;max-height:180px;overflow:auto;z-index:60;box-shadow:var(--shadow)}
  .acList div{padding:7px 11px;cursor:pointer;font-family:var(--font-mono);font-size:11px}
  .acList div:hover,.acList div.act{background:var(--primary-soft);color:var(--primary-text)}
  .presetChip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary-text);border-radius:3px;padding:2px 9px;font-size:11px;margin:2px 4px 2px 0;cursor:pointer}
  .presetChip button{background:none;border:none;color:inherit;cursor:pointer;font-size:11px;padding:0 2px}

  /* Fitur 3.3: column projection */
  .projBar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .projTag{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:2px 8px;font-size:11px;font-family:var(--font-mono)}
  .projTag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px}
  .projTag button:hover{color:var(--danger)}

  /* Fitur 3.4: message diff */
  .diffPanel{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px;margin-top:16px}
  .diffWrap{display:flex;gap:14px}
  .diffCol{flex:1;min-width:0}
  .diffCol h4{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:8px}
  .diffCol pre{max-height:360px;overflow:auto}
  .d-rem{background:var(--danger-soft);color:var(--danger-text)}
  .d-add{background:var(--success-soft);color:var(--success)}
  .d-ctx{color:var(--muted)}

  /* Fitur 3.5: replay / DLQ */
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:70;display:flex;align-items:center;justify-content:center}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px;width:min(620px,94vw);box-shadow:var(--shadow);animation:view-in .15s ease-out}
  .modal h3{font-size:15px;margin-bottom:14px}
  .chkCell{width:32px;text-align:center}

  /* Fitur 4.x enterprise */
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .topoLayer{margin-bottom:14px}
  .topoLayer:last-child{margin-bottom:0}
  .topoLabel{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;font-family:var(--font-mono)}
  .topoNodes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tRow{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .topoArrow{color:var(--muted);font-size:11px;margin:0 0 10px 2px;font-family:var(--font-mono)}
  .gNode{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:5px 10px;font-family:var(--font-mono);font-size:11px;text-align:center;white-space:nowrap}
  .skewBar{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
  .skewBar>div{flex:1;background:var(--primary);border-radius:2px 2px 0 0;position:relative;min-width:0}
  .skewBar>div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--muted)}
  .segBlock{height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--on-primary);margin:2px 0;overflow:hidden;white-space:nowrap}
  .segBlock.act{background:var(--primary)}
  .segBlock.closed{background:var(--surface3);border:1px solid var(--border);color:var(--muted)}
  .segBlock.remote{background:var(--success)}
  .toggle{position:relative;width:38px;height:20px;border-radius:4px;background:var(--surface3);cursor:pointer;border:1px solid var(--border);transition:background .12s}
  .toggle.on{background:var(--primary);border-color:var(--primary)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:2px;background:#fff;transition:transform .12s}
  .toggle.on::after{transform:translateX(18px)}
  .codeOut{background:var(--bg-canvas);border:1px solid var(--border);border-radius:4px;padding:12px;font-family:var(--font-mono);font-size:11px;overflow:auto;max-height:320px}
  .alarmBanner{position:fixed;top:0;left:0;right:0;z-index:80;padding:10px 18px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;background:var(--danger-soft);border-bottom:1px solid var(--danger-line);color:var(--danger-text)}
  .updatedAgo{color:var(--muted);font-size:11px;font-family:var(--font-mono);white-space:nowrap}

  /* hierarki visual (anti-monoton, tetap flat) */
  .kicker{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-family:var(--font-mono);margin-bottom:4px}
  .kicker::before{content:"";display:inline-block;width:16px;height:2px;background:var(--primary);margin-right:8px;vertical-align:3px}
  .statXL{font-family:var(--font-mono);font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .statXL small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:2px}
  .statSub{color:var(--muted);font-size:11px;margin-top:2px;font-family:var(--font-mono)}
  .hr{border:none;border-top:1px solid var(--border-soft);margin:14px 0}
  .secRule{height:1px;background:var(--border);margin:20px 0}
  .secRule::before{content:"";display:block}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;margin-right:8px}
  .brokerBadge{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 9px;font-family:var(--font-mono);font-size:11px}
  .brokerBadge .dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}

  /* compact density */
  /* Tabel pesan berjendela: hanya potongan yang terlihat yang dibangun. Tinggi
     baris dipatok (--virtRowH) karena tanpa pemaksaan itu sel Headers yang wrap
     membuat tinggi baris 53..171 px dan spacer meleset. */
  #rows.virt td{box-sizing:border-box;height:var(--virtRowH);line-height:var(--virtLh);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:none;vertical-align:middle}
  #rows.virt .hdr{flex-wrap:nowrap;overflow:hidden}
  #rows.virt tr.virtSpacer td{height:auto;line-height:0;padding:0;border:0}

  body.compact td{padding:4px 10px}
  body.compact th{padding:6px 10px}
  body.compact .card{padding:14px}
  body.compact .statXL{font-size:26px}

  /* sortable headers */
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--text)}
  th .sortInd{color:var(--primary);margin-left:4px}

  /* throughput sparkline (CSS bars) */
  .spark{display:flex;align-items:flex-end;justify-content:flex-end;gap:1px;height:56px;margin-top:10px;overflow:hidden}
  .spark>span{flex:1;background:var(--primary);border-radius:1px 1px 0 0;min-height:1px;min-width:1px;opacity:.85}

  /* command palette */
  .paletteBox{background:var(--surface);border:1px solid var(--border);border-radius:4px;width:min(520px,92vw);max-height:60vh;overflow:auto;box-shadow:var(--shadow)}
  .paletteBox input{border:none;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;font-size:14px}
  .paletteBox input:focus{box-shadow:none}
  .palItem{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .palItem:hover,.palItem.sel{background:var(--primary-soft);color:var(--primary-text)}
  .palItem .palHint{color:var(--muted);font-size:10px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em}

  /* log viewer */
  .logView{background:var(--bg-canvas);border:1px solid var(--border);border-radius:4px;padding:12px;font-family:var(--font-mono);font-size:11px;line-height:1.7;max-height:60vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .logView .lwarn{color:var(--warn)}
  .logView .lerr{color:var(--danger)}

  /* tail paused notice */
  .tailPausedBar{background:var(--primary-soft);color:var(--primary-text);border:1px solid var(--primary);border-radius:4px;padding:6px 12px;font-size:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<div class="tb">
  <div class="wm" onclick="goView('overview')" title="PocketKafka Overview"><img src="/favicon.svg" alt="" width="20" height="20">pocketkafka</div>
  <div class="brokerPicker"><label for="activeClusterSelect">Broker</label><select id="activeClusterSelect" aria-label="Broker" onchange="switchActiveCluster(this.value)"><option value="local">local (this broker)</option></select></div>
  <div class="chips">
    <span class="chip2" id="chipBroker"><i></i>broker -</span>
    <span class="chip2" id="chipSec">PLAINTEXT</span>
    <span class="chip2" id="chipVer">v-</span>
  </div>
  <span id="topActions" style="display:flex;align-items:center;gap:8px"></span>
</div>
<div class="appShell" id="appShell">
  <div class="sideBackdrop" id="navBackdrop" onclick="closeMobileDrawers()"></div>
  <aside class="appNav" id="appNav" aria-label="Main navigation">
    <div class="appNavHead"><i></i><span>Control center</span></div>
    <nav class="appNavScroll" id="navItems" aria-label="Application"></nav>
    <div class="navFooter">
      <button class="themeToggle" id="themeToggle" onclick="setTheme(state.theme==='dark'?'light':'dark')" aria-label="Switch color theme">
        <span class="themeIconDark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span><span class="themeIconLight"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="navActionText">Light theme</span>
      </button>
      <button class="navToggle" id="navToggle" onclick="toggleSidebar()" aria-label="Collapse sidebar" aria-expanded="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m8 5 8 7-8 7"/><path d="M4 5v14"/></svg><span class="navActionText">Collapse sidebar</span></button>
    </div>
  </aside>
  <div class="ws">
    <aside class="plist" id="plist">
      <div class="ph">Topics</div>
      <input id="tfilter" aria-label="Filter topics" placeholder="filter topics" oninput="renderTList(this.value)">
      <div id="tlist" style="overflow:auto;flex:1"></div>
    </aside>
    <div class="content">
      <header class="topbar">
        <button class="burger" id="burgerBtn" title="Open navigation" aria-label="Open navigation" aria-expanded="false" onclick="openDrawer()"><span></span><span></span><span></span></button>
        <button class="topicTools btn ghost" id="topicBtn" onclick="toggleTopicDrawer()" aria-expanded="false">Topics</button>
        <h1 id="title">Overview</h1><span class="crumb" id="crumb"></span><span class="sp"></span><span class="updatedAgo" id="updAgo"></span>
      </header>
      <main id="view"></main>
    </div>
  </div>
</div>
<div class="drw" id="drw">
  <div class="drwHd" id="drwHd"><b id="drwT"></b><button class="x" onclick="closeDrw()">[x]</button></div>
  <div class="drwBody" id="drwBody"></div>
</div>
<div class="msg" id="msg"></div>

<script>
const $=s=>document.querySelector(s);
const I={
  overview:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13a9 9 0 0 1 18 0"/><path d="M12 13l4-4"/><path d="M5 19h14"/></svg>',
  server:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6"/><rect x="3" y="14" width="18" height="6"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>',
  pulse:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l3-7 5 14 3-7h5"/></svg>',
  cluster:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="5"/><rect x="3" y="16" width="6" height="5"/><rect x="15" y="16" width="6" height="5"/><path d="M12 8v4M6 16v-4h12v4"/></svg>',
  chart:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-7"/></svg>',
  document:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>',
  shield:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M8 10h5M10.5 8v5"/></svg>',
  tag:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V4h8l10 10-7 7z"/><circle cx="7.5" cy="8" r="1"/></svg>',
  users:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2zM17 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></svg>',
  schema:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4H5v16h3M16 4h3v16h-3M10 8h4M10 12h4M10 16h4"/></svg>',

const KAFKA_UNSUPPORTED_VIEWS={producer:'Producing messages is disabled for read-only Kafka targets.',devstudio:'Developer Studio writes are not supported for Kafka targets.',schemas:'Schema Registry APIs are not supported for Kafka targets.',topology:'Topology is not available for Kafka targets.',storage:'Storage inspection is not available for Kafka targets.',logs:'Broker logs are not available for Kafka targets.',metrics:'Broker metrics are not available for Kafka targets.',integrations:'Integrations is not available for Kafka targets.'};
function navUnavailableReason(view){
  if(isTargetUnavailable()&&!['clusters','settings','security'].includes(view))return targetUnavailableMessage();
  if(!isKafkaTarget())return '';
  if(KAFKA_UNSUPPORTED_VIEWS[view])return KAFKA_UNSUPPORTED_VIEWS[view];
  const needed={overview:'health.read',health:'health.read',connections:'cluster',topics:'topics.read',groups:'groups.read',databrowser:'topic.messages.read',integrations:'integrations.read'}[view];
  if(needed&&!hasTargetCapability(needed))return `Selected Kafka target does not provide ${needed}.`;
  if(view==='topics'&&state.topicDetail&&!hasTargetCapability('topic.partitions.read'))return 'Topic partition details are not supported by this Kafka target.';
  if(view==='groups'&&state.group&&!hasTargetCapability('group.detail.read'))return 'Consumer group details are not supported by this Kafka target.';
  return '';
}

const LOCAL_API_PATH=/^\/api\/v1\/(?:auth(?:\/|$)|clusters(?:\/|$)|health\/clusters(?:\/|$))/;
function kafkaCapabilityFor(path,method){
  const u=new URL(path,location.href),p=u.pathname,m=(method||'GET').toUpperCase();
  if(p==='/api/v1/cluster'&&m==='GET')return 'cluster';
  if(p==='/api/v1/topics'&&m==='GET')return 'topics.read';
  if(/^\/api\/v1\/topics\/[^/]+\/partitions$/.test(p)&&m==='GET')return 'topic.partitions.read';
  if(/^\/api\/v1\/topics\/[^/]+\/messages$/.test(p)&&m==='GET')return 'topic.messages.read';
  if(p==='/api/v1/groups'&&m==='GET')return 'groups.read';
  if(/^\/api\/v1\/groups\/[^/]+$/.test(p)&&m==='GET')return 'group.detail.read';
  if(p==='/api/v1/health/overview'&&m==='GET')return 'health.read';
  return null;
}
function activeTargetEntry(){return (clusterRegistry||[]).find(c=>c.name===state.activeCluster)||null;}
function activeTargetKind(){return state.activeCluster==='local'?'local':(activeTargetEntry()?.kind||'');}
function isTargetUnavailable(){return state.activeCluster!=='local'&&!activeTargetEntry();}
function targetUnavailableMessage(){return `Selected broker "${state.activeCluster}" is unavailable. Select a registered broker; requests are not sent to this broker.`;}
function isKafkaTarget(){return activeTargetKind()==='kafka';}
async function apiError(r,j,targetRequest){
  if(r.status===401){
    if(targetRequest){
      let localSessionExpired=false;
      try{localSessionExpired=(await fetch('/api/v1/auth/status')).status===401;}catch(e){}
      if(!localSessionExpired)throw new Error(redactTargetEndpoint(j.error||r.status));
    }
    if(targetRequest||(state.auth&&state.auth.enabled)){showLogin();throw new Error('Authentication required');}
    throw new Error(redactTargetEndpoint(j.error||r.status));
  }
  if(!r.ok)throw new Error(redactTargetEndpoint(j.error||r.status));
  return j;
}
async function requestApi(p,o,targetRequest){
  o=Object.assign({},o||{});const m=(o.method||'GET').toUpperCase();
  if(m!=='GET'&&m!=='HEAD')o.headers=Object.assign({'X-PocketKafka-Request':'1'},o.headers||{});
  const r=await fetch(p,o);let j;try{j=await r.json();}catch(e){j={};}
  return apiError(r,j,targetRequest);
}
async function apiLocal(p,o){return requestApi(p,o);}
async function api(p,o){
  const u=new URL(p,location.href),method=(o&&o.method||'GET').toUpperCase();
  if(LOCAL_API_PATH.test(u.pathname))return apiLocal(p,o);
  const name=state.activeCluster,entry=name==='local'?null:activeTargetEntry();
  if(name!=='local'&&!entry)throw new Error(targetUnavailableMessage());
  if(entry&&(entry.kind||'').toLowerCase()==='kafka'){
    const capability=kafkaCapabilityFor(p,method);
    if(!capability)throw new Error(`Unsupported for Kafka targets: ${method} ${u.pathname}`);
    if(!(entry.capabilities||[]).includes(capability))throw new Error(`Selected broker "${name}" does not provide ${capability}.`);
  }
  const generation=state.targetGeneration,controller=new AbortController(),callerSignal=o&&o.signal;
  if(callerSignal?.aborted)throw new DOMException('Request aborted','AbortError');
  const abortFromCaller=()=>controller.abort();callerSignal?.addEventListener('abort',abortFromCaller,{once:true});state.targetRequests.add(controller);
  try{
    const path=name==='local'?p:`/api/v1/target/${encodeURIComponent(name)}${u.pathname}${u.search}`;
    const result=await requestApi(path,Object.assign({},o||{},{signal:controller.signal}),name!=='local');
    if(generation!==state.targetGeneration||name!==state.activeCluster){const stale=new Error('Target changed while request was in flight');stale.staleTargetResponse=true;throw stale;}
    return result;
  }catch(e){
    if(generation!==state.targetGeneration||name!==state.activeCluster){const stale=new Error('Target changed while request was in flight');stale.staleTargetResponse=true;throw stale;}
    throw e;
  }finally{state.targetRequests.delete(controller);callerSignal?.removeEventListener('abort',abortFromCaller);}
}

async function refresh(){
  const generation=state.targetGeneration;
  const tasks=[api('/api/v1/cluster').then(d=>state.cluster=d).catch(()=>{}),
    api('/api/v1/topics').then(d=>state.topics=d||[]).catch(()=>{}),
    api('/api/v1/groups').then(d=>state.groups=d||[]).catch(()=>{}),
    apiLocal('/api/v1/auth/status').then(d=>state.auth=d).catch(()=>{})];
  if(!isKafkaTarget()||hasTargetCapability('schemas.read'))tasks.push(api('/api/v1/schemas').then(d=>state.schemas=d||[]).catch(()=>{}));
  await Promise.allSettled(tasks);
  if(generation!==state.targetGeneration)return;
  state.lastRefresh=Date.now();updAgo();checkAlarms();
  if(state.view==='topology')renderTopoSvg();
}
function hasTargetCapability(cap){if(state.activeCluster==='local')return true;const target=activeTargetEntry();if(!target)return false;if((target.kind||'').toLowerCase()!=='kafka')return true;return (target.capabilities||[]).includes(cap);}

function topoData(){
  const topics=(state.topics||[]).map(t=>{
    const ps=t.partitions||[];
    return {id:t.name,label:t.name,parts:ps.length,bytes:fmtBytes(t.totalBytes||0),
      end:ps.length?Math.max(...ps.map(p=>p.logEndOffset||0)):0,dlq:/-(dlq|dead)$/i.test(t.name),subscriptions:[]};
  });
  const groups=(state.groups||[]).map(g=>{
    const subs=[...new Set(Object.keys(g.lag||{}).map(k=>k.split('-').slice(0,-1).join('-')))];
    const lagTotal=Object.values(g.lag||{}).reduce((a,b)=>a+b,0);
    return {id:g.name,label:g.name,subs,lag:lagTotal,state:g.state};
  });
  groups.forEach(g=>g.subs.forEach(s=>{const t=topics.find(x=>x.id===s); if(t)t.subscriptions.push(g.id);}));
  return {topics,groups};
}
function topoLayout(n){
  if(n<=8)return {h:56,gap:14,pad:34,rowH:70};
  if(n<=14)return {h:44,gap:9,pad:28,rowH:53};
  return {h:34,gap:6,pad:24,rowH:40};
}
function renderTopoSvg(){
  const svg=document.getElementById('topoSvg'); if(!svg)return;
  const {topics,groups}=topoData();
  if(!topics.length&&!groups.length){svg.innerHTML='';return;}
  const L=topoLayout(topics.length);
  const H=Math.max(240,topics.length*L.rowH+40);
  const CX=470, GX=820, B={x:40,y:H/2-32,w:170,h:64};
  const colT=topics.map((t,i)=>({...t,x:CX,y:i*L.rowH+L.pad}));
  /* consumer groups: antre rapi dari atas (tidak bertumpuk), edge tetap mengikuti */
  const G_H=L.h, GAP=Math.max(12,(topics.length*L.rowH-groups.length*G_H)/(groups.length+1));
  const gc=groups.map((g,i)=>({...g,x:GX,y:L.pad+i*(G_H+GAP)}));
  const seenT=new Set(); let cyT=0;
  const T=colT.map(t=>{
    let y=t.y;
    while(seenT.has(Math.round(y))){y=t.y+(++cyT)*10;}
    seenT.add(Math.round(y)); return {...t,y};
  });
  let s=`<g>
    <rect class="nrect" x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="2"/>
    <text x="${B.x+16}" y="${B.y+24}">broker-${esc(String(state.cluster?.brokerId??'-'))}</text>
    <text class="sub" x="${B.x+16}" y="${B.y+42}">${esc(state.cluster?.security||'PLAINTEXT')} - ${esc(state.cluster?.version||'')}</text>
    <text class="sub" x="${B.x+16}" y="${B.y+56}">${fmtBytes(state.cluster?.totalBytes||0)} on disk</text>
  </g>`;
  T.forEach(t=>{
    s+=`<g><rect class="nrect" x="${t.x}" y="${t.y}" width="150" height="${L.h}" rx="2" onclick="topoPickTopic('${esc(t.id)}')"/>
      <text x="${t.x+12}" y="${t.y+(L.h/2)-2}">${esc(t.id)}</text>
      <text class="sub" x="${t.x+12}" y="${t.y+L.h-6}">${t.parts} parts - ${t.bytes}${t.dlq?' <tspan fill="var(--danger)">DLQ</tspan>':''}</text></g>`;
  });
  gc.forEach(g=>{
    s+=`<g><rect class="nrect" x="${g.x}" y="${g.y}" width="180" height="${L.h}" rx="2" onclick="topoPickGroup('${esc(g.id)}')"/>
      <text x="${g.x+12}" y="${g.y+(L.h/2)-2}">${esc(g.id)}</text>
      <text class="sub" x="${g.x+12}" y="${g.y+L.h-6}">lag ${g.lag.toLocaleString()} - ${esc(g.state||'')}</text>
      ${g.lag>groupLagWarn()?`<circle class="errdot" cx="${g.x+168}" cy="${g.y+10}" r="4"/>`:''}</g>`;
  });
  T.forEach(t=>{
    s+=`<path class="edge" d="M ${B.x+B.w} ${B.y+B.h/2} C ${B.x+B.w+80} ${B.y+B.h/2}, ${t.x-90} ${t.y+L.h/2}, ${t.x} ${t.y+L.h/2}"/>`;
  });
  T.forEach(t=>t.subscriptions.forEach(gid=>{
    const g=gc.find(x=>x.id===gid); if(!g)return;
    const hot=state.topoSel&&state.topoSel.type==='topic'&&state.topoSel.id===t.id;
    s+=`<path class="edge ${hot?'hot':''}" d="M ${t.x+150} ${t.y+L.h/2} C ${t.x+220} ${t.y+L.h/2}, ${g.x-110} ${g.y+L.h/2}, ${g.x} ${g.y+L.h/2}"/>`;
  }));
  s+=`<text class="role" x="${B.x}" y="${B.y-14}">cluster</text>
      <text class="role" x="${CX}" y="${L.pad-24}">topics</text>
      <text class="role" x="${GX}" y="${(gc[0]?gc[0].y:L.pad)-10}">consumer groups</text>`;
  svg.setAttribute('viewBox','0 0 1100 '+H);
  svg.innerHTML=s;
}
function topoDetailHtml(t){
  const parts=t.rawPartitions||[];
  const rows=parts.map(p=>
    `<tr><td>P${p.partition}</td><td>${(p.logEndOffset||0).toLocaleString()}</td><td>${(p.highWatermark||0).toLocaleString()}</td><td>${fmtBytes(p.bytes||0)}</td><td>${(p.segments||[]).length}</td></tr>`
  ).join('')||'<tr><td colspan="5" class="muted">no partitions</td></tr>';
  const subs=(t.subscriptions||[]).map(g=>`<span class="chip">${esc(g)}</span>`).join(' ')||'<span class="muted">(none)</span>';
  return `<div style="font:11px/1.9 var(--font-mono);color:var(--muted);margin-bottom:10px">
    ${t.parts} partitions &middot; ${t.bytes} &middot; log end ${t.end.toLocaleString()}
    &middot; subscribers: ${subs}</div>
    ${tableScroll(`<table><thead><tr><th>Part</th><th>Log End</th><th>High Watermark</th><th>Size</th><th>Segments</th></tr></thead><tbody>${rows}</tbody></table>`)}`;
}
window.topoPickTopic=function(name){

};
window.topoPickGroup=function(name){
  const {groups}=topoData(); const g=groups.find(x=>x.id===name); if(!g)return;
  state.topoSel={type:'group',id:name}; renderTopoSvg();
  api(`/api/v1/groups/${encodeURIComponent(name)}`).then(d=>{
    const rows=(d.offsets||[]).map(o=>`<tr><td>${esc(o.topic)}</td><td>P${o.partition}</td><td>${(o.current_offset??0).toLocaleString()}</td><td>${(o.log_end_offset??0).toLocaleString()}</td><td><span class="badge ${o.lag>0?'b-amber':'b-green'}">${o.lag??0}</span></td></tr>`).join('')||'<tr><td colspan="5" class="muted">no committed offsets</td></tr>';

    nodeDrw('group: '+name,meta,tableScroll(`<table><thead><tr><th>Topic</th><th>Part</th><th>Current</th><th>Log End</th><th>Lag</th></tr></thead><tbody>${rows}</tbody></table>`),

/* Fitur 13: hash router */
function currentHash(){
  const h=location.hash.replace(/^#\/?/,'');
  if(!h)return ['overview',[]];
  const parts=h.split('/');
  try{return [decodeURIComponent(parts[0]),parts.slice(1).map(decodeURIComponent)];}
  catch(e){return ['__invalid__',[]];}
}
function applyHash(){
  const [view,parts]=currentHash();
  state.view=view;
  if(view==='databrowser'){state.topic=parts[0]||null;state.partition=parts[1]||'all';state.off=parts[2]||null;}
  else{state.topic=null;state.partition='all';state.off=null;}
  state.group=view==='groups'?(parts[0]||null):null;
  state.topicDetail=view==='topics'?(parts[0]||null):null;
  render();
}
window.addEventListener('hashchange',applyHash);
// syncHash menulis state browser ke URL agar bisa di-share/refresh.
function syncHash(){
  if(state.view!=='databrowser')return;
  let h='#/databrowser';
  if(state.topic)h+='/'+encodeURIComponent(state.topic);
  if(state.partition&&state.partition!=='all')h+='/'+encodeURIComponent(state.partition);
  if(state.off!=null&&state.off!=='')h+='/'+encodeURIComponent(state.off);
  if(location.hash!==h)history.replaceState(null,'',h);
}

    const topicPane=document.getElementById('plist'),topicBtn=document.getElementById('topicBtn'),browsing=state.view==='databrowser'&&!unavailableNav;
    if(topicPane){topicPane.hidden=!browsing;if(!browsing)topicPane.classList.remove('mobileOpen');}
    if(topicBtn){topicBtn.hidden=!browsing;topicBtn.setAttribute('aria-expanded',String(browsing&&topicPane.classList.contains('mobileOpen')));}

    $('#title').textContent=item?item[1]:'Overview';

      state.view==='databrowser'?`<button class="btn" style="padding:5px 12px;font-size:12px" onclick="goView('connections')">Connections</button>`:'');
    const v=$('#view');
    if(state.auth&&state.auth.enabled&&!state.auth.authenticated){v.innerHTML=viewLogin();bindLogin();}
    else if(state.targetSwitching&&!['clusters','settings'].includes(state.view))v.innerHTML=targetSwitchingPanel();

    else if(unavailableNav&&!localOnlyView)v.innerHTML=unsupportedPanel(state.view);
    else if(state.view==='overview')v.innerHTML=viewOverview();
    else if(state.view==='connections')v.innerHTML=viewConnections();
    else if(state.view==='databrowser')v.innerHTML=viewDataBrowser();
    else if(state.view==='topics')v.innerHTML=state.topicDetail?viewTopicDetail():viewTopics();

    else if(state.view==='health')v.innerHTML=viewHealth();
    else if(state.view==='metrics')v.innerHTML=viewMetrics();
    else if(state.view==='integrations')v.innerHTML=viewIntegrations();
    else if(state.view==='logs')v.innerHTML=viewLogs();
    else if(state.view==='security')v.innerHTML=viewSecurity();
    else if(state.view==='settings')v.innerHTML=viewSettings();
    else v.innerHTML='<div class="card"><h3>404</h3><div class="muted" style="margin-top:6px">Unknown view. <button class="btn ghost" onclick="goView(\'overview\')">Open Overview</button></div></div>';
    bindView();
    applyDensity();
    if(keepScroll&&scroller)scroller.scrollTop=keepScroll;
    window.__renderedView=state.view;
  }catch(err){console.error('render error:',err);renderFatal(err);}
}

window.goView=async function(v){
  if(!navItems.some(([key])=>key===v))return;
  if(v!=='databrowser'){state.topic=null;state.partition='all';state.off=null;}

window.setPart=p=>{state.partition=p;state.off=null;loadMsgs();loadPosMeta();};
async function loadMsgs(){ if(!state.topic)return; try{

  const res=await api(`/api/v1/topics/${encodeURIComponent(state.topic)}/messages?${qs.toString()}`);
  /* Bentuk respons divalidasi: `records` bisa null (hasil kosong), dan tanpa
     penjagaan ini yang tersimpan adalah objek respons - bukan daftar - sehingga
     pemakai berikutnya (handler live tail) meledak saat menyebarnya. */
  state.msgs=Array.isArray(res)?res:(Array.isArray(res&&res.records)?res.records:[]);

  if(state.search){ const hay=(String(m.key||'')+'\u0000'+String(m.value||'')).toLowerCase(); if(!hay.includes(String(state.search).toLowerCase()))return false; }

/* Di atas VIRT_MIN baris hanya potongan yang terlihat (plus cadangan) yang
   dibangun, dengan spacer di kedua ujung supaya panjang gulir tetap sepadan. */
const VIRT_MIN=300, VIRT_OVERSCAN=12;
/* Tinggi baris dipatok per kerapatan, bukan diukur: satu baris contoh tidak
   mewakili baris lain dan galatnya menumpuk di spacer. Sel Timestamp selalu dua
   baris, jadi tinggi = 2 x line-height + 1 px garis pemisah. */
const VIRT_ROW_H={comfortable:35,compact:27}, VIRT_LH={comfortable:17,compact:13};
let msgVirtStart=-1, msgVirtEnd=-1, msgVirtKey='';
function virtRowH(){ return VIRT_ROW_H[state.density]||VIRT_ROW_H.comfortable; }

/* Urutan tampilan ditegaskan di sini: jalur paging menyimpan terlama-dulu
   sementara jalur tail menyisipkan terbaru di depan, jadi satu render ulang
   akan membalik urutan yang terlihat tanpa ini. */
function displayOrder(filtered){ return filtered.slice().sort((a,b)=>(b.offset-a.offset)||(b.timestamp-a.timestamp)); }
function virtSpacer(n,h){ return n>0?'<tr class="virtSpacer"><td colspan="'+msgCols()+'" style="height:'+(n*h)+'px"></td></tr>':''; }
function renderMsgRows(){
  const rows=$('#rows'); if(!rows)return;
  const all=filteredMsgs();
  if(!all.length){ rows.classList.remove('virt'); msgVirtStart=msgVirtEnd=-1; msgVirtKey='';
    rows.innerHTML='<tr><td colspan="'+msgCols()+'" class="muted" style="padding:20px">'+(state.filters.length?'No messages match filters.':'No messages.')+'</td></tr>'; return; }
  const list=displayOrder(all);               /* terbaru di atas, apa pun urutan penyimpanannya */
  const mainEl=$('main');
  if(!mainEl||list.length<VIRT_MIN){         /* daftar kecil: render penuh, tanpa perubahan perilaku */
    rows.classList.remove('virt'); msgVirtStart=msgVirtEnd=-1; msgVirtKey='';
    rows.innerHTML=list.map(rowTr).join('');
    return;
  }
  rows.classList.add('virt');
  const h=virtRowH();
  rows.style.setProperty('--virtRowH',h+'px');   /* tinggi baris nyata, sama dengan yang dipakai spacer */
  rows.style.setProperty('--virtLh',(VIRT_LH[state.density]||VIRT_LH.comfortable)+'px');
  const bodyTop=rows.getBoundingClientRect().top-mainEl.getBoundingClientRect().top+mainEl.scrollTop;
  const view=mainEl.clientHeight||600;
  let start=Math.floor((mainEl.scrollTop-bodyTop)/h)-VIRT_OVERSCAN;
  if(start<0)start=0;
  let end=start+Math.ceil(view/h)+2*VIRT_OVERSCAN;
  if(end>list.length)end=list.length;
  const key=list.length+'|'+(list[0]?list[0].offset:'')+'|'+state.filters.length+'|'+state.projCols.length+'|'+state.diffSel.length;
  if(start===msgVirtStart&&end===msgVirtEnd&&key===msgVirtKey)return;   /* potongan dan data sama: jangan bangun ulang */
  msgVirtStart=start; msgVirtEnd=end; msgVirtKey=key;
  rows.innerHTML=virtSpacer(start,h)+list.slice(start,end).map(rowTr).join('')+virtSpacer(list.length-end,h);
}

function getPath(o,path){ if(!o||!path)return''; return path.split('.').reduce((acc,k)=>(acc==null||typeof acc!=='object')?undefined:acc[k],o); }
function evalFilter(f,v){
  if(f.op==='exists') return f.value? getPath(v,f.field)!==undefined : getPath(v,f.field)===undefined;
  if(f.op==='regex'){ try{return new RegExp(f.value).test(String(getPath(v,f.field)??''));}catch(e){return false;} }
  const val=getPath(v,f.field);
  const a=val===undefined?undefined:String(val);
  const b=String(f.value);
  if(f.op==='contains') return a!=null&&a.includes(b);
  if(f.op==='==') return a!=null&&a===b;
  if(f.op==='!=') return a!=null&&a!==b;
  const na=Number(val), nb=Number(f.value);
  if(isNaN(na)||isNaN(nb))return false;
  if(f.op==='>') return na>nb;
  if(f.op==='<') return na<nb;
  if(f.op==='>=') return na>=nb;
  if(f.op==='<=') return na<=nb;
  return false;
}

/* Fitur: dialog konfirmasi dalam aplikasi, pengganti confirm() bawaan browser.
   Dipakai lewat Promise supaya pemanggil bisa `await` seperti confirm() biasa,
   tapi tetap konsisten dengan pola overlay/modal yang sudah ada (replayModal). */
window.askConfirm=function(opts){
  opts=opts||{};
  const title=opts.title||'',body=opts.body||'',confirmLabel=opts.confirmLabel||'Confirm',danger=!!opts.danger,typeToConfirm=opts.typeToConfirm||null;
  return new Promise(resolve=>{
    let done=false;
    const onKey=e=>{ if(e.key==='Escape')finish(false); };
    const finish=v=>{ if(done)return; done=true; document.removeEventListener('keydown',onKey); closeOverlay(); resolve(v); };
    const typeHtml=typeToConfirm?`<label style="margin-top:10px">Type "${esc(typeToConfirm)}" to confirm</label><input id="confirmType" autocomplete="off">`:'';
    const html=`<div class="overlay"><div class="modal"><h3>${esc(title)}</h3><div class="muted" style="margin:8px 0">${esc(body)}</div>${typeHtml}<div style="margin-top:14px;display:flex;gap:8px"><button class="btn ${danger?'danger':''}" id="confirmOk"${typeToConfirm?' disabled aria-disabled="true"':''}>${esc(confirmLabel)}</button><button class="btn ghost" id="confirmCancel">Cancel</button></div></div></div>`;
    document.body.insertAdjacentHTML('beforeend',html);
    const overlay=document.querySelector('.overlay'),okBtn=document.getElementById('confirmOk'),cancelBtn=document.getElementById('confirmCancel'),input=document.getElementById('confirmType');
    if(typeToConfirm){
      const updateOk=()=>{ const match=input.value===typeToConfirm; okBtn.disabled=!match; if(match)okBtn.removeAttribute('aria-disabled'); else okBtn.setAttribute('aria-disabled','true'); };
      input.addEventListener('input',updateOk); input.focus();
    } else { cancelBtn.focus(); }
    okBtn.addEventListener('click',()=>{ if(typeToConfirm&&input.value!==typeToConfirm)return; finish(true); });
    cancelBtn.addEventListener('click',()=>finish(false));
    overlay.addEventListener('click',e=>{ if(e.target===overlay)finish(false); });
    document.addEventListener('keydown',onKey);
  });
};

/* Fitur 13: WebSocket auto-reconnect with exponential backoff */
function connectTail(){
  if(!state.tail||!state.topic)return;
  const targetName=state.activeCluster,generation=state.targetGeneration;
  if(targetName!=='local'){
    const entry=activeTargetEntry();
    if(!entry){state.tail=false;toast(targetUnavailableMessage());return;}
    if((entry.kind||'').toLowerCase()==='kafka'&&!hasTargetCapability('topic.tail')){state.tail=false;toast('Live tail is not supported by this Kafka target.');return;}
  }
  const proto=location.protocol==='https:'?'wss':'ws',part=(!state.partition||state.partition==='all')?'all':state.partition;
  const apiPath=`/api/v1/topics/${encodeURIComponent(state.topic)}/tail?partition=${encodeURIComponent(part)}`;
  const path=targetName==='local'?apiPath:`/api/v1/target/${encodeURIComponent(targetName)}${apiPath}`;
  const ws=new WebSocket(`${proto}://${location.host}${path}`),isCurrent=()=>generation===state.targetGeneration&&targetName===state.activeCluster&&state.ws===ws;
  state.ws=ws;state.retryCount=state.retryCount||0;
  ws.onopen=()=>{if(isCurrent())state.retryCount=0;};
  ws.onmessage=e=>{if(!isCurrent()||!state.tail)return;const data=JSON.parse(e.data);
    /* Bukan array = frame pemberitahuan: broker melewati pesan karena satu tick
       memuat lebih banyak daripada yang layak dikirim/ditampilkan. */
    if(!Array.isArray(data)){if(data&&data.skipped){state.tailSkipped=(state.tailSkipped||0)+data.skipped;updateTailBar();}return;}
    const recs=data;if(!recs.length)return;
    if(state.tailPaused){state.pendingTail+=recs.length;updateTailBar();return;}
    const fresh=recs.slice().reverse();state.msgs=[...fresh,...state.msgs];if(state.msgs.length>MSGS_MAX)state.msgs=state.msgs.slice(0,MSGS_MAX);
    const rows=$('#rows');
    if(rows){
      if(rows.classList.contains('virt')||state.msgs.length>=VIRT_MIN)renderMsgRows();
      else{fresh.forEach(m=>{if(passesFilters(m))prependMsgRow(m);});const want=filteredMsgs().length;while(rows.children.length>want)rows.removeChild(rows.lastElementChild);}
    }
    updateTailBar();
  };
  ws.onclose=()=>{
    if(!isCurrent())return;state.ws=null;if(!state.tail)return;
    const delay=Math.min(1000*Math.pow(1.5,state.retryCount++),10000);
    state.wsRetry=setTimeout(()=>{state.wsRetry=null;if(generation!==state.targetGeneration||targetName!==state.activeCluster||!state.tail||state.ws)return;connectTail();},delay);
  };
  ws.onerror=()=>{if(isCurrent())ws.close();};
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function tsType(v){if(v===null)return'unknown';if(Array.isArray(v))return (v.length?'Array<'+tsType(v[0])+'>':'unknown[]');if(typeof v==='object')return'Record<string, unknown>';if(typeof v==='number')return v%1===0?'number':'number';if(typeof v==='boolean')return'boolean';return'string';}
function goType(v){if(Array.isArray(v))return '[]'+goType(v[0]||'string');if(typeof v==='object')return 'map[string]any';if(typeof v==='number')return v%1===0?'int64':'float64';if(typeof v==='boolean')return'bool';return'string';}
function pyType(v){if(Array.isArray(v))return'List['+pyType(v[0]||'str')+']';if(typeof v==='object')return'Dict[str, Any]';if(typeof v==='number')return'float';if(typeof v==='boolean')return'bool';return'str';}
function objToCode(obj,lang){
  const name='Payload';
  if(lang==='go'){
    const lines=[]; lines.push('type '+name+' struct {'); for(const k in obj){ lines.push(`\t${cap(k)} ${goType(obj[k])} \`json:"${k}"\``); } lines.push('}'); return lines.join('\n');
  } else if(lang==='ts'){
    const lines=[]; lines.push('export interface '+name+' {'); for(const k in obj){ lines.push(`  ${k}: ${tsType(obj[k])};`); } lines.push('}'); return lines.join('\n');
  } else {
    const lines=[]; lines.push('from pydantic import BaseModel'); lines.push('from typing import Any, List, Dict'); lines.push(''); lines.push('class '+name+'(BaseModel):'); for(const k in obj){ lines.push(`    ${k}: ${pyType(obj[k])}`); } return lines.join('\n');
  }
}

/* Fitur 4.6: In-App Health Alarms */
/* Setiap alarm punya id tetap (mis. "lag:<grup>") yang terpisah dari teksnya.
   Sebelumnya id = teks lengkap termasuk angka lag, jadi begitu lag bergerak
   sedikit alarm lama dianggap "sudah tidak aktif" dan Dismiss tidak pernah
   menempel. Ambang lag grup juga bisa diatur (pk_group_lag_warn): kelompok sync
   pada topik besar memang tertinggal ratusan juta pesan, dan ambang 1000
   membuat banner itu menyala selamanya. */
function groupLagWarn(){ return Number(state.groupLagWarn)||1000000000; }
function activeAlerts(){
  const alerts=[];
  const gs=Array.isArray(state.groups)?state.groups:[];
  const warn=groupLagWarn();
  for(const g of gs){
    const lag=Object.values(g.lag||{}).reduce((a,b)=>a+b,0);
    if(lag>warn){ alerts.push({id:'lag:'+g.name, text:'Consumer lag '+lag+' on group '+g.name+' (>'+warn+')'}); }
  }
  const c=state.cluster||{};
  if(c.diskUsagePct && c.diskUsagePct>85){ alerts.push({id:'disk', text:'Disk usage '+c.diskUsagePct+'% (>85%)'}); }
  // DLQ: only topics that actually hold messages (LEO > 0 or non-empty bytes)
  for(const t of (Array.isArray(state.topics)?state.topics:[])){
    if(/-(dlq|dead)$/i.test(t.name)){
      const hasMsgs=(t.totalBytes||0)>0||(t.partitions||[]).some(p=>(p.logEndOffset||0)>0);
      if(hasMsgs){ alerts.push({id:'dlq:'+t.name, text:'DLQ topic '+t.name+' has messages'}); }
    }
  }
  return alerts;
}
function checkAlarms(){
  const alerts=activeAlerts();
  // Forget dismissals for alerts that no longer fire, so a recurring
  // condition re-alarms when it comes back later. Matching is by id, never by
  // the rendered text: a lag number moves on every poll.
  const live=new Set(alerts.map(a=>a.id));
  for(const k of [...state.alarmsDismissed]) if(!live.has(k)) state.alarmsDismissed.delete(k);
  const shown=alerts.filter(a=>!state.alarmsDismissed.has(a.id));
  const existing=document.getElementById('alarmBanner');
  if(shown.length){
    if(!existing){ const b=document.createElement('div'); b.id='alarmBanner'; b.className='alarmBanner'; document.body.prepend(b); }
    const b=document.getElementById('alarmBanner');
    b.innerHTML='<b>ALERT</b> '+shown.map(a=>esc(a.text)).join(' &middot; ')+' <button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="dismissAlarms()">Dismiss</button>';
  }
  else if(existing){ existing.remove(); }
}
// Dismiss remembers the decision across reloads so the 5s auto-refresh (or a
// browser restart) does not resurrect the banner.
window.dismissAlarms=function(){
  for(const a of activeAlerts()) state.alarmsDismissed.add(a.id);
  try{ localStorage.setItem('pk_alarms_dismissed',JSON.stringify([...state.alarmsDismissed])); }catch(e){}
  const b=document.getElementById('alarmBanner'); if(b)b.remove();
};
window.setGroupLagWarn=function(v){
  const n=Number(v);
  if(!isFinite(n)||n<0){ toast('Threshold harus angka >= 0'); return; }
  state.groupLagWarn=n; localStorage.setItem('pk_group_lag_warn',String(n));
  state.alarmsDismissed.clear();
  try{ localStorage.setItem('pk_alarms_dismissed','[]'); }catch(e){}
  checkAlarms(); render();
};

function timeCell(ts){ return state.timeAbs
  ? '<div>'+new Date(ts).toISOString()+'</div><div class="rel">'+rel(ts)+'</div>'
  : '<div>'+rel(ts)+'</div><div class="rel">'+new Date(ts).toISOString()+'</div>'; }
window.sortInd=function(k,f){const s=state.sort[k];return s&&s.f===f?(s.dir==='asc'?'^':'v'):''};
window.sortRows=function(k,f){const s=state.sort[k]||{};s.dir=(s.f===f&&s.dir==='asc')?'desc':'asc';s.f=f;state.sort[k]=s;render();};
function sortedTopics(){ const s=state.sort.topics; if(!s)return state.topics||[]; const mul=s.dir==='asc'?1:-1;
  return (state.topics||[]).slice().sort((a,b)=>{ let va,vb;
    if(s.f==='name'){va=a.name;vb=b.name;}
    else if(s.f==='size'){va=a.totalBytes||0;vb=b.totalBytes||0;}
    else {va=((a.partitions||[])[0]||{}).logEndOffset||0;vb=((b.partitions||[])[0]||{}).logEndOffset||0;}
    return (va>vb?1:va<vb?-1:0)*mul; }); }
function sortedGroups(){ const s=state.sort.groups; const arr=(state.groups||[]).slice(); if(!s)return arr; const mul=s.dir==='asc'?1:-1;
  return arr.sort((a,b)=>{ let va,vb;
    if(s.f==='name'){va=a.name;vb=b.name;}
    else if(s.f==='members'){va=(a.members||[]).length;vb=(b.members||[]).length;}
    else {va=Object.values(a.lag||{}).reduce((x,y)=>x+y,0);vb=Object.values(b.lag||{}).reduce((x,y)=>x+y,0);}
    return (va>vb?1:va<vb?-1:0)*mul; }); }

/* pecah "host:port" secara defensif; 0.0.0.0 diganti localhost karena itu alamat bind,
   bukan alamat yang bisa dipakai klien untuk connect */
function splitHostPort(addr){
  const s=String(addr||'');
  const i=s.lastIndexOf(':');
  let host=i>=0?s.slice(0,i):s, port=i>=0?s.slice(i+1):'';
  const bindAll=host==='0.0.0.0'||host==='';
  if(bindAll)host='localhost';
  return {host:host||'localhost',port:port||'-',bindAll};
}
function copyRow(id,label){
  return `<button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="copyText('#${id}','${label}')">Copy</button>`;
}
function renderIntegrations(d){
  const mqtt=(d&&d.mqtt)||{}, restProxy=(d&&d.restProxy)||{}, schemaRegistry=(d&&d.schemaRegistry)||{}, metrics=(d&&d.metrics)||{};

    ? mqttTopics.map(t=>`<div class="row" style="justify-content:space-between"><span class="mono">${esc(t.name)}</span><button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="pickTopicNav('${esc(t.name)}')">Open in Data Browser</button></div>`).join('')
    : `<span class="muted">No mqtt-* topics yet.</span>`;

    <div class="row">${mqtt.enabled===true?'<span class="badge b-green">LISTENING</span>':'<span class="badge muted">Bridge not running</span>'}

    <div class="row" style="margin-top:8px"><span class="statSub">${mqtt.connections??0} / ${mqtt.maxConnections??0} clients</span><span class="statSub">${mqtt.bridged??0} messages bridged</span></div>
    <div class="row" style="margin-top:8px"><span class="mono">${esc(mqtt.topicPattern||'-')} &rarr; ${esc(mqtt.kafkaTopicPattern||'-')}, key &lt;device&gt;, header ${esc(mqtt.topicHeader||'-')}</span></div>
    <div class="hr"></div>
    <div class="kicker">mqtt-* topics</div>
    ${mqttTopicsHtml}
    <div class="hr"></div>

    <pre id="mqttPub">mosquitto_pub -h ${esc(mqttHp.host)} -p ${esc(mqttHp.port)} -t sensors/&lt;device&gt;/&lt;metric&gt; -m '{"v":23.5}'</pre>
    ${copyRow('mqttPub','Snippet')}
    <div class="kicker" style="margin-top:12px">Subscribe</div>
    <pre id="mqttSub">mosquitto_sub -h ${esc(mqttHp.host)} -p ${esc(mqttHp.port)} -t 'sensors/#' -v</pre>
    ${copyRow('mqttSub','Snippet')}
    ${mqttHp.bindAll?`<div class="muted" style="font-size:11px;margin-top:6px">Listener binds all interfaces (0.0.0.0); use the broker's reachable hostname when connecting remotely.</div>`:''}
  </div>`;
  /* --- Kartu 2: REST Proxy --- */
  const restHp=splitHostPort(restProxy.listen);
  const restHostPort=`${restHp.host}:${restHp.port}`;
  const restEndpoints=(restProxy.endpoints||[]).length
    ? (restProxy.endpoints||[]).map(e=>`<div class="mono">${esc(e)}</div>`).join('')
    : `<span class="muted">No endpoints reported.</span>`;
  const restAuthHtml=restProxy.auth===true
    ? `<span class="badge muted">authentication required</span><div class="muted" style="font-size:11px;margin-top:4px">SASL/ACL is enabled; send the credential documented in the README (section 4).</div>`
    : `<span class="badge muted">no auth</span>`;
  const restCard=`<div class="card"><div class="kicker">HTTP</div><h3>REST Proxy</h3>
    <div class="row"><span class="mono" id="restAddr">${esc(restProxy.listen||'-')}</span>${copyRow('restAddr','Address')}</div>
    <div class="kicker" style="margin-top:12px">Endpoints</div>
    ${restEndpoints}
    <div class="row" style="margin-top:8px">${restAuthHtml}</div>
    <div class="hr"></div>
    <div class="kicker">Publish</div>
    <pre id="restPub">curl -s -X POST http://${esc(restHostPort)}/topics/&lt;topic&gt;/messages -H 'Content-Type: application/json' -d '{"key":"k","value":"v"}'</pre>
    ${copyRow('restPub','Snippet')}
    <div class="kicker" style="margin-top:12px">Consume</div>
    <pre id="restSub">curl -s 'http://${esc(restHostPort)}/topics/&lt;topic&gt;/messages?limit=5'</pre>
    ${copyRow('restSub','Snippet')}

  /* --- Kartu 3: Schema Registry --- */
  const srHp=splitHostPort(schemaRegistry.listen);
  const srAddr=schemaRegistry.listen||'-';
  const srCard=`<div class="card"><div class="kicker">Schemas</div><h3>Schema Registry</h3>
    <div class="row"><span class="mono" id="srAddr">${esc(srAddr)}</span>${copyRow('srAddr','Address')}

  const scrapeYaml=`scrape_configs:

  const metricsCard=`<div class="card"><div class="kicker">Observability</div><h3>Prometheus &amp; Grafana</h3>
    <div class="row"><a href="/metrics" target="_blank" rel="noreferrer">/metrics</a></div>
    ${metrics.authRequired===true?`<div class="muted" style="font-size:11px;margin-top:6px">Requires a session cookie or bearer token while authentication is enabled.</div>`:''}
    <div class="hr"></div>
    <div class="kicker">Prometheus scrape config</div>
    <pre id="scrapeCfg">${esc(scrapeYaml)}</pre>
    ${copyRow('scrapeCfg','Snippet')}
    <div class="statSub" style="margin-top:8px">Import ${esc(metrics.grafanaDashboard||'-')} into Grafana.</div>
    <div class="muted" style="font-size:11px;margin-top:6px">Exported metrics</div>
    <div class="mono" style="font-size:11px">pocketkafka_messages_in_total{topic} &middot; pocketkafka_bytes_in_total{topic} &middot; pocketkafka_consumer_lag{group,topic,partition} &middot; pocketkafka_request_latency_seconds{api} &middot; pocketkafka_topic_log_end_offset{topic,partition} &middot; pocketkafka_topic_bytes{topic,partition} &middot; pocketkafka_disk_usage_ratio &middot; pocketkafka_mqtt_connections</div>
    <div class="muted" style="font-size:11px;margin-top:4px">Broker totals (pocketkafka_topics, pocketkafka_partitions, pocketkafka_total_bytes, pocketkafka_total_messages, pocketkafka_broker_uptime_seconds) are exported too; the two *_in_total counters appear once records flow.</div>
  </div>`;
  return mqttCard+restCard+srCard+metricsCard;
}
async function loadIntegrations(){
  const el=document.getElementById('integrationsBody');
  if(!el)return;
  try{
    const d=await api('/api/v1/integrations');
    state.integrations=d; state.integrationsError='';
    el.innerHTML=renderIntegrations(d);
  }catch(e){
    state.integrationsError=e.message;
    if(/404|not allowed|does not provide integrations/i.test(e.message)){
      el.innerHTML=`<div class="muted">This peer does not expose integrations.</div><div class="mono" style="margin-top:4px">${esc(e.message)}</div>`;
    }else{
      el.innerHTML=`Failed to load integrations: <span class="mono">${esc(e.message)}</span>`;
    }
  }
