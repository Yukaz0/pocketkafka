<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>go-kafka-neu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#080c14; --surface:#0f172a; --surface2:#111827; --surface3:#1e293b; --border:#1e293b; --border-soft:rgba(255,255,255,.06);
    --primary:#7c3aed; --primary-strong:#7c3aed; --primary-soft:rgba(124,58,237,.16); --primary-text:#c4b5fd; --accent:#8b5cf6; --on-primary:#ffffff;
    --live:#10b981; --success:#10b981; --warn:#f59e0b; --danger:#ef4444;
    --str:#34d399; --num:#38bdf8; --bool:#fbbf24; --key:#e2e8f0;
    --text:#e2e8f0; --muted:#94a3b8;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --rail-w:56px; --radius:16px; --radius-sm:10px;
    --ring:0 0 0 3px rgba(139,92,246,.35);
    --glow:0 0 24px rgba(139,92,246,.35);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f5f6fb; --surface:#ffffff; --surface2:#f1f3f9; --surface3:#e9ecf5; --border:#e3e6f0; --border-soft:rgba(15,23,42,.05);
    --primary:#7c3aed; --primary-soft:rgba(124,58,237,.12); --primary-text:#6d28d9; --accent:#8b5cf6; --on-primary:#fff;
    --success:#059669; --warn:#d97706; --danger:#dc2626;
    --str:#059669; --num:#2563eb; --bool:#b45309; --key:#334155;
    --text:#0f172a; --muted:#5b6478;
    --ring:0 0 0 3px rgba(124,58,237,.22); --glow:0 0 20px rgba(124,58,237,.18);
    --shadow:0 1px 2px rgba(15,20,40,.06),0 12px 32px rgba(15,20,40,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .app{display:flex;height:100vh}

  /* rail */
  .rail{width:var(--rail-w);background:#0b0f19;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;flex-shrink:0;gap:4px}
  html[data-theme="light"] .rail{background:#f6f7fb}
  .rail .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(124,58,237,.5)}
  .rail button{position:relative;width:40px;height:40px;border:none;background:transparent;color:var(--muted);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,transform .1s}
  .rail button:hover{background:var(--surface2);color:var(--text)}
  .rail button:active{transform:scale(.92)}
  .rail button.active{background:var(--primary-soft);color:var(--primary-text)}
  .rail button.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);box-shadow:var(--glow)}
  .rail button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:7px;font-size:11px;white-space:nowrap;box-shadow:var(--shadow);z-index:40}
  .rail .spacer{flex:1}

  .col{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
  .topbar h1{font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:28px;font-family:var(--font-ui)}
  .topbar .crumb{color:var(--muted);font-size:12px}
  .topbar .sp{flex:1}
  .btn{background:var(--primary);color:var(--on-primary);border:none;padding:8px 16px;border-radius:10px;font-weight:500;cursor:pointer;font-size:13px;letter-spacing:-.01em;font-family:var(--font-ui);transition:filter .15s,transform .1s,box-shadow .15s,background .15s}
  .btn:hover{filter:brightness(1.08);box-shadow:var(--glow)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:focus-visible{outline:none;box-shadow:var(--ring)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--surface2);box-shadow:none}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,.4)}
  .btn.danger:hover{background:rgba(239,68,68,.08);box-shadow:none}

  main{flex:1;overflow:auto;padding:26px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}

  /* connection card */
  .conn{border:1px solid var(--border);transition:border-color .2s,transform .15s,box-shadow .2s}
  .conn:hover{border-color:rgba(139,92,246,.5);transform:translateY(-3px);box-shadow:var(--glow)}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;margin-right:8px;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
  .conn .tag{background:var(--primary-soft);color:var(--primary-text);border-radius:6px;padding:2px 9px;font-size:10px;font-weight:600;letter-spacing:.05em;margin-left:8px;font-family:var(--font-mono);font-feature-settings:'tnum' on,'zero' on}
  .conn .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12px}
  .conn .row:last-child{border-bottom:none}
  .conn .k{color:var(--muted)}
  .conn .actions{display:flex;gap:8px;margin-top:16px}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .toolbar .group{display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;backdrop-filter:blur(8px)}
  .toolbar .pill{background:transparent;border:none;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer;font-size:12px;transition:background .15s,color .15s}
  .toolbar .pill:hover{background:var(--surface2);color:var(--text)}
  .toolbar .pill.active{background:var(--primary-soft);color:var(--primary-text)}
  .pill.part{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .15s;font-family:var(--font-mono)}
  .pill.part:hover{color:var(--text)}
  .pill.part.active{background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary)}
  select,input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:12px;transition:border-color .15s,box-shadow .15s;font-family:var(--font-ui)}
  select:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
  input{width:100%}

  /* pulsing live dot */
  .live-dot{position:relative;display:inline-flex;width:9px;height:9px}
  .live-dot::before,.live-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live)}
  .live-dot::after{animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}

  /* row entry flash */
  @keyframes row-entry-flash{0%{background-color:rgba(16,185,129,.22);transform:translateY(-4px);opacity:0}50%{background-color:rgba(16,185,129,.12);opacity:1;transform:translateY(0)}100%{background-color:transparent}}
  .animate-row-entry{animation:row-entry-flash 1.2s cubic-bezier(.16,1,.3,1) forwards}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2);font-family:var(--font-ui)}
  td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;font-family:var(--font-mono);font-feature-settings:'tnum' on,'zero' on;font-variant-numeric:tabular-nums}
  
  tbody tr{transition:background .1s}
  tbody tr:hover td{background:var(--surface3)}
  .muted{color:var(--muted)}
  .rel{color:var(--muted);font-size:11px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
  .b-green{background:rgba(16,185,129,.15);color:var(--success)}
  .b-amber{background:rgba(245,158,11,.15);color:var(--warn)}
  .b-purple{background:var(--primary-soft);color:var(--primary-text)}
  .chip{font-family:var(--font-mono);font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;margin:0 2px}
  .rowclick{cursor:pointer}

  /* glass inspector */
  .inspector{position:relative;background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);margin-top:16px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  html[data-theme="light"] .inspector{background:rgba(255,255,255,.7);border-color:rgba(15,23,42,.08)}
  .inspector h3{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:12px;font-family:var(--font-mono)}
  pre{font-family:var(--font-mono);font-size:12px;font-feature-settings:'tnum' on,'zero' on;white-space:pre-wrap;word-break:break-word;background:rgba(8,12,20,.4);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;overflow:auto;line-height:1.6}
  html[data-theme="light"] pre{background:var(--surface2);border-color:var(--border)}
  .jkey{color:var(--key)}.jstr{color:var(--str)}.jnum{color:var(--num)}.jbool{color:var(--bool)}.jnull{color:var(--muted)}
  .jnode{padding-left:14px;border-left:1px solid var(--border-soft);margin-left:6px}
  .jrow{cursor:pointer;border-radius:4px;padding:1px 4px;transition:background .1s}
  .jrow:hover{background:var(--surface3)}
  .jarrow{display:inline-block;width:14px;color:var(--muted);font-family:var(--font-mono);font-size:10px}

  .kv{display:flex;gap:12px;margin-bottom:10px}.kv>div{flex:1}
  label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;font-weight:500}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;font-family:var(--font-mono);font-size:12px;resize:vertical;transition:border-color .15s,box-shadow .15s}
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
  .msg{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;font-size:12px;transform:translateY(10px);z-index:50}
  .msg.show{opacity:1;transform:translateY(0)}
  .hdr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .hidden{display:none}
  a{color:var(--primary-text);text-decoration:none}
  a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  /* partition bars */
  .pbar{height:6px;border-radius:4px;background:var(--surface3);overflow:hidden;margin-top:4px}
  .pbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="col">
    <header class="topbar">
      <h1 id="title">Connections</h1>
      <span class="crumb" id="crumb"></span>
      <span class="sp"></span>
      <span id="topActions"></span>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="msg" id="msg"></div>

<script>
const $=s=>document.querySelector(s);
const I={server:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/></svg>',
  layers:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
  table:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>',
  code:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  users:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  sun:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>',
  moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'};

const state={view:'connections',theme:'dark',cluster:null,topics:[],groups:[],schemas:[],topic:null,partition:'all',decoder:'auto',msgs:[],tail:false,ws:null,group:null,search:'',fromTs:'',toTs:'',auth:null};
const navItems=[['connections','Connections',I.server],['databrowser','Data Browser',I.table],['topics','Topics',I.layers],['groups','Consumer Groups',I.users],['schemas','Schemas',I.code],['producer','Producer Studio',I.send]];

/* ---- Fitur 15: auto theme detection (prefers-color-scheme) ---- */
function initTheme(){
  const saved=localStorage.getItem('kadeck_theme');
  if(saved){state.theme=saved;document.documentElement.dataset.theme=saved;return;}
  const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  state.theme=prefersDark?'dark':'light';
  document.documentElement.dataset.theme=state.theme;
}

async function api(p,o){const r=await fetch(p,o);let j;try{j=await r.json();}catch(e){j={};}if(r.status===401&&state.auth&&state.auth.enabled){showLogin();throw new Error('Authentication required');}if(!r.ok)throw new Error(j.error||r.status);return j;}
function toast(t){const m=$('#msg');m.textContent=t;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2500);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtBytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
function rel(t){const d=Math.max(0,Date.now()-t);if(d<1000)return 'now';if(d<60000)return Math.floor(d/1000)+'s ago';if(d<3600000)return Math.floor(d/60000)+'m ago';return Math.floor(d/3600000)+'h ago';}
function online(s){s=(s||'').toLowerCase();return s==='stable'||s==='green';}

async function refresh(){
  await Promise.allSettled([api('/api/v1/cluster').then(d=>state.cluster=d).catch(()=>{}),
    api('/api/v1/topics').then(d=>state.topics=d).catch(()=>{}),
    api('/api/v1/groups').then(d=>state.groups=d).catch(()=>{}),
    api('/api/v1/schemas').then(d=>state.schemas=d).catch(()=>{}),
    api('/api/v1/auth/status').then(d=>state.auth=d).catch(()=>{})]);
}

function buildRail(){
  const r=$('#rail');
  r.innerHTML='<div class="logo">G</div>'+navItems.map(([k,_,ic])=>`<button data-nav="${k}" class="${state.view===k?'active':''}" title="${_}">${ic}</button>`).join('')
    +'<span class="spacer"></span>'
    +`<button id="theme" title="Theme">${state.theme==='dark'?I.moon:I.sun}</button>`
    +`<button id="settingsBtn" title="Settings">${I.gear}</button>`;
  navItems.forEach(([k])=>r.querySelector(`[data-nav="${k}"]`).onclick=()=>goView(k));
  r.querySelector('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;localStorage.setItem('kadeck_theme',state.theme);render();};
  r.querySelector('#settingsBtn').onclick=()=>goView('settings');
}

/* ---- Fitur 13: hash router ---- */
function currentHash(){
  const h=location.hash.replace(/^#\/?/,'');
  if(!h)return ['connections',[]];
  const parts=h.split('/');
  return [parts[0],parts.slice(1)];
}
function applyHash(){
  const [view,parts]=currentHash();
  state.view=view;
  if(view==='databrowser'&&parts[0]){state.topic=decodeURIComponent(parts[0]);}
  if(view==='groups'&&parts[0]){state.group=decodeURIComponent(parts[0]);}
  render();
}
window.addEventListener('hashchange',applyHash);

function render(){
  buildRail();
  const item=navItems.find(([k])=>k===state.view);
  const title=item?item[1]:'Settings';
  $('#title').textContent=title;$('#crumb').textContent=state.view==='databrowser'&&state.topic?('/ '+state.topic):(state.view==='groups'&&state.group?('/ '+state.group):'');
  $('#topActions').innerHTML=state.view==='connections'?`<button class="btn ghost" onclick="refreshAll()">Refresh</button>`:
    state.view==='databrowser'?`<button class="btn" onclick="goView('connections')">Connections</button>`:'';
  const v=$('#view');
  if(state.auth&&state.auth.enabled&&!state.auth.authenticated){v.innerHTML=viewLogin();bindLogin();return;}
  if(state.view==='connections')v.innerHTML=viewConnections();
  else if(state.view==='databrowser')v.innerHTML=viewDataBrowser();
  else if(state.view==='topics')v.innerHTML=state.topicDetail?viewTopicDetail():viewTopics();
  else if(state.view==='groups')v.innerHTML=state.group?viewGroupDetail():viewGroups();
  else if(state.view==='schemas')v.innerHTML=viewSchemas();
  else if(state.view==='producer')v.innerHTML=viewProducer();
  else if(state.view==='settings')v.innerHTML=viewSettings();
  bindView();
}
async function refreshAll(){await refresh();render();}
window.refreshAll=refreshAll;
window.goView=async function(v){state.view=v;location.hash=v==='connections'?'#/connections':'#/'+v;await refresh();render();};

/* ---- Fitur 12: login ---- */
function viewLogin(){
  return `<div style="max-width:360px;margin:80px auto">
    <div class="card">
      <h3 style="margin-bottom:14px">Sign in</h3>
      <label>Username</label><input id="loginUser" autocomplete="username">
      <div style="height:10px"></div>
      <label>Password</label><input id="loginPass" type="password" autocomplete="current-password">
      <div style="height:16px"></div>
      <button class="btn" style="width:100%" onclick="doLogin()">Login</button>
    </div>

async function loadMsgs(){ if(!state.topic)return; try{

  const res=await api(`/api/v1/topics/${encodeURIComponent(state.topic)}/messages?${qs.toString()}`);
  state.msgs=res.records||res;

}catch(e){toast(e.message);} }

function renderMsgRows(){ const rows=$('#rows'); if(!rows)return; if(!state.msgs.length){rows.innerHTML='<tr><td colspan="6" class="muted" style="padding:20px">No messages.</td></tr>';return;} function rowHtml(m){const val=fmtValue(m);return `<td><div>${rel(m.timestamp)}</div><div class="rel">${new Date(m.timestamp).toISOString()}</div></td><td><span class="chip">P${m.partition}</span></td><td>${m.offset}</td><td>${m.key?esc(m.key):'<span class="muted">(null)</span>'}</td><td><div class="hdr">${Object.entries(m.headers||{}).map(([k,v])=>`<span class="chip">${esc(k)}=${esc(v)}</span>`).join('')||'<span class="muted">-</span>'}</div></td><td style="max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(val)}</td>`;}
rows.innerHTML=state.msgs.slice().reverse().map(m=>'<tr class="rowclick" onclick="insp('+JSON.stringify(m).replace(/"/g,'&quot;')+')">'+rowHtml(m)+'</tr>').join(''); }

let tnId=0;
function prim(v){if(v===null)return '<span class="jnull">null</span>';if(typeof v==='boolean')return '<span class="jbool">'+v+'</span>';if(typeof v==='number')return '<span class="jnum">'+v+'</span>';return '<span class="jstr">"'+esc(v)+'"</span>';}
function jnode(key,val){tnId++;const id=tnId;
  if(val===null||typeof val!=='object'){return '<div class="jrow" style="cursor:default;padding-left:0"><span class="jkey">"'+esc(key)+'"</span>: '+prim(val)+'</div>';}
  const open=val&&Object.keys(val).length<=8;

  const label=Array.isArray(val)?('['+val.length+']'):('{'+Object.keys(val).length+'}');
  return '<div><div class="jrow" onclick="toggleNode('+id+')"><span class="jarrow" id="ta-'+id+'">'+(open?'&#9660;':'&#9654;')+'</span><span class="jkey">"'+esc(key)+'"</span>: <span class="jnum">'+label+'</span></div><div class="jnode" id="tn-'+id+'" style="'+(open?'':'display:none')+'">'+(body||'<div class="muted" style="padding-left:14px">(empty)</div>')+'</div></div>';}

/* ---- Fitur 13: WebSocket auto-reconnect with exponential backoff ---- */
function connectTail(){
  if(!state.tail)return;
  const proto=location.protocol==='https:'?'wss':'ws';
  const ws=new WebSocket(`${proto}://${location.host}/api/v1/topics/${encodeURIComponent(state.topic)}/tail`);
  state.ws=ws; state.retryCount=state.retryCount||0;
  ws.onopen=()=>{state.retryCount=0;};
  ws.onmessage=e=>{ const recs=JSON.parse(e.data); if(!recs.length)return; state.msgs=[...recs.slice().reverse(),...state.msgs]; if(state.msgs.length>200)state.msgs=state.msgs.slice(0,200); recs.slice().reverse().forEach(prependMsgRow); };
  ws.onclose=()=>{ if(!state.tail)return; const delay=Math.min(1000*Math.pow(1.5,state.retryCount++),10000); state.wsRetry=setTimeout(connectTail,delay); };
  ws.onerror=()=>{ ws.close(); };
}
function prependMsgRow(m){const rows=$('#rows');if(!rows)return;const tr=document.createElement('tr');tr.className='rowclick animate-row-entry';tr.innerHTML=rowHtml(m);tr.onclick=()=>insp(m);rows.prepend(tr);}

  try{await api(`/api/v1/groups/${encodeURIComponent(state.group)}/offsets/reset`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('Offset reset');loadGroupDetail();}catch(e){toast(e.message);}
};
window.delGroup=async function(g){if(!confirm('Delete group '+g+'?'))return;try{await api('/api/v1/groups/'+encodeURIComponent(g),{method:'DELETE'});toast('Deleted '+g);await refresh();render();}catch(e){toast(e.message);}};

/* ---- Schemas ---- */
function viewSchemas(){ return `<div class="card"><h3 style="margin-bottom:10px">Schema Registry</h3><table><thead><tr><th>Subject</th></tr></thead><tbody>
  ${state.schemas.map(s=>`<tr><td class="mono"><span class="badge b-purple">AVRO</span> ${esc(s)}</td></tr>`).join('')||'<tr><td class="muted">No schemas registered.</td></tr>'}
  </tbody></table></div>`; }

/* ---- Producer Studio ---- */
function viewProducer(){ const opts=state.topics.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
  return `<div class="grid"><div class="card" style="max-width:640px">
    <label>Topic</label><input list="tl" id="pTopic" placeholder="my-topic (auto-created)" value="${esc(state.topic||'')}"><datalist id="tl">${opts}</datalist>
    <label>Partition</label><select id="pPart"><option value="-1">Auto</option><option value="0">0</option></select>
    <label>Key</label><input id="pKey" placeholder="optional key">
    <label>Headers (key=value, one per line)</label><textarea id="pHeaders" rows="2" placeholder="traceId=abc"></textarea>
    <label>Payload (JSON / text)</label><textarea id="pValue" rows="8">{"event":"hello","ts":1700000000}</textarea>
    <div style="margin-top:12px"><button class="btn" onclick="sendMsg()">Send Message</button></div>
  </div></div>`; }
async function sendMsg(){ const body={value:$('#pValue').value,key:$('#pKey').value}; const h={}; $('#pHeaders').value.split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0)h[l.slice(0,i).trim()]=l.slice(i+1).trim();}); if(Object.keys(h).length)body.headers=h;
  const topic=$('#pTopic').value||'demo'; const btn=document.querySelector('#view .card .btn'); if(btn){btn.disabled=true;const o=btn.textContent;btn.textContent='Publishing...';}
  try{const r=await api('/api/v1/topics/'+encodeURIComponent(topic)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast(`Published to offset ${r.offset}`);await refresh();}catch(e){toast(e.message);}
  if(btn){btn.disabled=false;btn.textContent='Publish Message';} }
window.sendMsg=sendMsg;

function bindView(){ if(state.view==='databrowser'&&state.topic)loadMsgs(); if(state.view==='groups'&&state.group)loadGroupDetail(); }
initTheme();
(async function(){await refresh();applyHash();})();
</script>
</body>
</html>
