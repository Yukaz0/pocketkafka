<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketKafka</title>
<link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/sf-mono" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#12141a; --bg-canvas:#0e1015; --surface:#1b1e24; --surface2:#22262e; --surface3:#2a2f39;
    --border:#2e3440; --border-soft:rgba(255,255,255,.06);
    --primary:#4c7dff; --primary-strong:#3d66d9; --primary-soft:rgba(76,125,255,.14); --primary-text:#8ab0ff; --accent:#4c7dff; --on-primary:#ffffff;
    --live:#3ecf8e; --success:#3ecf8e; --warn:#e8b339; --danger:#f16a5c;
    --str:#7ee0a3; --num:#7cb8ff; --bool:#ecc86b; --key:#dfe5ee;
    --text:#e8ecf3; --muted:#98a2b3;
    --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','SF Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
    --font-mono:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Monaco,Consolas,monospace;
    --rail-w:56px; --radius:4px; --radius-sm:4px;
    --ring:0 0 0 1px var(--primary);
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#f0f2f5; --bg-canvas:#e8eaef; --surface:#ffffff; --surface2:#eef0f3; --surface3:#e5e8ee;
    --border:#d7dbe2; --border-soft:rgba(15,18,25,.06);
    --primary:#2f6bff; --primary-strong:#2450c8; --primary-soft:rgba(47,107,255,.10); --primary-text:#2450c8; --accent:#2f6bff; --on-primary:#fff;
    --success:#188554; --warn:#a8700a; --danger:#c93f31;
    --str:#188554; --num:#2450c8; --bool:#a8700a; --key:#2a3340;
    --text:#1a2029; --muted:#5c6674;
    --shadow:0 8px 24px rgba(15,20,40,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ---- workbench chrome: titlebar / explorer / statusbar ---- */
  .tb{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;padding-right:10px}
  .wm{display:flex;align-items:center;padding:0 16px;font-weight:600;font-size:13px;gap:8px;cursor:pointer;user-select:none}
  .wm:hover{color:var(--primary-text)}
  .wm i{width:8px;height:8px;background:var(--primary);display:inline-block}
  .tabs{display:flex;align-items:stretch;overflow-x:auto}
  .tab{display:flex;align-items:center;padding:0 13px;color:var(--muted);cursor:pointer;font-size:12.5px;border:none;background:none;font-family:var(--font-ui);white-space:nowrap}
  .tab:hover{color:var(--text);background:var(--surface2)}
  .tab.on{color:var(--text);background:var(--bg);box-shadow:inset 0 2px 0 var(--primary)}
  .chips{display:flex;align-items:center;gap:6px;font:10.5px var(--font-mono);color:var(--muted)}
  .chip2{border:1px solid var(--border);padding:2px 8px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .chip2 i{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block}
  .ws{flex:1;display:flex;min-height:0}
  .content{flex:1;display:flex;flex-direction:column;min-width:0}
  .plist{width:230px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;flex-shrink:0}
  .plist .ph{padding:9px 12px;border-bottom:1px solid var(--border);font:600 10px var(--font-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
  .plist input{margin:10px;background:var(--bg-canvas);border:1px solid var(--border);color:var(--text);font:11.5px var(--font-mono);padding:6px 9px;outline:none;width:calc(100% - 20px)}
  .plist input:focus{border-color:var(--primary)}
  .titem{padding:7px 12px;cursor:pointer;border-left:2px solid transparent}
  .titem:hover{background:var(--surface2)}
  .titem.on{background:var(--surface2);border-left-color:var(--primary)}
  .titem b{display:block;font:500 12px var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .titem span{display:block;font:10px var(--font-mono);color:var(--muted);margin-top:1px}
  .sbar{height:26px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 14px;font:10.5px var(--font-mono);color:var(--muted);flex-shrink:0;white-space:nowrap;overflow:hidden}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
  .slink{cursor:pointer}
  .slink:hover{color:var(--text)}
  .hero{display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:18px}
  .heroStats{display:flex;margin-left:auto}
  .hstat{padding:0 22px;border-left:1px solid var(--border)}
  .hstat:first-child{border-left:none;padding-left:0}
  .hstat .v{font:500 22px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
  .hstat .v small{font-size:11px;color:var(--muted);margin-left:2px}
  .hstat .k{font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:3px}
  .cbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font:10.5px var(--font-mono);padding:3px 10px;cursor:pointer;letter-spacing:.04em}
  .cbtn:hover{border-color:var(--primary);color:var(--primary-text)}
  .cbtn.ok{border-color:var(--live);color:var(--success)}
  /* topology svg */
  .topoSvg{width:100%;display:block}
  .topoSvg text{font-family:var(--font-mono);fill:var(--text);font-size:12px}
  .topoSvg text.sub{fill:var(--muted);font-size:9.5px}
  .topoSvg text.role{fill:var(--muted);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
  .nrect{fill:var(--surface2);stroke:var(--border);cursor:pointer}
  .nrect:hover{stroke:var(--primary)}
  .edge{stroke:var(--border);stroke-width:1.5;fill:none}
  .edge.hot{stroke:var(--primary);stroke-width:2}
  .errdot{fill:var(--danger)}
  /* node detail drawer */
  .drw{position:fixed;left:230px;right:0;bottom:0;height:300px;background:var(--surface);border-top:1px solid var(--border);transform:translateY(100%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .drw.open{transform:none}
  .drwHd{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-family:var(--font-mono)}
  .drwHd b{font-size:12px}
  .drwHd .x{margin-left:auto;cursor:pointer;color:var(--muted);border:none;background:none;font:14px var(--font-mono)}
  .drwHd .x:hover{color:var(--text)}
  .drwBody{flex:1;overflow:auto;padding:12px 18px}

  /* burger + drawer menu */
  .burger{width:36px;height:36px;border:1px solid var(--border);background:transparent;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s}
  .burger span{display:block;width:16px;height:2px;background:var(--text)}
  .burger:hover{background:var(--surface2)}
  /* drawer disabled: navigasi via titlebar tabs + topic explorer */
  .drawer{display:none}
  .drawer.open{transform:translateX(-100%)}
  .drawerBackdrop{display:none}
  .hidden{display:none}
  .drawer .dLogo{padding:0 20px 14px;border-bottom:1px solid var(--border);margin-bottom:10px}
  .drawer .dLogo b{font-size:15px;letter-spacing:.02em}
  .drawer .dLogo span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-family:var(--font-mono);margin-top:2px}
  .dItem{display:flex;justify-content:space-between;align-items:center;padding:9px 20px;color:var(--muted);cursor:pointer;font-size:13px;border:none;background:none;text-align:left;width:100%;font-family:var(--font-ui)}
  .dItem:hover{background:var(--surface2);color:var(--text)}
  .dItem.active{color:var(--primary-text);background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary)}
  .dItem .dHint{font-size:10px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.05em}
  .dItem.active .dHint{color:var(--primary-text)}
  .dSpacer{flex:1;min-height:16px}
  .drawerBackdrop{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:85}
  .hidden{display:none}

  .col{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
  .topbar h1{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:28px}
  .topbar .crumb{color:var(--muted);font-size:12px;font-family:var(--font-mono)}
  .topbar .sp{flex:1}
  #topActions{display:flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap}
  .btn{background:var(--primary);color:var(--on-primary);border:1px solid var(--primary);padding:7px 14px;border-radius:4px;font-weight:500;cursor:pointer;font-size:13px;font-family:var(--font-ui);transition:background .12s,border-color .12s}
  .btn:hover{background:var(--primary-strong);border-color:var(--primary-strong)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:none;box-shadow:var(--ring)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--surface2)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(241,106,92,.4)}
  .btn.danger:hover{background:rgba(241,106,92,.08)}

  main{flex:1;overflow:auto;padding:20px 24px;width:100%}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:18px;width:100%;margin-bottom:16px}
  .card h3{font-size:14px;font-weight:600}
  .grid{display:flex;flex-direction:column;gap:0}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  /* connection card */
  .conn{border:1px solid var(--border);transition:border-color .15s}
  .conn:hover{border-color:var(--primary)}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;margin-right:8px}
  .conn .tag{background:var(--primary-soft);color:var(--primary-text);border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;letter-spacing:.05em;margin-left:8px;font-family:var(--font-mono)}
  .conn .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12px}
  .conn .row:last-child{border-bottom:none}
  .conn .k{color:var(--muted)}
  .conn .actions{display:flex;gap:8px;margin-top:16px}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .toolbar .group{display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px}
  .toolbar .pill{background:transparent;border:none;color:var(--muted);padding:6px 11px;border-radius:3px;cursor:pointer;font-size:12px;transition:background .12s,color .12s}
  .toolbar .pill:hover{background:var(--surface2);color:var(--text)}
  .toolbar .pill.active{background:var(--primary-soft);color:var(--primary-text)}
  .pill.part{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:4px 10px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .12s;font-family:var(--font-mono)}
  .pill.part:hover{color:var(--text)}
  .pill.part.active{background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary)}
  select,input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:7px 11px;font-size:12px;transition:border-color .12s,box-shadow .12s;font-family:var(--font-ui)}
  select:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
  select option{background:var(--bg-canvas);color:var(--text)}
  input{width:100%}

  /* pulsing live dot */
  .live-dot{position:relative;display:inline-flex;width:9px;height:9px}
  .live-dot::before,.live-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live)}
  .live-dot::after{animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}

  /* row entry flash */
  @keyframes row-entry-flash{0%{background-color:rgba(62,207,142,.20);opacity:0}40%{background-color:rgba(62,207,142,.10);opacity:1}100%{background-color:transparent}}
  .animate-row-entry{animation:row-entry-flash 1s cubic-bezier(.16,1,.3,1) forwards}

  /* view fade-in */
  @keyframes view-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  #view>*{animation:view-in .18s ease-out}

  /* skeleton loading */
  .skel{display:inline-block;height:11px;border-radius:2px;background:var(--surface3);animation:skel-pulse 1.4s ease-in-out infinite;vertical-align:middle}
  @keyframes skel-pulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2)}
  td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;font-family:var(--font-mono);font-feature-settings:'tnum' on,'zero' on;font-variant-numeric:tabular-nums}

  tbody tr{transition:background .1s}
  tbody tr:hover td{background:var(--surface3)}
  .muted{color:var(--muted)}
  .rel{color:var(--muted);font-size:11px}
  .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;font-family:var(--font-mono);letter-spacing:.03em}
  .b-green{background:rgba(62,207,142,.14);color:var(--success)}
  .b-amber{background:rgba(232,179,57,.14);color:var(--warn)}
  .b-purple{background:var(--primary-soft);color:var(--primary-text)}
  .chip{font-family:var(--font-mono);font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 7px;margin:0 2px}
  .rowclick{cursor:pointer}

  /* inspector */
  .inspector{background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-top:16px;padding:18px}
  /* master-detail: tabel kiri, detail json kanan */
  .bwrap{display:flex;gap:16px;align-items:flex-start}
  .bmain{flex:1;min-width:0}
  .sideIns{width:360px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px;position:sticky;top:8px;max-height:calc(100vh - 160px);overflow:auto}
  .inspector h3{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:12px;font-family:var(--font-mono)}
  pre{font-family:var(--font-mono);font-size:12px;font-feature-settings:'tnum' on,'zero' on;white-space:pre-wrap;word-break:break-word;background:var(--bg-canvas);border:1px solid var(--border);border-radius:4px;padding:12px;overflow:auto;line-height:1.6}
  .jkey{color:var(--key)}.jstr{color:var(--str)}.jnum{color:var(--num)}.jbool{color:var(--bool)}.jnull{color:var(--muted)}
  .jnode{padding-left:14px;border-left:1px solid var(--border-soft);margin-left:6px}
  .jrow{cursor:pointer;border-radius:2px;padding:1px 4px;transition:background .1s}
  .jrow:hover{background:var(--surface3)}
  .jarrow{display:inline-block;width:14px;color:var(--muted);font-family:var(--font-mono);font-size:10px}

  .kv{display:flex;gap:12px;margin-bottom:10px}.kv>div{flex:1}
  label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;font-weight:500}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:11px;font-family:var(--font-mono);font-size:12px;resize:vertical;transition:border-color .12s,box-shadow .12s}
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
  .msg{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--primary);color:var(--text);padding:12px 18px;border-radius:4px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;font-size:12px;transform:translateY(10px);z-index:50}
  .msg.show{opacity:1;transform:translateY(0)}
  .hdr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .hidden{display:none}
  a{color:var(--primary-text);text-decoration:none}
  a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  /* partition bars */
  .pbar{height:6px;border-radius:2px;background:var(--surface3);overflow:hidden;margin-top:4px}
  .pbar>span{display:block;height:100%;background:var(--primary);border-radius:2px}

  /* ---- Fitur 3.2: filter builder ---- */
  .filterPanel{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px;margin-bottom:16px}
  .filterRow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .filterRow select,.filterRow input{width:auto;flex:0 1 auto}
  .filterRow .fField{width:200px}
  .filterRow .fOp{width:120px}
  .filterRow .fVal{width:180px}
  .frmBtn{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:15px;line-height:1}
  .autocomplete{position:relative}
  .acList{position:absolute;top:100%;left:0;right:0;background:var(--surface3);border:1px solid var(--border);border-radius:4px;max-height:180px;overflow:auto;z-index:60;box-shadow:var(--shadow)}
  .acList div{padding:7px 11px;cursor:pointer;font-family:var(--font-mono);font-size:11px}
  .acList div:hover,.acList div.act{background:var(--primary-soft);color:var(--primary-text)}
  .presetChip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary-text);border-radius:3px;padding:2px 9px;font-size:11px;margin:2px 4px 2px 0;cursor:pointer}
  .presetChip button{background:none;border:none;color:inherit;cursor:pointer;font-size:11px;padding:0 2px}

  /* ---- Fitur 3.3: column projection ---- */
  .projBar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .projTag{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:2px 8px;font-size:11px;font-family:var(--font-mono)}
  .projTag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px}
  .projTag button:hover{color:var(--danger)}

  /* ---- Fitur 3.4: message diff ---- */
  .diffPanel{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px;margin-top:16px}
  .diffWrap{display:flex;gap:14px}
  .diffCol{flex:1;min-width:0}
  .diffCol h4{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:8px}
  .diffCol pre{max-height:360px;overflow:auto}
  .d-rem{background:rgba(241,106,92,.12);color:#f5a49b}
  .d-add{background:rgba(62,207,142,.12);color:#8fe3bd}
  .d-ctx{color:var(--muted)}

  /* ---- Fitur 3.5: replay / DLQ ---- */
  .overlay{position:fixed;inset:0;background:rgba(8,10,14,.6);z-index:70;display:flex;align-items:center;justify-content:center}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px;width:min(620px,94vw);box-shadow:var(--shadow);animation:view-in .15s ease-out}
  .modal h3{font-size:15px;margin-bottom:14px}
  .chkCell{width:32px;text-align:center}

  /* ---- Fitur 4.x enterprise ---- */
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .topoLayer{margin-bottom:14px}
  .topoLayer:last-child{margin-bottom:0}
  .topoLabel{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;font-family:var(--font-mono)}
  .topoNodes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tRow{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .topoArrow{color:var(--muted);font-size:11px;margin:0 0 10px 2px;font-family:var(--font-mono)}
  .gNode{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:5px 10px;font-family:var(--font-mono);font-size:11px;text-align:center;white-space:nowrap}
  .skewBar{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
  .skewBar>div{flex:1;background:var(--primary);border-radius:2px 2px 0 0;position:relative;min-width:0}
  .skewBar>div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--muted)}

  /* ---- hierarki visual (anti-monoton, tetap flat) ---- */

  .statSub{color:var(--muted);font-size:11px;margin-top:2px;font-family:var(--font-mono)}

  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;margin-right:8px}

  .brokerBadge .dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}

  /* compact density */

  body.compact .statXL{font-size:26px}

  /* sortable headers */
  th.sortable{cursor:pointer;user-select:none}

  /* command palette */
  .paletteBox{background:var(--surface);border:1px solid var(--border);border-radius:4px;width:min(520px,92vw);max-height:60vh;overflow:auto;box-shadow:var(--shadow)}

const state={view:'connections',theme:'dark',cluster:null,topics:[],groups:[],schemas:[],topic:null,partition:'all',decoder:'auto',msgs:[],tail:false,ws:null,group:null,search:'',fromTs:'',toTs:'',auth:null,alarmsDismissed:new Set((()=>{try{return JSON.parse(sessionStorage.getItem('pk_dismissed')||'[]');}catch(e){return [];}})()),
  /* pengaturan persisten */
  refreshMs:+(localStorage.getItem('pk_refreshMs')||5000)||5000,

};

/* ---- Fitur 15: auto theme detection (prefers-color-scheme) ---- */
function initTheme(){
  const saved=localStorage.getItem('kadeck_theme');
  if(saved){state.theme=saved;document.documentElement.dataset.theme=saved;return;}
  const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  state.theme=prefersDark?'dark':'light';
  document.documentElement.dataset.theme=state.theme;
}

async function api(p,o){const r=await fetch(p,o);let j;try{j=await r.json();}catch(e){j={};}if(r.status===401&&state.auth&&state.auth.enabled){showLogin();throw new Error('Authentication required');}if(!r.ok)throw new Error(j.error||r.status);return j;}
function toast(t){const m=$('#msg');m.textContent=t;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2500);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtBytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
function rel(t){const d=Math.max(0,Date.now()-t);if(d<1000)return 'now';if(d<60000)return Math.floor(d/1000)+'s ago';if(d<3600000)return Math.floor(d/60000)+'m ago';return Math.floor(d/3600000)+'h ago';}
function online(s){s=(s||'').toLowerCase();return s==='stable'||s==='green';}

async function refresh(){
  await Promise.allSettled([api('/api/v1/cluster').then(d=>state.cluster=d).catch(()=>{}),
    api('/api/v1/topics').then(d=>state.topics=d).catch(()=>{}),
    api('/api/v1/groups').then(d=>state.groups=d).catch(()=>{}),
    api('/api/v1/schemas').then(d=>state.schemas=d).catch(()=>{}),
    api('/api/v1/auth/status').then(d=>state.auth=d).catch(()=>{})]);
  state.lastRefresh=Date.now();
  updAgo();
  checkAlarms();
  if(state.view==='topology')renderTopoSvg();
}

/* dinamis: auto-refresh berkala + indikator "updated Xs ago" */
function updAgo(){
  const el=document.getElementById('updAgo');
  if(!el||!state.lastRefresh)return;
  const s=Math.max(0,Math.floor((Date.now()-state.lastRefresh)/1000));
  el.textContent='updated '+s+'s ago';
  el.title='Auto-refresh: '+(state.refreshMs/1000)+'s';
}
setInterval(updAgo,1000);
function scheduleRefresh(){ setTimeout(async()=>{ if(!document.hidden){ await refresh(); if(state.view==='connections')render(); if(state.view==='metrics')loadThroughput(); } scheduleRefresh(); },state.refreshMs); }
function skel(w){return '<span class="skel" style="width:'+(w||60)+'px"></span>';}
scheduleRefresh();

function buildTabs(){
  const tb=document.getElementById('tabs'); if(!tb)return;
  const items=navItems.map(([k,label])=>({k,label}));
  tb.innerHTML=items.map(it=>
    `<button class="tab ${state.view===it.k?'on':''}" onclick="goView('${it.k}')">${esc(it.label)}</button>`).join('');
}
let _tlistQ='';
function buildTList(){
  const wrap=document.getElementById('tlist'); if(!wrap)return;
  const topics=state.topics||[];
  wrap.innerHTML=(_tlistQ?topics.filter(t=>t.name.toLowerCase().includes(_tlistQ)):topics)
    .map(t=>{
      const ps=t.partitions||[];
      const parts=ps.length, leo=parts?Math.max(...ps.map(p=>p.logEndOffset||0)):0;
      const sel=state.view==='databrowser'&&state.topic===t.name;
      const dlq=/-(dlq|dead)$/i.test(t.name);
      return `<div class="titem ${sel?'on':''}" onclick="pickTopicNav('${esc(t.name)}')" title="${esc(t.name)} - ${parts} partitions - ${fmtBytes(t.totalBytes||0)}">
        <b>${esc(t.name)}${dlq?' <span style="color:var(--danger)">DLQ</span>':''}</b>
        <span>${parts} parts - ${fmtBytes(t.totalBytes||0)} - LEO ${leo}</span></div>`;
    }).join('')||'<div class="muted" style="padding:10px 12px;font-size:11px">No topics yet.</div>';
}
function renderTList(q){_tlistQ=(q||'').toLowerCase();buildTList();}
window.renderTList=renderTList;
function buildStatusbar(){
  let sb=document.getElementById('sbar');
  if(!sb){
    sb=document.createElement('div'); sb.id='sbar'; sb.className='sbar';

  const posChip=(state.view==='databrowser'&&state.leo!=null)?`<span>LEO ${state.leo}</span>`:'';
  sb.innerHTML=`<span><span class="sdot"></span>broker-${esc(String(c.brokerId??'-'))}</span>`

    +`<span style="flex:1"></span>`

    +`<span class="slink" onclick="goView('logs')">logs</span>`
    +`<span class="slink" onclick="goView('settings')">settings</span>`;
}

window.pickTopicNav=function(name){
  state.topic=name;state.partition='all';state.off=null;

};

/* ---- node detail drawer (topologi) ---- */
function openDrw(title,innerHtml){ $('#drwT').textContent=title; $('#drwBody').innerHTML=innerHtml; document.getElementById('drw').classList.add('open'); }

function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}
function copyText2(t,btn){
  const done=()=>{ if(!btn)return; const old=btn.textContent; btn.textContent='copied'; btn.classList.add('ok');
    setTimeout(()=>{btn.textContent=old;btn.classList.remove('ok');},1200); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>{fallbackCopy(t);done();}); }
  else{ fallbackCopy(t);done(); }
}
window.copyText2=copyText2;
/* ---- topology: peta broker -> topics -> groups dari data asli ---- */
function topoData(){
  const topics=(state.topics||[]).map(t=>{
    const ps=t.partitions||[];
    return {id:t.name,label:t.name,parts:ps.length,bytes:fmtBytes(t.totalBytes||0),
      end:ps.length?Math.max(...ps.map(p=>p.logEndOffset||0)):0,dlq:/-(dlq|dead)$/i.test(t.name),subscriptions:[]};
  });
  const groups=(state.groups||[]).map(g=>{
    const subs=[...new Set(Object.keys(g.lag||{}).map(k=>k.split('-').slice(0,-1).join('-')))];
    const lagTotal=Object.values(g.lag||{}).reduce((a,b)=>a+b,0);
    return {id:g.name,label:g.name,subs,lag:lagTotal,state:g.state};
  });
  groups.forEach(g=>g.subs.forEach(s=>{const t=topics.find(x=>x.id===s); if(t)t.subscriptions.push(g.id);}));
  return {topics,groups};
}
function topoLayout(n){
  if(n<=8)return {h:56,gap:14,pad:34,rowH:70};
  if(n<=14)return {h:44,gap:9,pad:28,rowH:53};
  return {h:34,gap:6,pad:24,rowH:40};
}
function renderTopoSvg(){
  const svg=document.getElementById('topoSvg'); if(!svg)return;
  const {topics,groups}=topoData();
  if(!topics.length&&!groups.length){svg.innerHTML='';return;}
  const L=topoLayout(topics.length);
  const H=Math.max(240,topics.length*L.rowH+40);
  const CX=470, GX=820, B={x:40,y:H/2-32,w:170,h:64};
  const colT=topics.map((t,i)=>({...t,x:CX,y:i*L.rowH+L.pad}));
  /* consumer groups: antre rapi dari atas (tidak bertumpuk), edge tetap mengikuti */
  const G_H=L.h, GAP=Math.max(12,(topics.length*L.rowH-groups.length*G_H)/(groups.length+1));
  const gc=groups.map((g,i)=>({...g,x:GX,y:L.pad+i*(G_H+GAP)}));
  const seenT=new Set(); let cyT=0;
  const T=colT.map(t=>{
    let y=t.y;
    while(seenT.has(Math.round(y))){y=t.y+(++cyT)*10;}
    seenT.add(Math.round(y)); return {...t,y};
  });
  let s=`<g>
    <rect class="nrect" x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="2"/>
    <text x="${B.x+16}" y="${B.y+24}">broker-${esc(String(state.cluster?.brokerId??'-'))}</text>
    <text class="sub" x="${B.x+16}" y="${B.y+42}">${esc(state.cluster?.security||'PLAINTEXT')} - ${esc(state.cluster?.version||'')}</text>
    <text class="sub" x="${B.x+16}" y="${B.y+56}">${fmtBytes(state.cluster?.totalBytes||0)} on disk</text>
  </g>`;
  T.forEach(t=>{
    s+=`<g><rect class="nrect" x="${t.x}" y="${t.y}" width="150" height="${L.h}" rx="2" onclick="topoPickTopic('${esc(t.id)}')"/>
      <text x="${t.x+12}" y="${t.y+(L.h/2)-2}">${esc(t.id)}</text>
      <text class="sub" x="${t.x+12}" y="${t.y+L.h-6}">${t.parts} parts - ${t.bytes}${t.dlq?' <tspan fill="var(--danger)">DLQ</tspan>':''}</text></g>`;
  });
  gc.forEach(g=>{

  });
  T.forEach(t=>{

      <text class="role" x="${GX}" y="${(gc[0]?gc[0].y:L.pad)-10}">consumer groups</text>`;
  svg.setAttribute('viewBox','0 0 1100 '+H);

/* ---- Fitur 13: hash router ---- */
function currentHash(){
  const h=location.hash.replace(/^#\/?/,'');
  if(!h)return ['connections',[]];
  const parts=h.split('/');
  return [parts[0],parts.slice(1)];
}
function applyHash(){
  const [view,parts]=currentHash();
  state.view=view;
  if(view==='databrowser'&&parts[0]){state.topic=decodeURIComponent(parts[0]);if(parts[1])state.partition=decodeURIComponent(parts[1]);if(parts[2])state.off=decodeURIComponent(parts[2]);}
  if(view==='groups'&&parts[0]){state.group=decodeURIComponent(parts[0]);}
  render();
}
window.addEventListener('hashchange',applyHash);
// syncHash menulis state browser ke URL agar bisa di-share/refresh.
function syncHash(){
  if(state.view!=='databrowser')return;
  let h='#/databrowser';
  if(state.topic)h+='/'+encodeURIComponent(state.topic);
  if(state.partition&&state.partition!=='all')h+='/'+encodeURIComponent(state.partition);
  if(state.off!=null&&state.off!=='')h+='/'+encodeURIComponent(state.off);
  if(location.hash!==h){ history.replaceState(null,'',h); }
}

function render(){
  buildTabs();buildTList();buildStatusbar();updateChips();
  const item=navItems.find(([k])=>k===state.view);
  const title=item?item[1]:'Settings';
  $('#title').textContent=title;$('#crumb').textContent=state.view==='databrowser'&&state.topic?('/ '+state.topic):(state.view==='groups'&&state.group?('/ '+state.group):'');
  $('#topActions').innerHTML=`<span class="switchWrap">${clusterSwitcherHtml()}</span>`+(state.view==='connections'?`<button class="btn ghost" style="padding:5px 12px;font-size:12px" onclick="refreshAll()">Refresh</button>`:
    state.view==='databrowser'?`<button class="btn" style="padding:5px 12px;font-size:12px" onclick="goView('connections')">Connections</button>`:'');
  const v=$('#view');
  if(state.auth&&state.auth.enabled&&!state.auth.authenticated){v.innerHTML=viewLogin();bindLogin();return;}
  if(state.view==='connections')v.innerHTML=viewConnections();
  else if(state.view==='databrowser')v.innerHTML=viewDataBrowser();
  else if(state.view==='topics')v.innerHTML=state.topicDetail?viewTopicDetail():viewTopics();
  else if(state.view==='groups')v.innerHTML=state.group?viewGroupDetail():viewGroups();

async function loadMsgs(){ if(!state.topic)return; try{

function getPath(o,path){ if(!o||!path)return''; return path.split('.').reduce((acc,k)=>(acc==null||typeof acc!=='object')?undefined:acc[k],o); }
function evalFilter(f,v){
  if(f.op==='exists') return f.value? getPath(v,f.field)!==undefined : getPath(v,f.field)===undefined;
  if(f.op==='regex'){ try{return new RegExp(f.value).test(String(getPath(v,f.field)??''));}catch(e){return false;} }
  const val=getPath(v,f.field);
  const a=val===undefined?undefined:String(val);
  const b=String(f.value);
  if(f.op==='contains') return a!=null&&a.includes(b);
  if(f.op==='==') return a!=null&&a===b;
  if(f.op==='!=') return a!=null&&a!==b;
  const na=Number(val), nb=Number(f.value);
  if(isNaN(na)||isNaN(nb))return false;
  if(f.op==='>') return na>nb;
  if(f.op==='<') return na<nb;
  if(f.op==='>=') return na>=nb;
  if(f.op==='<=') return na<=nb;
  return false;
}

/* ---- Fitur 13: WebSocket auto-reconnect with exponential backoff ---- */
function connectTail(){
  if(!state.tail)return;
  const proto=location.protocol==='https:'?'wss':'ws';
  const part=(!state.partition||state.partition==='all')?'all':state.partition;
  const ws=new WebSocket(`${proto}://${location.host}/api/v1/topics/${encodeURIComponent(state.topic)}/tail?partition=${encodeURIComponent(part)}`);
  state.ws=ws; state.retryCount=state.retryCount||0;
  ws.onopen=()=>{state.retryCount=0;};
  ws.onmessage=e=>{ const recs=JSON.parse(e.data); if(!recs.length)return;
    if(state.tailPaused){ state.pendingTail+=recs.length; updateTailBar(); return; }
    state.msgs=[...recs.slice().reverse(),...state.msgs]; if(state.msgs.length>200)state.msgs=state.msgs.slice(0,200); recs.slice().reverse().forEach(prependMsgRow); };
  ws.onclose=()=>{ if(!state.tail)return; const delay=Math.min(1000*Math.pow(1.5,state.retryCount++),10000); state.wsRetry=setTimeout(connectTail,delay); };
  ws.onerror=()=>{ ws.close(); };
}

window.genCode=function(){ const inp=document.getElementById('pgInput').value; let obj; try{obj=JSON.parse(inp);}catch(e){toast('Invalid JSON');return;} const lang=document.getElementById('pgLang').value; const out=document.getElementById('pgOut'); out.textContent=objToCode(obj,lang); };
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function tsType(v){if(v===null)return'unknown';if(Array.isArray(v))return (v.length?'Array<'+tsType(v[0])+'>':'unknown[]');if(typeof v==='object')return'Record<string, unknown>';if(typeof v==='number')return v%1===0?'number':'number';if(typeof v==='boolean')return'boolean';return'string';}
function goType(v){if(Array.isArray(v))return '[]'+goType(v[0]||'string');if(typeof v==='object')return 'map[string]any';if(typeof v==='number')return v%1===0?'int64':'float64';if(typeof v==='boolean')return'bool';return'string';}
function pyType(v){if(Array.isArray(v))return'List['+pyType(v[0]||'str')+']';if(typeof v==='object')return'Dict[str, Any]';if(typeof v==='number')return'float';if(typeof v==='boolean')return'bool';return'str';}
function objToCode(obj,lang){
  const name='Payload';
  if(lang==='go'){
    const lines=[]; lines.push('type '+name+' struct {'); for(const k in obj){ lines.push(`\t${cap(k)} ${goType(obj[k])} \`json:"${k}"\``); } lines.push('}'); return lines.join('\n');
  } else if(lang==='ts'){
    const lines=[]; lines.push('export interface '+name+' {'); for(const k in obj){ lines.push(`  ${k}: ${tsType(obj[k])};`); } lines.push('}'); return lines.join('\n');
  } else {
    const lines=[]; lines.push('from pydantic import BaseModel'); lines.push('from typing import Any, List, Dict'); lines.push(''); lines.push('class '+name+'(BaseModel):'); for(const k in obj){ lines.push(`    ${k}: ${pyType(obj[k])}`); } return lines.join('\n');
  }
}

window.rpcSend=function(){ const req=document.getElementById('rpcReq').value,reply=document.getElementById('rpcReply').value,method=document.getElementById('rpcMethod').value,payload=document.getElementById('rpcPayload').value; const corr=Math.random().toString(36).slice(2,10); const body={key:corr,value:JSON.stringify({method,request:JSON.parse(payload||'{}'),reply_to:reply}),headers:{correlation_id:corr,reply_to_topic:reply,type:'request'}}; api('/api/v1/topics/'+encodeURIComponent(req)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>toast('RPC request sent @ offset '+r.offset+' (corr '+corr+')')).catch(e=>toast(e.message)); };

window.schemaDiff=function(subj,ver){ const el=document.getElementById('schVersions'); if(!el)return; api('/api/v1/schemas/'+encodeURIComponent(subj)).then(vers=>{ const cur=vers.find(v=>v.version===ver); const prev=vers.find(v=>v.version===ver-1); if(!cur||!prev){toast('No previous version to diff');return;} const a=fmtSchema(prev.schema), b=fmtSchema(cur.schema); const la=a.split('\n'), lb=b.split('\n'); const max=Math.max(la.length,lb.length); let html='<div class="diffWrap" style="margin-top:8px">'; for(let i=0;i<max;i++){ const x=la[i]||'',y=lb[i]||''; const same=x.trim()===y.trim(); html+=`<div style="flex:1;font-family:var(--font-mono);font-size:11px"><div class="${same?'d-ctx':'d-rem'}">${esc(x||' ')}</div></div>`; html+=`<div style="flex:1;font-family:var(--font-mono);font-size:11px"><div class="${same?'d-ctx':'d-add'}">${esc(y||' ')}</div></div>`; } html+='</div>'; el.innerHTML+=`<div style="margin-top:14px"><b style="font-size:12px">Diff v${prev.version} -&gt; v${cur.version}</b>${html}</div>`; }).catch(e=>toast(e.message)); };
function fmtSchema(s){ try{return JSON.stringify(JSON.parse(s),null,2);}catch(e){return s;} }

function viewSecurity(){

async function loadACLs(){ const out=document.getElementById('aclOut'); if(!out)return; try{ const acls=await api('/api/v1/acls'); const principals=[...new Set(acls.map(a=>a.principal))]; const resources=[...new Set(acls.map(a=>a.resourceName))]; out.innerHTML=`<table><thead><tr><th>Principal</th><th>Resource</th><th>Read</th><th>Write</th><th>Admin</th><th></th></tr></thead><tbody>${acls.map(a=>`<tr><td class="mono">${esc(a.principal)}</td><td class="mono">${esc(a.resourceType)}:${esc(a.resourceName)}</td>${['Read','Write','Admin'].map(o=>`<td><button class="toggle ${a.operations.includes(o)?'on':''}" onclick="toggleOp('${esc(a.principal)}','${esc(a.resourceType)}','${esc(a.resourceName)}','${o}')" title="${o}"></button></td>`).join('')}<td><button class="btn danger" style="padding:2px 8px;font-size:11px" onclick="delACL('${esc(a.principal)}','${esc(a.resourceType)}','${esc(a.resourceName)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No ACLs defined.</td></tr>'}</tbody></table>`; }catch(e){out.textContent='error: '+e.message;} }
window.addACLRow=function(){ const el=document.createElement('div'); el.innerHTML=`<div class="overlay"><div class="modal"><h3>Add ACL</h3><label>Principal (user)</label><input id="aUser" placeholder="app-writer"><label>Resource type</label><select id="aType"><option value="topic">topic</option><option value="group">group</option></select><label>Resource name</label><input id="aName" placeholder="orders"><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="aclsave()">Add</button><button class="btn ghost" onclick="closeOverlay()">Cancel</button></div></div></div>`; document.body.appendChild(el); };
window.aclsave=async function(){ const u=document.getElementById('aUser').value,t=document.getElementById('aType').value,n=document.getElementById('aName').value; if(!u||!n){toast('principal and resource required');return;} try{ await api('/api/v1/acls',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({principal:u,resourceType:t,resourceName:n,operations:['Read']})}); closeOverlay(); loadACLs(); loadAudit(); }catch(e){toast(e.message);} };
window.toggleOp=async function(p,rt,rn,op){ try{ const acls=await api('/api/v1/acls'); const rule=acls.find(a=>a.principal===p&&a.resourceType===rt&&a.resourceName===rn); const ops=(rule&&rule.operations)||[]; const has=ops.includes(op); const next=has?ops.filter(x=>x!==op):[...ops,op]; await api('/api/v1/acls',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({principal:p,resourceType:rt,resourceName:rn,operations:next})}); loadACLs(); }catch(e){toast(e.message);} };
window.delACL=async function(p,rt,rn){ try{ await api('/api/v1/acls',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({principal:p,resourceType:rt,resourceName:rn})}); loadACLs(); loadAudit(); }catch(e){toast(e.message);} };
async function loadAudit(){ const b=document.getElementById('auditBody'); if(!b)return; try{ const log=await api('/api/v1/audit'); b.innerHTML=log.map(e=>`<tr><td class="mono">${new Date(e.time).toISOString()}</td><td>${esc(e.actor)}</td><td class="chip">${esc(e.action)}</td><td class="mono">${esc(e.resource)}</td><td>${esc(e.detail)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No activity yet.</td></tr>'; }catch(e){b.innerHTML='<tr><td colspan="5" class="muted">error</td></tr>';} }

/* ================= Fitur 4.6: In-App Health Alarms ================= */
function activeAlerts(){
  const alerts=[];
  // Consumer lag > 1000
  const gs=Array.isArray(state.groups)?state.groups:[];
  for(const g of gs){ const lag=Object.values(g.lag||{}).reduce((a,b)=>a+b,0); if(lag>1000){ alerts.push('Consumer lag '+lag+' on group '+g.name+' (>1000)'); } }
  // Disk usage > 85% (uses the broker's data dir; cluster reports totalBytes as a proxy)
  const c=state.cluster||{};
  if(c.diskUsagePct && c.diskUsagePct>85){ alerts.push('Disk usage '+c.diskUsagePct+'% (>85%)'); }
  // DLQ: only topics that actually hold messages (LEO > 0 or non-empty bytes)
  for(const t of (Array.isArray(state.topics)?state.topics:[])){
    if(/-(dlq|dead)$/i.test(t.name)){
      const hasMsgs=(t.totalBytes||0)>0||(t.partitions||[]).some(p=>(p.logEndOffset||0)>0);
      if(hasMsgs){ alerts.push('DLQ topic '+t.name+' has messages'); }
    }
  }
  return alerts;
}
function checkAlarms(){
  const alerts=activeAlerts();
  // Forget dismissals for alerts that no longer fire, so a recurring
  // condition re-alarms when it comes back later.
  for(const k of [...state.alarmsDismissed]) if(!alerts.includes(k)) state.alarmsDismissed.delete(k);
  const shown=alerts.filter(a=>!state.alarmsDismissed.has(a));
  const existing=document.getElementById('alarmBanner');
  if(shown.length){
    if(!existing){ const b=document.createElement('div'); b.id='alarmBanner'; b.className='alarmBanner'; document.body.prepend(b); }
    const b=document.getElementById('alarmBanner');
    b.innerHTML='<b>ALERT</b> '+shown.map(esc).join(' &middot; ')+' <button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="dismissAlarms()">Dismiss</button>';
  }
  else if(existing){ existing.remove(); }
}
// Dismiss remembers the decision for this session so the 5s auto-refresh
// does not resurrect the banner.
window.dismissAlarms=function(){
  for(const a of activeAlerts()) state.alarmsDismissed.add(a);
  try{ sessionStorage.setItem('pk_dismissed',JSON.stringify([...state.alarmsDismissed])); }catch(e){}
  const b=document.getElementById('alarmBanner'); if(b)b.remove();
};

/* ---- URL sync + sorting helpers ---- */
function timeCell(ts){ return state.timeAbs
  ? '<div>'+new Date(ts).toISOString()+'</div><div class="rel">'+rel(ts)+'</div>'
  : '<div>'+rel(ts)+'</div><div class="rel">'+new Date(ts).toISOString()+'</div>'; }
window.sortInd=function(k,f){const s=state.sort[k];return s&&s.f===f?(s.dir==='asc'?'^':'v'):''};
window.sortRows=function(k,f){const s=state.sort[k]||{};s.dir=(s.f===f&&s.dir==='asc')?'desc':'asc';s.f=f;state.sort[k]=s;render();};
function sortedTopics(){ const s=state.sort.topics; if(!s)return state.topics; const mul=s.dir==='asc'?1:-1;
  return state.topics.slice().sort((a,b)=>{ let va,vb;
    if(s.f==='name'){va=a.name;vb=b.name;}
    else if(s.f==='size'){va=a.totalBytes||0;vb=b.totalBytes||0;}
    else {va=((a.partitions||[])[0]||{}).logEndOffset||0;vb=((b.partitions||[])[0]||{}).logEndOffset||0;}
    return (va>vb?1:va<vb?-1:0)*mul; }); }
function sortedGroups(){ const s=state.sort.groups; const arr=state.groups.slice(); if(!s)return arr; const mul=s.dir==='asc'?1:-1;
  return arr.sort((a,b)=>{ let va,vb;
    if(s.f==='name'){va=a.name;vb=b.name;}
    else if(s.f==='members'){va=(a.members||[]).length;vb=(b.members||[]).length;}
    else {va=Object.values(a.lag||{}).reduce((x,y)=>x+y,0);vb=Object.values(b.lag||{}).reduce((x,y)=>x+y,0);}
    return (va>vb?1:va<vb?-1:0)*mul; }); }

  <div class="card"><div class="kicker">Ingest</div><h3>Throughput</h3>
    <div class="statXL" id="tpRate">--<small>msg/s</small></div><div class="statSub" id="tpTotal"></div>

async function loadThroughput(){

    }catch(e){ m.textContent='error: '+e.message; } }

function viewLogs(){ return `<div class="card"><div class="kicker">Diagnostics</div><h3 style="margin-bottom:10px">Broker Logs</h3>

async function loadLogs(){ const out=document.getElementById('logOut'); if(!out)return;

/* ---- Command palette (Ctrl+K / '/') ---- */
function palItems(){
  const items=navItems.map(([k,label])=>({label,run:()=>goView(k),hint:'view'}));
  (state.topics||[]).forEach(t=>items.push({label:t.name,run:()=>{state.topic=t.name;goView('databrowser').then(()=>loadMsgs());},hint:'topic'}));
  (state.groups||[]).forEach(g=>items.push({label:g.name,run:()=>{goView('groups').then(()=>openGroup(g.name));},hint:'group'}));
  return items;
}
window.openPalette=function(){
  if(document.querySelector('.overlay.palette'))return;
  const el=document.createElement('div'); el.className='overlay palette';
  el.innerHTML='<div class="paletteBox"><input id="palQ" placeholder="Ketik view, topic, atau group..." autocomplete="off"></div>';
  document.body.appendChild(el);
  el.addEventListener('mousedown',e=>{if(e.target===el)closeOverlay();});
  const inp=el.querySelector('#palQ'); let sel=0;
  const renderList=()=>{ const q=inp.value.toLowerCase(); const items=palItems().filter(i=>i.label.toLowerCase().includes(q)).slice(0,12);
    el._items=items; el.querySelector('.palList')?.remove();
    const list=document.createElement('div'); list.className='palList';
    items.forEach((it,idx)=>{ const d=document.createElement('div'); d.className='palItem'+(idx===sel?' sel':'');
      d.innerHTML='<span>'+esc(it.label)+'</span><span class="palHint">'+it.hint+'</span>';
      d.onclick=()=>{closeOverlay();it.run();}; list.appendChild(d); });
    el.querySelector('.paletteBox').appendChild(list); };
  inp.oninput=()=>{sel=0;renderList();};
  inp.onkeydown=e=>{ const items=el._items||[];
    if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1);renderList();e.preventDefault();}
    else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);renderList();e.preventDefault();}
    else if(e.key==='Enter'){if(items[sel]){closeOverlay();items[sel].run();}}
    else if(e.key==='Escape'){closeOverlay();} };
  renderList(); inp.focus();
};
if(!window._palBound){ window._palBound=1;
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();}
    else if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement?.tagName||'')){e.preventDefault();openPalette();}
    else if(e.key==='Escape'){closeDrawer();}
  });
}

window.copyConsumer=function(topic){ if(!topic){toast('Select a topic first');return;}
  const code='// Go + sarama (protocol 0.11)\nconfig := sarama.NewConfig()\nconfig.Version = sarama.V0_11_0_0\ncg, err := sarama.NewConsumerGroup([]string{"localhost:9092"}, "my-group", config)\nif err != nil { panic(err) }\n// consume topic: '+topic+'\nfor {\n\tif err := cg.Consume(ctx, []string{"'+topic+'"}, handler); err != nil { break }\n}';
  navigator.clipboard.writeText(code).then(()=>toast('consumer snippet copied')); };

/* ---- Live tail: pause on scroll-up ---- */
function updateTailBar(){ const bar=document.getElementById('tailBar'); if(!bar)return;
