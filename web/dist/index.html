<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketKafka</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#080c14; --surface:#0f172a; --surface2:#111827; --surface3:#1e293b; --border:#1e293b; --border-soft:rgba(255,255,255,.06);
    --primary:#7c3aed; --primary-strong:#7c3aed; --primary-soft:rgba(124,58,237,.16); --primary-text:#c4b5fd; --accent:#8b5cf6; --on-primary:#ffffff;
    --live:#10b981; --success:#10b981; --warn:#f59e0b; --danger:#ef4444;
    --str:#34d399; --num:#38bdf8; --bool:#fbbf24; --key:#e2e8f0;
    --text:#e2e8f0; --muted:#94a3b8;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --rail-w:56px; --radius:16px; --radius-sm:10px;
    --ring:0 0 0 3px rgba(139,92,246,.35);
    --glow:0 0 24px rgba(139,92,246,.35);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f5f6fb; --surface:#ffffff; --surface2:#f1f3f9; --surface3:#e9ecf5; --border:#e3e6f0; --border-soft:rgba(15,23,42,.05);
    --primary:#7c3aed; --primary-soft:rgba(124,58,237,.12); --primary-text:#6d28d9; --accent:#8b5cf6; --on-primary:#fff;
    --success:#059669; --warn:#d97706; --danger:#dc2626;
    --str:#059669; --num:#2563eb; --bool:#b45309; --key:#334155;
    --text:#0f172a; --muted:#5b6478;
    --ring:0 0 0 3px rgba(124,58,237,.22); --glow:0 0 20px rgba(124,58,237,.18);
    --shadow:0 1px 2px rgba(15,20,40,.06),0 12px 32px rgba(15,20,40,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .app{display:flex;height:100vh}

  /* rail */
  .rail{width:var(--rail-w);background:#0b0f19;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;flex-shrink:0;gap:4px}
  html[data-theme="light"] .rail{background:#f6f7fb}
  .rail .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(124,58,237,.5)}
  .rail button{position:relative;width:40px;height:40px;border:none;background:transparent;color:var(--muted);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,transform .1s}
  .rail button:hover{background:var(--surface2);color:var(--text)}
  .rail button:active{transform:scale(.92)}
  .rail button.active{background:var(--primary-soft);color:var(--primary-text)}
  .rail button.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);box-shadow:var(--glow)}
  .rail button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:7px;font-size:11px;white-space:nowrap;box-shadow:var(--shadow);z-index:40}
  .rail .spacer{flex:1}

  .col{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
  .topbar h1{font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:28px;font-family:var(--font-ui)}
  .topbar .crumb{color:var(--muted);font-size:12px}
  .topbar .sp{flex:1}
  .btn{background:var(--primary);color:var(--on-primary);border:none;padding:8px 16px;border-radius:10px;font-weight:500;cursor:pointer;font-size:13px;letter-spacing:-.01em;font-family:var(--font-ui);transition:filter .15s,transform .1s,box-shadow .15s,background .15s}
  .btn:hover{filter:brightness(1.08);box-shadow:var(--glow)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:focus-visible{outline:none;box-shadow:var(--ring)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--surface2);box-shadow:none}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,.4)}
  .btn.danger:hover{background:rgba(239,68,68,.08);box-shadow:none}

  main{flex:1;overflow:auto;padding:26px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}

  /* connection card */
  .conn{border:1px solid var(--border);transition:border-color .2s,transform .15s,box-shadow .2s}
  .conn:hover{border-color:rgba(139,92,246,.5);transform:translateY(-3px);box-shadow:var(--glow)}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;margin-right:8px;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
  .conn .tag{background:var(--primary-soft);color:var(--primary-text);border-radius:6px;padding:2px 9px;font-size:10px;font-weight:600;letter-spacing:.05em;margin-left:8px;font-family:var(--font-mono);font-feature-settings:'tnum' on,'zero' on}
  .conn .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12px}
  .conn .row:last-child{border-bottom:none}
  .conn .k{color:var(--muted)}
  .conn .actions{display:flex;gap:8px;margin-top:16px}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .toolbar .group{display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;backdrop-filter:blur(8px)}
  .toolbar .pill{background:transparent;border:none;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer;font-size:12px;transition:background .15s,color .15s}
  .toolbar .pill:hover{background:var(--surface2);color:var(--text)}
  .toolbar .pill.active{background:var(--primary-soft);color:var(--primary-text)}
  .pill.part{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .15s;font-family:var(--font-mono)}
  .pill.part:hover{color:var(--text)}
  .pill.part.active{background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary)}
  select,input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:12px;transition:border-color .15s,box-shadow .15s;font-family:var(--font-ui)}
  select:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
  input{width:100%}

  /* pulsing live dot */
  .live-dot{position:relative;display:inline-flex;width:9px;height:9px}
  .live-dot::before,.live-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live)}
  .live-dot::after{animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}

  /* row entry flash */
  @keyframes row-entry-flash{0%{background-color:rgba(16,185,129,.22);transform:translateY(-4px);opacity:0}50%{background-color:rgba(16,185,129,.12);opacity:1;transform:translateY(0)}100%{background-color:transparent}}
  .animate-row-entry{animation:row-entry-flash 1.2s cubic-bezier(.16,1,.3,1) forwards}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2);font-family:var(--font-ui)}
  td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;font-family:var(--font-mono);font-feature-settings:'tnum' on,'zero' on;font-variant-numeric:tabular-nums}
  
  tbody tr{transition:background .1s}
  tbody tr:hover td{background:var(--surface3)}
  .muted{color:var(--muted)}
  .rel{color:var(--muted);font-size:11px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
  .b-green{background:rgba(16,185,129,.15);color:var(--success)}
  .b-amber{background:rgba(245,158,11,.15);color:var(--warn)}
  .b-purple{background:var(--primary-soft);color:var(--primary-text)}
  .chip{font-family:var(--font-mono);font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;margin:0 2px}
  .rowclick{cursor:pointer}

  /* glass inspector */
  .inspector{position:relative;background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);margin-top:16px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  html[data-theme="light"] .inspector{background:rgba(255,255,255,.7);border-color:rgba(15,23,42,.08)}
  .inspector h3{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:12px;font-family:var(--font-mono)}
  pre{font-family:var(--font-mono);font-size:12px;font-feature-settings:'tnum' on,'zero' on;white-space:pre-wrap;word-break:break-word;background:rgba(8,12,20,.4);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;overflow:auto;line-height:1.6}
  html[data-theme="light"] pre{background:var(--surface2);border-color:var(--border)}
  .jkey{color:var(--key)}.jstr{color:var(--str)}.jnum{color:var(--num)}.jbool{color:var(--bool)}.jnull{color:var(--muted)}
  .jnode{padding-left:14px;border-left:1px solid var(--border-soft);margin-left:6px}
  .jrow{cursor:pointer;border-radius:4px;padding:1px 4px;transition:background .1s}
  .jrow:hover{background:var(--surface3)}
  .jarrow{display:inline-block;width:14px;color:var(--muted);font-family:var(--font-mono);font-size:10px}

  .kv{display:flex;gap:12px;margin-bottom:10px}.kv>div{flex:1}
  label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;font-weight:500}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;font-family:var(--font-mono);font-size:12px;resize:vertical;transition:border-color .15s,box-shadow .15s}
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
  .msg{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;font-size:12px;transform:translateY(10px);z-index:50}
  .msg.show{opacity:1;transform:translateY(0)}
  .hdr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .hidden{display:none}
  a{color:var(--primary-text);text-decoration:none}
  a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  /* partition bars */
  .pbar{height:6px;border-radius:4px;background:var(--surface3);overflow:hidden;margin-top:4px}
  .pbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px}

  /* ---- Fitur 3.2: filter builder ---- */
  .filterPanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
  .filterRow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .filterRow select,.filterRow input{width:auto;flex:0 1 auto}
  .filterRow .fField{width:200px}
  .filterRow .fOp{width:120px}
  .filterRow .fVal{width:180px}
  .frmBtn{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:15px;line-height:1}
  .autocomplete{position:relative}
  .acList{position:absolute;top:100%;left:0;right:0;background:var(--surface3);border:1px solid var(--border);border-radius:8px;max-height:180px;overflow:auto;z-index:60;box-shadow:var(--shadow)}
  .acList div{padding:7px 11px;cursor:pointer;font-family:var(--font-mono);font-size:11px}
  .acList div:hover,.acList div.act{background:var(--primary-soft);color:var(--primary-text)}
  .presetChip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary-text);border-radius:6px;padding:2px 9px;font-size:11px;margin:2px 4px 2px 0;cursor:pointer}
  .presetChip button{background:none;border:none;color:inherit;cursor:pointer;font-size:11px;padding:0 2px}

  /* ---- Fitur 3.3: column projection ---- */
  .projBar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .projTag{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;font-family:var(--font-mono)}
  .projTag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px}
  .projTag button:hover{color:var(--danger)}

  /* ---- Fitur 3.4: message diff ---- */
  .diffPanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:16px}
  .diffWrap{display:flex;gap:14px}
  .diffCol{flex:1;min-width:0}
  .diffCol h4{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:8px}
  .diffCol pre{max-height:360px;overflow:auto}
  .d-rem{background:rgba(239,68,68,.15);color:#fca5a5}
  .d-add{background:rgba(16,185,129,.15);color:#6ee7b7}
  .d-ctx{color:var(--muted)}

  /* ---- Fitur 3.5: replay / DLQ ---- */
  .overlay{position:fixed;inset:0;background:rgba(8,12,20,.6);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:center;justify-content:center}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(620px,94vw);box-shadow:var(--shadow)}
  .modal h3{font-size:15px;margin-bottom:14px}
  .chkCell{width:32px;text-align:center}

  /* ---- Fitur 4.x enterprise ---- */
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat .v{font-family:var(--font-mono);font-size:22px;font-weight:600}
  .stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .graph{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:16px}
  .gNode{position:absolute;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-family:var(--font-mono);font-size:11px;text-align:center}
  .gNode .glabel{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
  .gNode.hot{border-color:var(--warn);box-shadow:0 0 12px rgba(245,158,11,.25)}
  .gEdge{position:absolute;height:2px;background:var(--border);transform-origin:left center;z-index:-1}
  .edgeFlow{background:linear-gradient(90deg,var(--primary),var(--accent));height:2px;position:absolute;z-index:0;animation:edgePulse 2s ease-in-out infinite}
  @keyframes edgePulse{0%,100%{opacity:.2}50%{opacity:1}}
  .skewBar{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
  .skewBar>div{flex:1;background:linear-gradient(180deg,var(--primary),var(--accent));border-radius:4px 4px 0 0;position:relative;min-width:0}
  .skewBar>div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--muted)}
  .segBlock{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:#fff;margin:2px 0;overflow:hidden;white-space:nowrap}
  .segBlock.act{background:linear-gradient(90deg,var(--primary),var(--accent))}
  .segBlock.closed{background:var(--surface3);border:1px solid var(--border);color:var(--muted)}
  .segBlock.remote{background:linear-gradient(90deg,#059669,#10b981)}
  .toggle{position:relative;width:38px;height:20px;border-radius:20px;background:var(--surface3);cursor:pointer;border:none;transition:background .15s}
  .toggle.on{background:var(--primary)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
  .toggle.on::after{transform:translateX(18px)}
  .codeOut{background:rgba(8,12,20,.5);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--font-mono);font-size:11px;overflow:auto;max-height:320px}
  .alarmBanner{position:fixed;top:0;left:0;right:0;z-index:80;padding:10px 18px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;background:rgba(239,68,68,.15);border-bottom:1px solid rgba(239,68,68,.4);color:#fca5a5;backdrop-filter:blur(8px)}
  .switchWrap{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 8px;font-size:11px}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="col">
    <header class="topbar">
      <h1 id="title">Connections</h1>
      <span class="crumb" id="crumb"></span>
      <span class="sp"></span>
      <span id="topActions"></span>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="msg" id="msg"></div>

<script>
const $=s=>document.querySelector(s);
const I={server:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/></svg>',
  layers:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
  table:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>',
  code:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  users:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  sun:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>',
  moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',

/* ---- Fitur 15: auto theme detection (prefers-color-scheme) ---- */
function initTheme(){
  const saved=localStorage.getItem('kadeck_theme');
  if(saved){state.theme=saved;document.documentElement.dataset.theme=saved;return;}
  const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  state.theme=prefersDark?'dark':'light';
  document.documentElement.dataset.theme=state.theme;
}

async function api(p,o){const r=await fetch(p,o);let j;try{j=await r.json();}catch(e){j={};}if(r.status===401&&state.auth&&state.auth.enabled){showLogin();throw new Error('Authentication required');}if(!r.ok)throw new Error(j.error||r.status);return j;}
function toast(t){const m=$('#msg');m.textContent=t;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2500);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtBytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
function rel(t){const d=Math.max(0,Date.now()-t);if(d<1000)return 'now';if(d<60000)return Math.floor(d/1000)+'s ago';if(d<3600000)return Math.floor(d/60000)+'m ago';return Math.floor(d/3600000)+'h ago';}
function online(s){s=(s||'').toLowerCase();return s==='stable'||s==='green';}

    api('/api/v1/topics').then(d=>state.topics=d).catch(()=>{}),
    api('/api/v1/groups').then(d=>state.groups=d).catch(()=>{}),
    api('/api/v1/schemas').then(d=>state.schemas=d).catch(()=>{}),

}

/* ---- Fitur 13: hash router ---- */
function currentHash(){
  const h=location.hash.replace(/^#\/?/,'');
  if(!h)return ['connections',[]];
  const parts=h.split('/');
  return [parts[0],parts.slice(1)];
}
function applyHash(){
  const [view,parts]=currentHash();
  state.view=view;
  if(view==='databrowser'&&parts[0]){state.topic=decodeURIComponent(parts[0]);}
  if(view==='groups'&&parts[0]){state.group=decodeURIComponent(parts[0]);}
  render();
}

function render(){
  buildRail();
  const item=navItems.find(([k])=>k===state.view);

  $('#title').textContent=title;$('#crumb').textContent=state.view==='databrowser'&&state.topic?('/ '+state.topic):(state.view==='groups'&&state.group?('/ '+state.group):'');

    state.view==='databrowser'?`<button class="btn" onclick="goView('connections')">Connections</button>`:'');
  const v=$('#view');
  if(state.auth&&state.auth.enabled&&!state.auth.authenticated){v.innerHTML=viewLogin();bindLogin();return;}
  if(state.view==='connections')v.innerHTML=viewConnections();
  else if(state.view==='databrowser')v.innerHTML=viewDataBrowser();
  else if(state.view==='topics')v.innerHTML=state.topicDetail?viewTopicDetail():viewTopics();
  else if(state.view==='groups')v.innerHTML=state.group?viewGroupDetail():viewGroups();

  else if(state.view==='producer')v.innerHTML=viewProducer();
  else if(state.view==='devstudio')v.innerHTML=viewDevStudio();
  else if(state.view==='topology')v.innerHTML=viewTopology();
  else if(state.view==='storage')v.innerHTML=viewStorage();
  else if(state.view==='security')v.innerHTML=viewSecurity();
  else if(state.view==='settings')v.innerHTML=viewSettings();
  bindView();
}

async function loadMsgs(){ if(!state.topic)return; try{

  state.msgs=res.records||res;

function jnode(key,val){tnId++;const id=tnId;
  if(val===null||typeof val!=='object'){return '<div class="jrow" style="cursor:default;padding-left:0"><span class="jkey">"'+esc(key)+'"</span>: '+prim(val)+'</div>';}
  const open=val&&Object.keys(val).length<=8;

window.insp=function(m){$('#inspector').classList.remove('hidden');const obj={topic:m.topic,partition:m.partition,offset:m.offset,timestamp:new Date(m.timestamp).toISOString(),key:m.key,headers:m.headers,valueSize:m.valueSize,value:fmtValue(m)};let body='';for(const k in obj)body+=jnode(k,obj[k]);$('#insp').innerHTML='<div class="jnode" style="border:none;margin:0;padding-left:0">'+body+'</div>';};
function fmtValue(m){ if(state.decoder==='hex')return hex(m.valueB64); if(m.isJSON)return JSON.stringify(JSON.parse(m.value||'null'),null,2); return m.value; }
function hex(b64){let s='',bin=atob(b64||'');for(let i=0;i<bin.length;i++)s+=bin.charCodeAt(i).toString(16).padStart(2,'0')+' ';return s.trim();}

function jsonOf(m){ if(m.isJSON){ try{return JSON.parse(m.value||'null');}catch(e){return null;} } return null; }
function pathKeys(obj,prefix){ let out=[]; for(const k in obj){ const p=prefix?prefix+'.'+k:k; if(obj[k]&&typeof obj[k]==='object'){out=out.concat(pathKeys(obj[k],p));} out.push(p); } return out; }
function refreshFieldHints(){ if(!state.topic)return; const s=state.msgs.slice(0,10); const seen={}; const keys=[]; s.forEach(m=>{ const v=jsonOf(m); if(v)pathKeys(v,'').forEach(p=>{if(!seen[p]){seen[p]=1;keys.push(p);}}); }); state.fieldHint=keys.slice(0,40); }

    <input class="fVal" placeholder="value" value="${esc(f.value||'')}" oninput="state.filters[${i}].value=this.value">

window.savePreset=function(){const nm=prompt('Preset name:');if(!nm)return;const presets=JSON.parse(localStorage.getItem('pk_presets')||'[]');presets.push({name:nm,filters:JSON.parse(JSON.stringify(state.filters))});localStorage.setItem('pk_presets',JSON.stringify(presets));render();};

function getPath(o,path){ if(!o||!path)return''; return path.split('.').reduce((acc,k)=>(acc==null||typeof acc!=='object')?undefined:acc[k],o); }
function evalFilter(f,v){
  if(f.op==='exists') return f.value? getPath(v,f.field)!==undefined : getPath(v,f.field)===undefined;
  if(f.op==='regex'){ try{return new RegExp(f.value).test(String(getPath(v,f.field)??''));}catch(e){return false;} }
  const val=getPath(v,f.field);
  const a=val===undefined?undefined:String(val);
  const b=String(f.value);
  if(f.op==='contains') return a!=null&&a.includes(b);
  if(f.op==='==') return a!=null&&a===b;
  if(f.op==='!=') return a!=null&&a!==b;
  const na=Number(val), nb=Number(f.value);
  if(isNaN(na)||isNaN(nb))return false;
  if(f.op==='>') return na>nb;
  if(f.op==='<') return na<nb;
  if(f.op==='>=') return na>=nb;
  if(f.op==='<=') return na<=nb;
  return false;
}

window.exportMsgs=function(fmt){ const all=filteredMsgs(); if(!all.length){toast('Nothing to export');return;} const name=`${state.topic||'msgs'}.${fmt==='csv'?'csv':'jsonl'}`; let content=''; if(fmt==='jsonl'){ content=all.map(m=>JSON.stringify({topic:m.topic,partition:m.partition,offset:m.offset,timestamp:m.timestamp,key:m.key,headers:m.headers,value:m.value})).join('\n'); } else { const cols=['topic','partition','offset','timestamp','key','value']; const escCsv=s=>{s=String(s??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}; content=cols.join(',')+'\n'+all.map(m=>cols.map(c=>escCsv(c==='value'?m.value:m[c])).join(',')).join('\n'); } const blob=new Blob([content],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),100); };

/* ---- Fitur 13: WebSocket auto-reconnect with exponential backoff ---- */
function connectTail(){
  if(!state.tail)return;
  const proto=location.protocol==='https:'?'wss':'ws';
  const ws=new WebSocket(`${proto}://${location.host}/api/v1/topics/${encodeURIComponent(state.topic)}/tail`);
  state.ws=ws; state.retryCount=state.retryCount||0;
  ws.onopen=()=>{state.retryCount=0;};
  ws.onmessage=e=>{ const recs=JSON.parse(e.data); if(!recs.length)return; state.msgs=[...recs.slice().reverse(),...state.msgs]; if(state.msgs.length>200)state.msgs=state.msgs.slice(0,200); recs.slice().reverse().forEach(prependMsgRow); };
  ws.onclose=()=>{ if(!state.tail)return; const delay=Math.min(1000*Math.pow(1.5,state.retryCount++),10000); state.wsRetry=setTimeout(connectTail,delay); };
  ws.onerror=()=>{ ws.close(); };
}

window.switchCluster=function(json){ if(!json)return; const c=JSON.parse(json); toast('Switching to '+c.name+' (demo: single-broker build)'); };
window.addCluster=function(){ const nm=prompt('Cluster name:','Local Docker'); const bk=prompt('Broker address:','localhost:9092'); if(!nm)return; const cl=clusterList(); cl.push({name:nm,broker:bk}); localStorage.setItem('pk_clusters',JSON.stringify(cl)); render(); };

/* ================= Fitur 4.1: Developer Studio ================= */
function viewDevStudio(){
  return `<div class="grid">
    <div class="card"><h3 style="margin-bottom:12px">Mock Stream Generator</h3>
      <label>Topic</label><input id="mkTopic" list="tl" value="${esc(state.topic||'demo')}">
      <label>Messages / sec (1-1000)</label><input id="mkRate" type="number" value="10" min="1" max="1000">
      <label>Template</label><select id="mkTpl">
        <option value="faker">Faker (name,email,price,uuid,status)</option>
        <option value="order">Order (id,item,price)</option>
        <option value="iot">IoT (device,temp,humidity)</option>
      </select>
      <div style="margin-top:12px"><button class="btn" onclick="mockGenStart()">Start</button> <button class="btn danger" onclick="mockGenStop()">Stop</button>
      <span class="muted" style="font-size:11px" id="mockStat"></span></div>
    </div>
    <div class="card"><h3 style="margin-bottom:12px">Payload → Code Generator</h3>
      <label>Paste a JSON payload</label><textarea id="pgInput" rows="6">${esc('{"user":{"id":"u1","name":"Alice","email":"a@x.com","active":true,"price":1200.5}}')}</textarea>
      <label>Language</label><select id="pgLang" onchange="genCode()"><option value="go">Go struct</option><option value="ts">TypeScript interface</option><option value="py">Python Pydantic</option></select>
      <div style="margin-top:8px"><button class="btn" onclick="genCode()">Generate</button></div>
      <div class="codeOut" id="pgOut" style="margin-top:10px"></div>
    </div>
    <div class="card" style="grid-column:1/-1"><h3 style="margin-bottom:12px">RPC Request / Reply Tester</h3>
      <div class="row">
        <label>Request topic</label><input id="rpcReq" list="tl" value="rpc-req" style="width:180px">
        <label>Reply topic</label><input id="rpcReply" value="rpc-reply" style="width:180px">
        <label>Method</label><input id="rpcMethod" value="getUser" style="width:160px">
        <label>Payload</label><input id="rpcPayload" value='{"id":1}' style="width:220px">
        <button class="btn" onclick="rpcSend()">Send</button>
      </div>
      <div class="muted" style="font-size:11px;margin-top:6px">Sends a message with <code>correlation_id</code> + <code>reply_to_topic</code> headers. A consumer on the reply topic echoes a response for demo.</div>
    </div>
  </div>`; }
window.genCode=function(){ const inp=document.getElementById('pgInput').value; let obj; try{obj=JSON.parse(inp);}catch(e){toast('Invalid JSON');return;} const lang=document.getElementById('pgLang').value; const out=document.getElementById('pgOut'); out.textContent=objToCode(obj,lang); };
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function tsType(v){if(v===null)return'unknown';if(Array.isArray(v))return (v.length?'Array<'+tsType(v[0])+'>':'unknown[]');if(typeof v==='object')return'Record<string, unknown>';if(typeof v==='number')return v%1===0?'number':'number';if(typeof v==='boolean')return'boolean';return'string';}
function goType(v){if(Array.isArray(v))return '[]'+goType(v[0]||'string');if(typeof v==='object')return 'map[string]any';if(typeof v==='number')return v%1===0?'int64':'float64';if(typeof v==='boolean')return'bool';return'string';}
function pyType(v){if(Array.isArray(v))return'List['+pyType(v[0]||'str')+']';if(typeof v==='object')return'Dict[str, Any]';if(typeof v==='number')return'float';if(typeof v==='boolean')return'bool';return'str';}
function objToCode(obj,lang){
  const name='Payload';
  if(lang==='go'){
    const lines=[]; lines.push('type '+name+' struct {'); for(const k in obj){ lines.push(`\t${cap(k)} ${goType(obj[k])} \`json:"${k}"\``); } lines.push('}'); return lines.join('\n');
  } else if(lang==='ts'){
    const lines=[]; lines.push('export interface '+name+' {'); for(const k in obj){ lines.push(`  ${k}: ${tsType(obj[k])};`); } lines.push('}'); return lines.join('\n');
  } else {
    const lines=[]; lines.push('from pydantic import BaseModel'); lines.push('from typing import Any, List, Dict'); lines.push(''); lines.push('class '+name+'(BaseModel):'); for(const k in obj){ lines.push(`    ${k}: ${pyType(obj[k])}`); } return lines.join('\n');
  }
}
let mockTimer=null;
function mockPayload(tpl){ const rnd=()=>Math.random().toString(36).slice(2,8); const rn=(a,b)=>a+Math.floor(Math.random()*(b-a)); if(tpl==='order')return JSON.stringify({id:rnd(),item:['laptop','phone','tablet','watch'][rn(0,4)],price:rn(50,1500),status:['placed','paid','shipped'][rn(0,3)]}); if(tpl==='iot')return JSON.stringify({device:'dev-'+rn(1,20),temp:rn(150,320)/10,humidity:rn(200,900)/10,ts:Date.now()}); return JSON.stringify({name:['alice','bob','carol','dave'][rn(0,4)],email:'u'+rnd()+'@x.com',price:rn(10,500),uuid:rnd(),status:['active','pending','failed'][rn(0,3)]}); }
window.mockGenStart=function(){ const topic=document.getElementById('mkTopic').value||'demo'; const rate=Math.max(1,Math.min(1000,parseInt(document.getElementById('mkRate').value)||10)); const tpl=document.getElementById('mkTpl').value; const st=document.getElementById('mockStat'); mockGenStop(); let count=0; const interval=Math.max(1,Math.round(1000/rate)); mockTimer=setInterval(async()=>{ try{ await api('/api/v1/topics/'+encodeURIComponent(topic)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:mockPayload(tpl)})}); count++; if(st)st.textContent=count+' msgs sent'; }catch(e){ mockGenStop(); if(st)st.textContent='error: '+e.message; } },interval); };
window.mockGenStop=function(){ if(mockTimer){clearInterval(mockTimer);mockTimer=null;} const st=document.getElementById('mockStat'); if(st)st.textContent+=' (stopped)'; };
window.rpcSend=function(){ const req=document.getElementById('rpcReq').value,reply=document.getElementById('rpcReply').value,method=document.getElementById('rpcMethod').value,payload=document.getElementById('rpcPayload').value; const corr=Math.random().toString(36).slice(2,10); const body={key:corr,value:JSON.stringify({method,request:JSON.parse(payload||'{}'),reply_to:reply}),headers:{correlation_id:corr,reply_to_topic:reply,type:'request'}}; api('/api/v1/topics/'+encodeURIComponent(req)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>toast('RPC request sent @ offset '+r.offset+' (corr '+corr+')')).catch(e=>toast(e.message)); };

/* ================= Fitur 4.2: Stream Topology & Data Flow ================= */
function viewTopology(){
  const tops=state.topics||[]; const grps=state.groups||[];
  let skew='';
  if(tops.length){ const sel=tops[0]; const ps=sel.partitions||[]; const max=Math.max(1,...ps.map(p=>p.logEndOffset||0)); skew=`<div class="card" style="margin-top:16px"><h3 style="margin-bottom:4px">Partition Skew — ${esc(sel.name)}</h3><div class="muted" style="font-size:11px;margin-bottom:4px">Log end offset per partition (hot partition = uneven)</div><div class="skewBar">${ps.map(p=>`<div style="height:${Math.max(4,((p.logEndOffset||0)/max)*100)}%"><span>P${p.partition}</span></div>`).join('')||'<span class="muted">no partitions</span>'}</div></div>`; }
  return `<div class="graph" id="topoGraph" style="height:${Math.max(260,140+tops.length*20+grps.length*16)}px">
    <div class="muted" style="font-size:11px">Producer Apps &#8594; Topics &#8594; Partitions &#8594; Consumer Groups</div>
    <div id="topoNodes"></div>
  </div>${skew}<div class="card" style="margin-top:16px"><h3>Data Flow Legend</h3><div class="row" style="font-size:12px"><span class="badge b-purple">Producer</span><span>&#8594;</span><span class="badge b-green">Topic</span><span>&#8594;</span><span class="badge b-amber">Partition</span><span>&#8594;</span><span class="badge">Group</span></div></div>`; }
function renderTopo(){
  const el=document.getElementById('topoNodes'); if(!el)return;
  const g=document.getElementById('topoGraph'); if(!g)return;
  const W=g.clientWidth||900; const H=g.clientHeight||300;
  const tops=state.topics||[]; const grps=state.groups||[];
  let nodes='';
  const producers=['producer-app-1','producer-app-2'];
  const pY=(i)=>40+i*22;
  producers.forEach((p,i)=>{ nodes+=`<div class="gNode" style="left:10px;top:${pY(i)}px"><div class="glabel">Producer</div>${p}</div>`; });
  const tX=W*0.38, gX=W*0.75;
  tops.forEach((t,i)=>{ const tY=60+i*46; nodes+=`<div class="gNode" style="left:${tX}px;top:${tY}px"><div class="glabel">Topic</div>${esc(t.name)}</div>`; (t.partitions||[]).forEach((p,j)=>{ nodes+=`<div class="gNode" style="left:${tX+120}px;top:${tY+16+j*20}px"><div class="glabel">Part</div>P${p.partition}</div>`; }); });
  grps.forEach((gr,i)=>{ const gY=80+i*26; nodes+=`<div class="gNode" style="left:${gX}px;top:${gY}px"><div class="glabel">Group</div>${esc(gr.name)}</div>`; });
  el.innerHTML=nodes;
}
window.refreshTopo=function(){renderTopo();};

/* ================= Fitur 4.3: Storage & Segment Inspector ================= */
function viewStorage(){
  const tsel=state.topics.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
  return `<div class="grid">
    <div class="card" style="grid-column:1/-1"><div class="row"><h3 style="margin-right:10px">Segment Inspector</h3><select id="stTopic" onchange="loadSegments()" style="width:200px"><option value="">Select topic</option>${tsel}</select></div>
      <div id="segOut" class="muted" style="margin-top:10px;font-size:12px">Select a topic to view segment blocks.</div></div>
    <div class="card" style="grid-column:1/-1"><h3>Time-Travel Replay</h3>
      <div class="row"><label>Offset</label><input id="ttOff" type="number" value="0" style="width:120px"><label>Partition</label><input id="ttPart" type="number" value="0" style="width:100px"><button class="btn ghost" onclick="ttJump()">Jump &amp; View</button></div>
      <div class="muted" style="font-size:11px;margin-top:6px">Loads messages from a chosen offset as a time-travel point in the Data Browser.</div></div>
  </div>`; }
window.loadSegments=async function(){ const t=document.getElementById('stTopic').value; if(!t)return; const out=document.getElementById('segOut'); try{ const ps=await api('/api/v1/topics/'+encodeURIComponent(t)+'/partitions'); let html=''; ps.forEach(p=>{ const segs=p.segments||[]; const total=segs.reduce((a,s)=>a+s.sizeBytes,0); const remote=segs.filter(s=>s.remote).length; html+=`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:11px;font-family:var(--font-mono)"><span>P${p.partition}</span><span class="muted">${segs.length} segments &middot; ${fmtBytes(p.bytes)} &middot; ${remote} tiered</span></div>`; segs.forEach(s=>{ html+=`<div class="segBlock ${s.remote?'remote':(s.sizeBytes===segs[segs.length-1].sizeBytes?'act':'closed')}" title="base ${s.baseOffset} &middot; ${fmtBytes(s.sizeBytes)}">${s.baseOffset} ${s.remote?'&#8679;':''}</div>`; }); html+='</div>'; }); out.innerHTML=html||'<div class="muted">no segments</div>'; }catch(e){out.textContent='error: '+e.message;} };
window.ttJump=function(){ const off=document.getElementById('ttOff').value, part=document.getElementById('ttPart').value; state.off=off; state.partition=part; state.topic=document.getElementById('stTopic').value; if(!state.topic){toast('Select topic first');return;} goView('databrowser').then(()=>loadMsgs()); };

/* ================= Fitur 4.4: Schema Studio ================= */
function viewSchemas(){
  if(!state.schemas.length)return '<div class="card muted">No schemas registered.</div>';
  return `<div class="card"><h3 style="margin-bottom:10px">Schema Registry Studio</h3>
    <div class="row" style="margin-bottom:12px"><select id="schSubject" onchange="loadSchemaDetail()" style="width:220px">${state.schemas.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>
    <button class="btn ghost" onclick="loadSchemaDetail()">Load versions</button></div>
    <div id="schVersions"></div></div>`; }
async function loadSchemaDetail(){ const subj=document.getElementById('schSubject')?.value; if(!subj)return; try{ const vers=await api('/api/v1/schemas/'+encodeURIComponent(subj)); const out=document.getElementById('schVersions'); out.innerHTML=`<table><thead><tr><th>Version</th><th>Type</th><th>Schema</th><th>Compat</th></tr></thead><tbody>${vers.slice().reverse().map(v=>`<tr><td>${v.version}</td><td class="badge b-purple">${esc(v.schemaType||'AVRO')}</td><td style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.schema)}</td><td><button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="schemaDiff('${esc(subj)}',${v.version})">Diff prev</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">no versions</td></tr>'}</tbody></table>`; }catch(e){toast(e.message);} }
window.schemaDiff=function(subj,ver){ const el=document.getElementById('schVersions'); if(!el)return; api('/api/v1/schemas/'+encodeURIComponent(subj)).then(vers=>{ const cur=vers.find(v=>v.version===ver); const prev=vers.find(v=>v.version===ver-1); if(!cur||!prev){toast('No previous version to diff');return;} const a=fmtSchema(prev.schema), b=fmtSchema(cur.schema); const la=a.split('\n'), lb=b.split('\n'); const max=Math.max(la.length,lb.length); let html='<div class="diffWrap" style="margin-top:8px">'; for(let i=0;i<max;i++){ const x=la[i]||'',y=lb[i]||''; const same=x.trim()===y.trim(); html+=`<div style="flex:1;font-family:var(--font-mono);font-size:11px"><div class="${same?'d-ctx':'d-rem'}">${esc(x||' ')}</div></div>`; html+=`<div style="flex:1;font-family:var(--font-mono);font-size:11px"><div class="${same?'d-ctx':'d-add'}">${esc(y||' ')}</div></div>`; } html+='</div>'; el.innerHTML+=`<div style="margin-top:14px"><b style="font-size:12px">Diff v${prev.version} &#8594; v${cur.version}</b>${html}</div>`; }).catch(e=>toast(e.message)); };
function fmtSchema(s){ try{return JSON.stringify(JSON.parse(s),null,2);}catch(e){return s;} }

/* ================= Fitur 4.5: Security & ACL + Audit ================= */
function viewSecurity(){
  return `<div class="grid">
    <div class="card" style="grid-column:1/-1"><div class="row"><h3 style="margin-right:10px">Visual ACL Manager</h3>
      <button class="btn" onclick="addACLRow()">+ Add ACL</button>
      <button class="btn ghost" onclick="loadACLs()">Refresh</button></div>
      <div class="muted" style="font-size:11px;margin:6px 0 10px">Grant Read / Write / Admin per topic or group. Changes are stored in-memory on the broker.</div>
      <div id="aclOut" class="muted">Loading...</div></div>
    <div class="card" style="grid-column:1/-1"><h3>Audit Trail</h3>
      <button class="btn ghost" style="margin-bottom:10px" onclick="loadAudit()">Refresh audit log</button>
      <table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Detail</th></tr></thead><tbody id="auditBody"><tr><td colspan="5" class="muted">No activity yet.</td></tr></tbody></table></div>
  </div>`; }
async function loadACLs(){ const out=document.getElementById('aclOut'); if(!out)return; try{ const acls=await api('/api/v1/acls'); const principals=[...new Set(acls.map(a=>a.principal))]; const resources=[...new Set(acls.map(a=>a.resourceName))]; out.innerHTML=`<table><thead><tr><th>Principal</th><th>Resource</th><th>Read</th><th>Write</th><th>Admin</th><th></th></tr></thead><tbody>${acls.map(a=>`<tr><td class="mono">${esc(a.principal)}</td><td class="mono">${esc(a.resourceType)}:${esc(a.resourceName)}</td>${['Read','Write','Admin'].map(o=>`<td><button class="toggle ${a.operations.includes(o)?'on':''}" onclick="toggleOp('${esc(a.principal)}','${esc(a.resourceType)}','${esc(a.resourceName)}','${o}')" title="${o}"></button></td>`).join('')}<td><button class="btn danger" style="padding:2px 8px;font-size:11px" onclick="delACL('${esc(a.principal)}','${esc(a.resourceType)}','${esc(a.resourceName)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No ACLs defined.</td></tr>'}</tbody></table>`; }catch(e){out.textContent='error: '+e.message;} }
window.addACLRow=function(){ const el=document.createElement('div'); el.innerHTML=`<div class="overlay"><div class="modal"><h3>Add ACL</h3><label>Principal (user)</label><input id="aUser" placeholder="app-writer"><label>Resource type</label><select id="aType"><option value="topic">topic</option><option value="group">group</option></select><label>Resource name</label><input id="aName" placeholder="orders"><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="aclsave()">Add</button><button class="btn ghost" onclick="closeOverlay()">Cancel</button></div></div></div>`; document.body.appendChild(el); };
window.aclsave=async function(){ const u=document.getElementById('aUser').value,t=document.getElementById('aType').value,n=document.getElementById('aName').value; if(!u||!n){toast('principal and resource required');return;} try{ await api('/api/v1/acls',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({principal:u,resourceType:t,resourceName:n,operations:['Read']})}); closeOverlay(); loadACLs(); loadAudit(); }catch(e){toast(e.message);} };
window.toggleOp=async function(p,rt,rn,op){ try{ const acls=await api('/api/v1/acls'); const rule=acls.find(a=>a.principal===p&&a.resourceType===rt&&a.resourceName===rn); const ops=(rule&&rule.operations)||[]; const has=ops.includes(op); const next=has?ops.filter(x=>x!==op):[...ops,op]; await api('/api/v1/acls',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({principal:p,resourceType:rt,resourceName:rn,operations:next})}); loadACLs(); }catch(e){toast(e.message);} };
window.delACL=async function(p,rt,rn){ try{ await api('/api/v1/acls',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({principal:p,resourceType:rt,resourceName:rn})}); loadACLs(); loadAudit(); }catch(e){toast(e.message);} };
async function loadAudit(){ const b=document.getElementById('auditBody'); if(!b)return; try{ const log=await api('/api/v1/audit'); b.innerHTML=log.map(e=>`<tr><td class="mono">${new Date(e.time).toISOString()}</td><td>${esc(e.actor)}</td><td class="chip">${esc(e.action)}</td><td class="mono">${esc(e.resource)}</td><td>${esc(e.detail)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No activity yet.</td></tr>'; }catch(e){b.innerHTML='<tr><td colspan="5" class="muted">error</td></tr>';} }
window.refreshSecurity=function(){loadACLs();loadAudit();};

/* ================= Fitur 4.6: In-App Health Alarms ================= */
function checkAlarms(){
  const alerts=[];
  // Consumer lag > 1000
  const gs=Array.isArray(state.groups)?state.groups:[];
  for(const g of gs){ const lag=Object.values(g.lag||{}).reduce((a,b)=>a+b,0); if(lag>1000){ alerts.push('Consumer lag '+lag+' on group '+g.name+' (>1000)'); } }
  // Disk usage > 85% (uses the broker's data dir; cluster reports totalBytes as a proxy)
  const c=state.cluster||{};
  if(c.diskUsagePct && c.diskUsagePct>85){ alerts.push('Disk usage '+c.diskUsagePct+'% (>85%)'); }
  // DLQ error: any topic ending in -dlq/-dead with messages
  for(const t of (Array.isArray(state.topics)?state.topics:[])){ if(/-(dlq|dead)$/i.test(t.name)){ alerts.push('DLQ topic '+t.name+' has messages'); } }
  const existing=document.getElementById('alarmBanner');
  if(alerts.length){ if(!existing){ const b=document.createElement('div'); b.id='alarmBanner'; b.className='alarmBanner'; document.body.prepend(b); } const b=document.getElementById('alarmBanner'); b.innerHTML='&#9888; '+alerts.map(esc).join(' &middot; ')+' <button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="this.closest(\'#alarmBanner\').remove()">Dismiss</button>'; }
  else if(existing){ existing.remove(); }
}
function bindView(){ if(state.view==='databrowser'&&state.topic)loadMsgs(); if(state.view==='groups'&&state.group)loadGroupDetail(); if(state.view==='topology')renderTopo(); if(state.view==='security'){loadACLs();loadAudit();} if(state.view==='storage'){ } }
initTheme();
(async function(){await refresh();applyHash();})();
