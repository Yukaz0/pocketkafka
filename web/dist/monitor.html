<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketKafka Monitor</title>
<link href="https://fonts.cdnfonts.com/css/jetbrains-mono" rel="stylesheet">
<style>
  /*
    Typography: JetBrains Mono is the page typeface (not a sans UI font with
    mono for numbers). Reason: this page is read almost entirely as offsets,
    rates, and topic names by broker operators, so a monospace grid keeps
    every column aligned and every digit unambiguous. The local-first stack
    keeps the page correct if the CDN is unreachable (isolated/SCADA networks).
  */
  :root{
    color-scheme:dark;
    --bg:#12141a; --surface:#1b1e24; --surface2:#22262e; --surface3:#2a2f39;
    --border:#2e3440; --border-soft:rgba(255,255,255,.07);
    --primary:#4c7dff; --primary-text:#8ab0ff;
    --live:#3ecf8e; --warn:#e8b339; --danger:#f16a5c;
    --text:#e8ecf3; --muted:#98a2b3;
    --font-mono:'JetBrains Mono','JetBrainsMono Nerd Font','JetBrainsMonoNL Nerd Font',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --radius:4px;
    --focus:0 0 0 2px var(--bg),0 0 0 4px var(--primary);
  }
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#f0f2f5; --surface:#ffffff; --surface2:#eef0f3; --surface3:#e5e8ee;
    --border:#d2d6de; --border-soft:rgba(15,18,25,.08);
    --primary:#2f5fe0; --primary-text:#1f47b8;
    --live:#1a7a4c; --warn:#8a5a00; --danger:#b23a2c;
    --text:#171b22; --muted:#4b5563;
    --focus:0 0 0 2px var(--bg),0 0 0 4px var(--primary);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{max-width:100%;overflow-x:hidden}
  body{
    background:var(--bg);color:var(--text);font-family:var(--font-mono);
    font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
    font-display:swap;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:16px;min-width:0}
  a{color:var(--primary-text)}

  :focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius)}
  :focus:not(:focus-visible){outline:none}

  button,select,input{font-family:var(--font-mono);font-size:12.5px;color:var(--text)}

  /* ---- header: dense fact row instead of six stat cards ---- */
  .head{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
  .headTop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .headTop h1{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .headTop .status{font-weight:600}
  .headTop .status.st-healthy{color:var(--live)}
  .headTop .status.st-degraded{color:var(--warn)}
  .headTop .status.st-critical{color:var(--danger)}
  .headTop .status.st-idle{color:var(--muted)}
  .headTop .status::before{content:"● ";font-size:10px}
  .headSpacer{flex:1}
  .facts{display:flex;flex-wrap:wrap;gap:16px 22px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border-soft);padding-top:8px}
  .facts .f b{color:var(--text);font-weight:600}
  .facts .f .u{color:var(--muted);margin-left:2px}

  /* controls */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .controls label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  select,button{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 9px}
  button{cursor:pointer}
  button:hover{background:var(--surface3)}
  .controls .spacer{flex:1}

  .notice{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:var(--radius);padding:9px 12px;margin-bottom:12px;color:var(--danger);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
  .notice.warn{border-left-color:var(--warn);color:var(--warn)}
  .notice[hidden]{display:none}
  .notice .retry{align-self:flex-start;margin-top:2px;color:var(--text);background:var(--surface2)}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;min-width:0}
  .panel > h2{font-size:12.5px;font-weight:600;color:var(--text);padding:9px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .panel > h2 .unit{color:var(--muted);font-weight:400;font-size:11.5px}
  .panel .body{padding:12px}
  .panel .body.tight{padding:0}
  .tableScroll{overflow-x:auto}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:11.5px;cursor:pointer;user-select:none}
  th.nosort{cursor:default}
  th.sorted{color:var(--text)}
  th button.sortBtn{background:none;border:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;white-space:nowrap}
  tbody tr.row{cursor:pointer}
  tbody tr.row:hover{background:var(--surface2)}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-family:var(--font-mono)}
  .topicname{color:var(--text)}
  .up{color:var(--danger)} .down{color:var(--live)} .flat{color:var(--muted)}
  .muted{color:var(--muted)}
  .detail td{background:var(--bg);white-space:normal}
  .detail-inner{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 0}
  @media (max-width:860px){.detail-inner{grid-template-columns:1fr}}
  .detail h3{font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
  ul.reasons{list-style:none;display:flex;flex-direction:column;gap:5px}
  ul.reasons li{display:flex;gap:7px;align-items:flex-start;font-size:12px}
  .tag{font-size:10.5px;border:1px solid var(--border);border-radius:var(--radius);padding:1px 5px;color:var(--muted);white-space:nowrap}
  .tag.warn{color:var(--warn);border-color:var(--warn)}
  .tag.critical{color:var(--danger);border-color:var(--danger)}
  .statusText{font-weight:600}
  .statusText.st-healthy{color:var(--live)} .statusText.st-degraded{color:var(--warn)}
  .statusText.st-critical{color:var(--danger)} .statusText.st-idle{color:var(--muted)}
  canvas{display:block;width:100%;height:110px}
  .empty{color:var(--muted);padding:14px 12px;font-size:12.5px;line-height:1.6}
  .foot{color:var(--muted);font-size:11.5px;padding:4px 2px 20px;display:flex;gap:16px;flex-wrap:wrap}
  form.login{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  form.login input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 8px}
  .skeleton{color:var(--muted);padding:14px 12px;font-size:12.5px}
  /* R-03: touch targets. Dense operator density is right on desktop, but a
     phone needs 44px controls; the sort buttons stay compact inside the
     table header so the row grid does not grow. */
  @media (max-width:600px){
    select,button:not(.sortBtn){min-height:44px;padding:10px 12px}
    .controls{gap:12px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="headTop">
      <h1>PocketKafka Monitor</h1>
      <span id="clusterStatus" class="status st-idle">loading</span>
      <div class="headSpacer"></div>
      <button id="themeBtn" type="button" aria-label="Toggle color theme">Theme</button>
    </div>
    <div class="facts" id="facts">
      <span class="f">cluster <b>-</b></span>
    </div>
  </div>

  <div class="controls">
    <label>Window
      <select id="window">
        <option value="60">1m</option>
        <option value="300" selected>5m</option>
        <option value="900">15m</option>
      </select>
    </label>
    <label>Refresh
      <select id="interval">
        <option value="2000">2s</option>
        <option value="5000" selected>5s</option>
        <option value="10000">10s</option>
        <option value="0">off</option>
      </select>
    </label>
    <button id="refreshBtn" type="button">Refresh now</button>
    <div class="spacer"></div>
  </div>

  <div id="notice" class="notice" hidden role="alert"></div>

  <div id="loginPanel" class="panel" hidden>
    <h2>Session required</h2>
    <div class="body">
      <div class="muted" style="margin-bottom:10px">The broker requires authentication for API calls. Sign in with an account from security.users.</div>
      <form class="login" id="loginForm">
        <label>Username <input id="loginUser" placeholder="username" autocomplete="username" required></label>
        <label>Password <input id="loginPass" type="password" placeholder="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
      <div id="loginErr" class="muted" style="margin-top:8px" role="alert"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Messages per second, last <span id="rateWindowLabel">-</span><span class="unit" id="rateMeta"></span></h2>
    <div class="body">
      <canvas id="rateChart" role="img" aria-label="Cluster messages per second over the selected window"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2>Total consumer lag, last <span id="lagWindowLabel">-</span><span class="unit" id="lagMeta"></span></h2>
    <div class="body">
      <canvas id="lagChart" role="img" aria-label="Cluster total consumer lag over the selected window"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2>Needs attention<span class="unit" id="attnCount"></span></h2>
    <div class="body tight" id="attention"></div>
  </div>

  <div class="panel">
    <h2>Topics<span class="unit" id="topicCount"></span></h2>
    <div class="body tight">
      <div class="tableScroll">
      <table id="topicTable">
        <thead>
          <tr>
            <th data-sort="status" style="width:96px"><button class="sortBtn" type="button">Status</button></th>
            <th data-sort="name"><button class="sortBtn" type="button">Topic</button></th>
            <th data-sort="partitions" class="num"><button class="sortBtn" type="button">Parts</button></th>
            <th data-sort="messagesPerSec" class="num"><button class="sortBtn" type="button">Msgs/s</button></th>
            <th data-sort="bytesPerSec" class="num"><button class="sortBtn" type="button">Bytes/s</button></th>
            <th data-sort="messages" class="num"><button class="sortBtn" type="button">Messages</button></th>
            <th data-sort="bytes" class="num"><button class="sortBtn" type="button">Size</button></th>
            <th data-sort="lag" class="num"><button class="sortBtn" type="button">Lag</button></th>
            <th data-sort="lagPerSec" class="num"><button class="sortBtn" type="button">Lag/s</button></th>
            <th class="nosort">Trend</th>
            <th data-sort="lastAppendAgeMs" class="num"><button class="sortBtn" type="button">Last msg</button></th>
            <th class="nosort">Series</th>
          </tr>
        </thead>
        <tbody id="topicBody"></tbody>
      </table>
      </div>
      <div id="topicEmpty" class="empty" hidden></div>
    </div>
  </div>

  <div class="panel">
    <h2>Consumer groups<span class="unit" id="groupCount"></span></h2>
    <div class="body tight">
      <div class="tableScroll">
      <table id="groupTable">
        <thead>
          <tr>
            <th data-sort="name"><button class="sortBtn" type="button">Group</button></th>
            <th data-sort="state"><button class="sortBtn" type="button">State</button></th>
            <th data-sort="members" class="num"><button class="sortBtn" type="button">Members</button></th>
            <th data-sort="topics" class="num"><button class="sortBtn" type="button">Topics</button></th>
            <th data-sort="lag" class="num"><button class="sortBtn" type="button">Lag</button></th>
            <th data-sort="lagPerSec" class="num"><button class="sortBtn" type="button">Lag/s</button></th>
            <th class="nosort">Flag</th>
          </tr>
        </thead>
        <tbody id="groupBody"></tbody>
      </table>
      </div>
      <div id="groupEmpty" class="empty" hidden></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
let state = { data:null, timer:null, sortKey:'status', sortDir:-1, expanded:new Set(), authed:true };

function fmtNum(n){ if(n===null||n===undefined) return '-'; return Number(n).toLocaleString('en-US'); }
function fmtBytes(n){
  if(n===null||n===undefined) return '-';
  const u=['B','KB','MB','GB','TB']; let i=0, v=Number(n);
  while(v>=1024 && i<u.length-1){ v/=1024; i++; }
  return (i===0? v.toFixed(0) : v.toFixed(v<10?2:1))+' '+u[i];
}
function fmtRate(n){ if(!n) return '0'; if(Math.abs(n)<1) return n.toFixed(2); if(Math.abs(n)<100) return n.toFixed(1); return fmtNum(Math.round(n)); }
function fmtAge(ms){ if(ms===null||ms===undefined) return '-'; if(ms<1000) return 'now'; const s=ms/1000; if(s<60) return Math.floor(s)+'s'; const m=s/60; if(m<60) return Math.floor(m)+'m'; const h=m/60; if(h<24) return Math.floor(h)+'h'; return Math.floor(h/24)+'d'; }
function fmtWindow(sec){ if(sec>=60) return (sec/60)+'m'; return sec+'s'; }

// A rate we cannot stand behind (history shorter than the window) is shown as
// n/a instead of a misleading 0. Baseline traffic that arrived before
// monitoring started would otherwise read as "no traffic".
function rateText(value, reliable){
  if(reliable===false) return 'n/a';
  return fmtRate(value);
}

function statusText(status){
  const s=document.createElement('span'); s.className='statusText st-'+status; s.textContent=status; return s;
}
function tag(text, sev){
  const s=document.createElement('span'); s.className='tag'+(sev&&sev!=='info'?' '+sev:''); s.textContent=text; return s;
}
function trendCell(tr){
  const s=document.createElement('span'); s.className=tr.trend; s.textContent=tr.trend; return s;
}
function td(value, cls){
  const cell=document.createElement('td');
  if(cls) cell.className=cls;
  cell.textContent=value===''? '' : value;
  return cell;
}

function render(){
  const d=state.data;
  if(!d) return;
  const c=d.cluster;

  const statusEl=$('clusterStatus');
  statusEl.textContent=c.status;
  statusEl.className='status st-'+c.status;

  // Header facts: the six numbers that used to live in stat cards, now a
  // dense readable row instead of six uniform boxes.
  const facts=$('facts'); facts.textContent='';
  const rateReliable=d.sampling.rateReliable!==false;
  const factList=[
    ['cluster', c.clusterId],
    ['broker', String(c.brokerId)],
    ['version', c.version],
    ['uptime', fmtAge(c.uptimeSeconds*1000)],
    ['security', c.security||'plaintext'],
    ['topics', fmtNum(c.topics)+' ('+fmtNum(c.partitions)+' partitions)'],
    ['groups', fmtNum(c.groups)],
    ['throughput', rateReliable? fmtRate(c.messagesPerSec)+' msg/s, '+fmtBytes(c.bytesPerSec)+'/s' : 'n/a, settling'],
    ['messages stored', fmtNum(c.totalMessages)+' ('+fmtBytes(c.totalBytes)+')'],
    ['consumer lag', fmtNum(c.lag)+' (worst partition '+fmtNum(c.maxPartitionLag)+')'],
    ['disk', (c.diskUsagePct||0).toFixed(1)+'%'],
  ];
  factList.forEach(([k,v])=>{
    const wrap=document.createElement('span'); wrap.className='f';
    wrap.append(k+' ');
    const b=document.createElement('b'); b.textContent=v===undefined||v===null||v===''?'-':String(v); wrap.appendChild(b);
    facts.appendChild(wrap);
  });

  // Notice: warmup + rate-settling + cluster reasons, each kept distinct so
  // "not enough samples yet" is never confused with "rate math is unsafe".
  const notice=$('notice'); notice.textContent=''; notice.hidden=true;
  const msgs=[];
  if(d.sampling.warmup) msgs.push({text:'Warming up: only '+d.sampling.samples+' sample(s) in the window so far, rates are not reliable yet.', warn:true});
  if(!d.sampling.warmup && d.sampling.rateReliable===false) msgs.push({text:'Rates show as n/a until sample history covers the full '+fmtWindow(d.sampling.windowSeconds)+' window. This avoids counting traffic that arrived before monitoring started as zero.', warn:true});
  (c.reasons||[]).forEach(r=>msgs.push({text:r.message, warn:r.severity!=='critical'}));
  if(msgs.length){
    notice.hidden=false;
    notice.className='notice'+(msgs.some(m=>!m.warn)?'':' warn');
    msgs.slice(0,5).forEach(m=>{
      const div=document.createElement('div');
      if(!m.warn) div.style.color='var(--danger)';
      div.textContent=(m.warn?'Warning: ':'Critical: ')+m.text;
      notice.appendChild(div);
    });
  }

  // Charts: each answers a named question with its own unit, not a generic
  // "Overview" placed because the layout looked bare.
  const hist=d.history||[];
  const winLabel=fmtWindow(d.sampling.windowSeconds);
  $('rateWindowLabel').textContent=winLabel;
  $('lagWindowLabel').textContent=winLabel;
  drawChart($('rateChart'), hist.map(p=>p.messagesPerSec), getVar('--primary'));
  drawChart($('lagChart'), hist.map(p=>p.lag), getVar('--warn'));
  if(hist.length){
    const r=hist.map(p=>p.messagesPerSec), l=hist.map(p=>p.lag);
    $('rateMeta').textContent=' : '+hist.length+' samples, min '+fmtRate(Math.min(...r))+', max '+fmtRate(Math.max(...r));
    $('lagMeta').textContent=' : '+hist.length+' samples, min '+fmtNum(Math.min(...l))+', max '+fmtNum(Math.max(...l));
  } else {
    $('rateMeta').textContent=' : no history yet';
    $('lagMeta').textContent=' : no history yet';
  }

  // Attention.
  const att=d.attention||[];
  $('attnCount').textContent=' : '+(att.length? att.length+' topic(s)' : 'all clear');
  const ab=$('attention'); ab.textContent='';
  if(!att.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='No topic is degraded or critical right now. This list repopulates automatically the moment a topic crosses a threshold from the footer line.';
    ab.appendChild(e);
  } else {
    att.forEach(t=>ab.appendChild(attentionRow(t)));
  }

  // Topics.
  const topics=sortTopics(d.topics||[]);
  $('topicCount').textContent=' : '+topics.length+' total';
  const tb=$('topicBody'); tb.textContent='';
  const topicEmpty=$('topicEmpty');
  topicEmpty.hidden=topics.length>0;
  if(!topics.length){
    topicEmpty.textContent='No topics on this broker yet. Produce a message through the Kafka listener, the REST proxy, or the main dashboard, then refresh.';
  }
  topics.forEach(t=>{
    tb.appendChild(topicRow(t));
    if(state.expanded.has(t.name)) tb.appendChild(topicDetailRow(t));
  });

  // Groups: the API returns one merged list, including groups that stopped
  // consuming but still hold committed offsets (stalled).
  const groups=(d.groups||[]).slice();
  $('groupCount').textContent=' : '+groups.length+' total';
  const gb=$('groupBody'); gb.textContent='';
  const groupEmpty=$('groupEmpty');
  groupEmpty.hidden=groups.length>0;
  if(!groups.length){
    groupEmpty.textContent='No consumer group has committed offsets on this broker yet. Start a consumer against any topic to see it here.';
  }
  groups.forEach(g=>{
    const tr=document.createElement('tr');
    tr.appendChild(td(g.name,'topicname'));
    tr.appendChild(td(g.state,'muted'));
    tr.appendChild(td(fmtNum(g.members),'num'));
    tr.appendChild(td(fmtNum((g.topics||[]).length),'num'));
    tr.appendChild(td(fmtNum(g.lag),'num'));
    const lagRate=td(fmtRate(g.lagPerSec),'num');
    if(g.lagPerSec>0.5) lagRate.className='num up';
    if(g.lagPerSec<-0.5) lagRate.className='num down';
    tr.appendChild(lagRate);
    const flag=document.createElement('td');
    if(g.stalled) flag.appendChild(tag('no members','warn'));
    tr.appendChild(flag);
    gb.appendChild(tr);
  });

  $('foot').textContent='';
  const foot=$('foot');
  const footFacts=[
    'generated '+new Date(d.generatedAtMs).toLocaleTimeString(),
    'window '+winLabel,
    'samples '+d.sampling.samples,
    'rate '+(d.sampling.rateReliable?'exact':'settling'),
    'thresholds: lag>'+fmtNum(d.thresholds.lagWarn)+' warn, >'+fmtNum(d.thresholds.lagCritical)+' crit, disk>'+d.thresholds.diskWarnPct+'% warn, >'+d.thresholds.diskCritPct+'% crit'
  ];
  footFacts.forEach(text=>{
    const span=document.createElement('span'); span.textContent=text; foot.appendChild(span);
  });
}

function getVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#4c7dff';
}

function attentionRow(t){
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--border-soft)';
  row.appendChild(statusText(t.status));
  const box=document.createElement('div'); box.style.flex='1';
  const name=document.createElement('div'); name.className='topicname'; name.textContent=t.name; box.appendChild(name);
  (t.reasons||[]).forEach(r=>{
    const line=document.createElement('div'); line.className='muted'; line.style.fontSize='12px';
    line.textContent=r.message; box.appendChild(line);
  });
  row.appendChild(box);
  const jump=document.createElement('button');
  jump.type='button';
  jump.textContent='details';
  jump.onclick=()=>{ state.expanded.add(t.name); render(); };
  row.appendChild(jump);
  return row;
}

function topicRow(t){
  const tr=document.createElement('tr'); tr.className='row'; tr.tabIndex=0;
  tr.setAttribute('role','button');
  tr.setAttribute('aria-expanded', state.expanded.has(t.name) ? 'true' : 'false');
  const st=document.createElement('td'); st.appendChild(statusText(t.status)); tr.appendChild(st);
  tr.appendChild(td(t.name,'topicname'));
  tr.appendChild(td(fmtNum(t.partitions),'num'));
  tr.appendChild(td(rateText(t.messagesPerSec,t.rateReliable),'num'));
  tr.appendChild(td(t.rateReliable===false?'n/a':fmtBytes(t.bytesPerSec),'num'));
  tr.appendChild(td(fmtNum(t.messages),'num'));
  tr.appendChild(td(fmtBytes(t.bytes),'num'));
  const lagCell=td(fmtNum(t.lag),'num');
  if(t.lag>0) lagCell.style.color=t.lagPerSec>0.5?'var(--danger)':'var(--warn)';
  tr.appendChild(lagCell);
  const lr=td(rateText(t.lagPerSec,t.rateReliable),'num');
  if(t.rateReliable!==false && t.lagPerSec>0.5) lr.classList.add('up');
  if(t.rateReliable!==false && t.lagPerSec<-0.5) lr.classList.add('down');
  tr.appendChild(lr);
  const trend=document.createElement('td'); trend.appendChild(trendCell(t)); tr.appendChild(trend);
  tr.appendChild(td(fmtAge(t.lastAppendAgeMs),'num'));
  const spark=document.createElement('td');
  const cv=document.createElement('canvas'); cv.width=140; cv.height=26; cv.style.width='140px'; cv.style.height='26px';
  cv.setAttribute('role','img');
  cv.setAttribute('aria-label', t.name+' recent message rate trend');
  spark.appendChild(cv); tr.appendChild(spark);
  setTimeout(()=>drawSpark(cv, t.sparkline||[]), 0);
  const toggle=()=>{ if(state.expanded.has(t.name)) state.expanded.delete(t.name); else state.expanded.add(t.name); render(); };
  tr.onclick=toggle;
  tr.onkeydown=(e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } };
  return tr;
}

function topicDetailRow(t){
  const tr=document.createElement('tr'); tr.className='detail';
  const cell=document.createElement('td'); cell.colSpan=12;
  const inner=document.createElement('div'); inner.className='detail-inner';

  const left=document.createElement('div');
  const h=document.createElement('h3'); h.textContent='Why this status'; left.appendChild(h);
  const ul=document.createElement('ul'); ul.className='reasons';
  if(!(t.reasons||[]).length){
    const li=document.createElement('li'); li.className='muted'; li.textContent='No issues detected.'; ul.appendChild(li);
  }
  (t.reasons||[]).forEach(r=>{
    const li=document.createElement('li');
    li.appendChild(tag(r.severity, r.severity));
    const s=document.createElement('span'); s.textContent=r.message+'  ('+r.code+')'; li.appendChild(s);
    ul.appendChild(li);
  });
  left.appendChild(ul);
  const facts=document.createElement('div'); facts.className='muted'; facts.style.cssText='margin-top:10px;font-size:12px';
  facts.textContent='replication factor '+t.replicationFactor+', skew '+t.skewRatio+'x, partitions '+t.partitions+', consumers '+(t.groups||[]).length;
  left.appendChild(facts);

  const right=document.createElement('div');
  const h2=document.createElement('h3'); h2.textContent='Partitions'; right.appendChild(h2);
  const tbl=document.createElement('table');
  const thead=document.createElement('thead'); const htr=document.createElement('tr');
  ['P','Log end','Msgs','Lag','Msgs/s','Size','Skew'].forEach((label,i)=>{
    const th=document.createElement('th'); th.className='nosort'+(i>0?' num':''); th.textContent=label; htr.appendChild(th);
  });
  thead.appendChild(htr); tbl.appendChild(thead);
  const tb=document.createElement('tbody');
  (t.partitionsDetail||[]).forEach(p=>{
    const r=document.createElement('tr');
    r.appendChild(td(String(p.partition)));
    r.appendChild(td(fmtNum(p.logEndOffset),'num'));
    r.appendChild(td(fmtNum(p.messages),'num'));
    r.appendChild(td(fmtNum(p.lag),'num'));
    r.appendChild(td(fmtRate(p.messagesPerSec),'num'));
    r.appendChild(td(fmtBytes(p.bytes),'num'));
    r.appendChild(td(p.skewRatio+'x','num'));
    tb.appendChild(r);
  });
  tbl.appendChild(tb); right.appendChild(tbl);

  if((t.groups||[]).length){
    const h3=document.createElement('h3'); h3.textContent='Groups on this topic'; h3.style.marginTop='12px'; right.appendChild(h3);
    const t2=document.createElement('table'); const b2=document.createElement('tbody');
    t.groups.forEach(g=>{
      const r=document.createElement('tr');
      r.appendChild(td(g.group,'topicname'));
      r.appendChild(td(g.state,'muted'));
      r.appendChild(td(fmtNum(g.members)+' member(s)','num'));
      r.appendChild(td('lag '+fmtNum(g.lag),'num'));
      const rateCell=td(fmtRate(g.lagPerSec)+'/s','num');
      if(g.lagPerSec>0.5) rateCell.classList.add('up');
      r.appendChild(rateCell);
      if(g.stalled){ const c=document.createElement('td'); c.appendChild(tag('no members','warn')); r.appendChild(c); }
      b2.appendChild(r);
    });
    t2.appendChild(b2); right.appendChild(t2);
  }

  inner.append(left,right); cell.appendChild(inner); tr.appendChild(cell);
  return tr;
}

function sortTopics(list){
  const key=state.sortKey, dir=state.sortDir;
  const val=(t)=>{
    if(key==='status') return statusRank(t.status);
    if(key==='lastAppendAgeMs') return t.lastAppendAgeMs===null?Number.MAX_SAFE_INTEGER:t.lastAppendAgeMs;
    const v=t[key];
    return typeof v==='number'? v : String(v===undefined?'':v);
  };
  // Identifiers sort by code point, not by locale collation: ICU treats "_" as
  // ignorable, so localeCompare would rank DATA_OBJECT_SERVER before DATAPOINTS
  // while the API lists them in byte order.
  return list.slice().sort((a,b)=>{
    const x=val(a), y=val(b);
    if(typeof x==='string'||typeof y==='string') return dir*cmpStr(String(x),String(y));
    if(x===y) return cmpStr(String(a.name),String(b.name));
    return dir*(x<y?-1:1);
  });
}
function cmpStr(a,b){ return a<b?-1:(a>b?1:0); }
function statusRank(s){ return s==='critical'?3:s==='degraded'?2:s==='healthy'?1:0; }

function drawChart(cv, values, color){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||600, h=110;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(128,128,128,.25)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=Math.round(i*h/4)+.5; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  if(!values.length) return;
  let min=Math.min(...values), max=Math.max(...values);
  if(max===min){ max=min+1; }
  const pad=max*0.08; max+=pad; min=Math.max(0,min-(min>0?pad:0));
  const X=(i)=> values.length===1? w/2 : (i/(values.length-1))*w;
  const Y=(v)=> h-((v-min)/(max-min))*(h-6)-3;
  ctx.beginPath(); ctx.moveTo(X(0),Y(values[0]));
  values.forEach((v,i)=>{ if(i) ctx.lineTo(X(i),Y(v)); });
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.stroke();
  ctx.lineTo(X(values.length-1),h); ctx.lineTo(X(0),h); ctx.closePath();
  ctx.globalAlpha=.12; ctx.fillStyle=color; ctx.fill(); ctx.globalAlpha=1;
}

function drawSpark(cv, values){
  const dpr=window.devicePixelRatio||1;
  const w=140,h=26;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if(!values.length){ ctx.strokeStyle='rgba(128,128,128,.35)'; ctx.beginPath(); ctx.moveTo(0,h-1.5); ctx.lineTo(w,h-1.5); ctx.stroke(); return; }
  let min=Math.min(...values), max=Math.max(...values);
  if(max===min){ max=min+1; }
  const X=(i)=> values.length===1? w/2 : (i/(values.length-1))*(w-2)+1;
  const Y=(v)=> h-2-((v-min)/(max-min))*(h-5);
  ctx.beginPath(); ctx.moveTo(X(0),Y(values[0]));
  values.forEach((v,i)=>{ if(i) ctx.lineTo(X(i),Y(v)); });
  ctx.strokeStyle=max>0?getVar('--primary'):getVar('--muted'); ctx.lineWidth=1.2; ctx.stroke();
}

function showFetchError(message){
  const notice=$('notice');
  notice.hidden=false;
  notice.className='notice';
  notice.textContent='';
  const line=document.createElement('div'); line.textContent=message; notice.appendChild(line);
  const retry=document.createElement('button'); retry.type='button'; retry.className='retry'; retry.textContent='Try again';
  retry.onclick=load;
  notice.appendChild(retry);
}

async function load(){
  const win=$('window').value;
  try{
    const res=await fetch('/api/v1/health/overview?window='+encodeURIComponent(win),{headers:{'Accept':'application/json'}});
    if(res.status===401){
      state.authed=false; $('loginPanel').hidden=false;
      showFetchError('Authentication required. Sign in below to load the health report.');
      $('notice').className='notice warn';
      return;
    }
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    state.data=await res.json();
    state.authed=true; $('loginPanel').hidden=true;
    $('notice').hidden=true;
    render();
  }catch(err){
    showFetchError('Failed to load the health report (' + err.message + '). The broker may be restarting or unreachable.');
  }
}

function schedule(){
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  const ms=parseInt($('interval').value,10);
  if(ms>0) state.timer=setInterval(load, ms);
}

document.querySelectorAll('#topicTable th[data-sort], #groupTable th[data-sort]').forEach(th=>{
  const btn=th.querySelector('.sortBtn');
  const activate=()=>{
    const key=th.getAttribute('data-sort');
    if(state.sortKey===key){ state.sortDir*=-1; } else { state.sortKey=key; state.sortDir=(key==='name'||key==='status')?1:-1; }
    th.closest('table').querySelectorAll('th').forEach(x=>x.classList.remove('sorted'));
    th.classList.add('sorted');
    render();
  };
  th.onclick=activate;
  // The inner button exists for keyboard/AT users; stop its click from
  // bubbling so a mouse click on it does not toggle twice.
  if(btn) btn.onclick=(e)=>{ e.stopPropagation(); activate(); };
});
$('refreshBtn').onclick=load;
$('window').onchange=load;
$('interval').onchange=schedule;
$('themeBtn').onclick=()=>{
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('pk-monitor-theme', next); }catch(_){}
  render();
};
try{ const saved=localStorage.getItem('pk-monitor-theme'); if(saved) document.documentElement.setAttribute('data-theme', saved); }catch(_){}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(state.timer){clearInterval(state.timer);state.timer=null;} } else { load(); schedule(); } });

$('loginForm').onsubmit=async (e)=>{
  e.preventDefault();
  $('loginErr').textContent='';
  try{
    const res=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.error||('HTTP '+res.status)); }
    $('loginPass').value='';
    await load();
  }catch(err){ $('loginErr').textContent='Sign in failed: '+err.message; }
};

load();
schedule();
</script>
