# Minimal single-service stack: pocketkafka only (no portainer/kadeck/postgres).
services:
  kafka-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: pocketkafka:latest
    container_name: pocketkafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # Kafka API
      - "29092:29092" # Kafka internal
      - "8080:8080"   # Web UI
      - "8081:8081"   # Schema Registry
      - "8082:8082"   # REST Proxy
      - "1883:1883"   # MQTT Bridge
    environment:
      - KAFKA_DATA_DIR=/var/lib/pocketkafka/data
    volumes:
      - kafka_data:/var/lib/pocketkafka/data

volumes:
  kafka_data:
