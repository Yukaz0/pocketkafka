# pocketkafka broker configuration.

broker:
  id: 0
  cluster_id: "pocketkafka-local"
  rack: ""

listeners:
  plain: "0.0.0.0:9092"
  internal: "0.0.0.0:29092"

advertised_listeners:
  plain: "localhost:9092"
  internal: "local-kafka:29092"

storage:
  data_dir: "./data"
  segment_max_bytes: 104857600 # 100MB (default), 10MB for dev
  index_interval_bytes: 4096   # 4KB sparse index interval
  # Durability contract:
  #   none     -> never fsync; OS decides when data hits disk
  #   interval -> fsync every flush_interval_ms and on shutdown (default)
  #   request  -> fsync before the produce ack is returned
  # Independent of this, acks=-1 fsyncs when sync_on_acks_all is true.
  flush_policy: "interval"
  flush_interval_ms: 100
  sync_on_acks_all: true
  retention:
    check_interval_ms: 300000  # 5 minutes
    retention_hours: 168       # 7 days
    retention_bytes: -1        # -1 = unlimited
  tiered:
    enabled: false             # S3/MinIO cold offload (set true to enable)
    endpoint: "http://localhost:9000"
    bucket: "pocketkafka"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    region: "us-east-1"
    prefix: "segments"
    offload_after_hours: 24
    check_interval_ms: 300000

topics:
  auto_create: true
  default_partitions: 1
  default_replication_factor: 1

coordinator:
  session_timeout_ms: 45000     # 45s
  rebalance_timeout_ms: 60000   # 60s
  heartbeat_interval_ms: 3000   # 3s
  offsets_retention_minutes: 10080 # committed offsets idle longer are pruned (0 disables)
  storage_backend: "inmemory"   # inmemory | file (legacy "pebble" is an alias for file)

network:
  max_connections: 10000        # excess connections are refused immediately
  read_buffer_bytes: 65536      # socket SO_RCVBUF
  write_buffer_bytes: 65536     # socket SO_SNDBUF
  max_request_size_bytes: 104857600 # 100MB; also caps HTTP request bodies
  read_timeout_ms: 30000        # bound for reading a frame once it has started
  write_timeout_ms: 30000
  idle_timeout_ms: 120000       # bound for waiting for the next frame

logging:
  level: "info"
  format: "json"

web:
  listen: "0.0.0.0:8080"  # Embedded dashboard (REST + WebSocket live tail)
  enabled: true           # enabled: false starts no dashboard at all
  auth: false             # Require login even with security disabled (uses security.users)
  # Signing key for the login cookie. MUST be changed: startup fails if it is
  # empty or still a placeholder while web.auth or security.enabled is true.
  auth_secret: "change-me-in-production"
  # Multi-cluster monitoring. This dashboard can report the health of other
  # brokers: entries here SEED the list, the UI can edit it afterwards, and the
  # result persists in <data_dir>/__clusters.json (same pattern as the ACLs).
  # Only URLs listed here or added through the UI are ever fetched, so the
  # fan-out can never be turned into a request against an arbitrary address.
  # Per-cluster bearer tokens are entered in the UI and stored write-only in
  # <data_dir>/__cluster_tokens.json (0600); they never appear in any response.
  # clusters:
  #   - name: "staging"
  #     url: "http://192.168.212.26:8080"
  # Bearer token THIS broker accepts from another broker's dashboard that
  # aggregates its health report. Empty disables this health-only credential.
  # Must be at least 16 characters. It grants reads only: mutations still
  # require an ACL grant.
  # cluster_token: ""
  # Separately, security-enabled cluster Admins can issue principal-bound dashboard
  # bearer tokens with POST /api/v1/auth/delegated-tokens. The raw value is returned
  # once; its SHA-256 verifier is persisted in <data_dir>/__dashboard_tokens.json
  # with mode 0600. This credential is distinct from cluster_token.
  # Key that seals stored credentials (the per-cluster tokens above) at rest.
  # Empty uses KAFKA_SECRETS_KEY, and failing that a key file is generated once
  # inside the data dir with mode 0600: back that file up, because without it
  # the stored tokens cannot be read. Set it to at least 16 characters.
  # secrets_key: ""
  #
  # NOTE: every state-changing /api request must now carry the header
  # "X-PocketKafka-Request: 1" (the dashboard sends it automatically). A script
  # or curl call that POSTs, PUTs or DELETEs, including /api/v1/auth/login,
  # needs it too, otherwise the request is refused with 403.

schema_registry:
  listen: "0.0.0.0:8081"  # Confluent-compatible Schema Registry

gateway:
  listen: "0.0.0.0:8082"  # HTTP REST Proxy

mqtt:
  listen: "0.0.0.0:1883"  # MQTT Bridge (IoT)

security:
  # disabled -> allow-all (historical behaviour). enabled -> default-deny:
  # Kafka, REST proxy, MQTT and the web dashboard all require identity and are
  # checked against the ACLs under <data_dir>/__acls.json.
  enabled: false
  users:
    - username: "app"
      password: "changeme"
